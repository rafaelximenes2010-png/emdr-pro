<style>
/* Layout: clinical workspace — deep-green rail + working canvas on creme; the EMDR stage is its own dark room */
:root{
  --bg:#F4F1E8; --surface:#FFFEFB; --surface-2:#F8F6EF; --ink:#232A1E; --muted:#5F6855; --line:#DEDCCD;
  --deep:#3D4E30; --sage:#8A9B74; --sage-soft:#E7EADB; --gold:#977536; --gold-soft:#F2EAD7;
  --accent:#4A5D39; --on-accent:#F8F5EC;
  --nav-bg:#2F3B27; --nav-ink:#EEEADC; --nav-muted:#AEB79C; --nav-hover:#3B4932; --nav-gold:#D6BE82;
  --ok:#2C7650; --ok-soft:#DFEEE5; --warn:#9A6A12; --warn-soft:#F5EAD2; --bad:#A0413A; --bad-soft:#F6E2DF;
  --shadow:0 1px 2px rgba(27,40,34,.06),0 8px 24px rgba(27,40,34,.07);
  --f-display:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13170F; --surface:#1A2016; --surface-2:#20271B; --ink:#ECEADF; --muted:#A3AA94; --line:#2F3828;
  --deep:#C3D3AA; --sage:#8FA377; --sage-soft:#273022; --gold:#D6BA78; --gold-soft:#342C1A;
  --accent:#AFC290; --on-accent:#141A10;
  --nav-bg:#0E120B; --nav-ink:#E6E3D5; --nav-muted:#8E987D; --nav-hover:#1C2417; --nav-gold:#D6BE82;
  --ok:#7FCB9D; --ok-soft:#18301F; --warn:#E2B55B; --warn-soft:#352A15; --bad:#E78E85; --bad-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13170F; --surface:#1A2016; --surface-2:#20271B; --ink:#ECEADF; --muted:#A3AA94; --line:#2F3828;
  --deep:#C3D3AA; --sage:#8FA377; --sage-soft:#273022; --gold:#D6BA78; --gold-soft:#342C1A;
  --accent:#AFC290; --on-accent:#141A10;
  --nav-bg:#0E120B; --nav-ink:#E6E3D5; --nav-muted:#8E987D; --nav-hover:#1C2417; --nav-gold:#D6BE82;
  --ok:#7FCB9D; --ok-soft:#18301F; --warn:#E2B55B; --warn-soft:#352A15; --bad:#E78E85; --bad-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:2.35rem;line-height:1.1}
h1 em{font-style:italic;color:var(--gold);font-weight:500}
h2{font-size:1.5rem;line-height:1.2;font-weight:600}
h3{font-size:1.2rem;line-height:1.25;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sp{flex:1}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100%}
.nav{background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;gap:26px;padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand-logo{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--nav-gold)}
.brand-txt{min-width:0}
.brand-txt b{font-family:var(--f-display);font-weight:500;font-size:1.5rem;display:block;line-height:1;color:var(--nav-ink)}
.brand-role{display:block;font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;color:var(--nav-gold);margin-top:5px}
.brand-txt small{display:block;color:var(--nav-muted);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;margin-top:6px}
.brand-app{width:100%;font-size:.72rem;color:var(--nav-muted);border-top:1px solid var(--nav-hover);padding-top:10px;letter-spacing:.03em}
.brand-app b{font-family:var(--f-body);font-size:.72rem;font-weight:700;color:var(--nav-ink);letter-spacing:.08em;display:inline}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:6px}
.pillars div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.pillars svg{width:40px;height:40px;color:var(--accent);margin-bottom:4px}
.pillars b{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.pillars span{font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:1.05rem}
.nav-links{display:flex;flex-direction:column;gap:2px}
.nav-links a,.nav-soon{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-weight:500;font-size:.94rem;white-space:nowrap}
.nav-links a:hover{background:var(--nav-hover)}
.nav-links a[aria-current="page"]{background:var(--nav-hover);box-shadow:inset 2px 0 0 var(--gold)}
.nav-links svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-sep{height:1px;background:var(--nav-hover);margin:10px 4px}
.nav-soon{color:var(--nav-muted);cursor:default}
.nav-soon i{font-style:normal;font-size:.68rem;border:1px solid var(--nav-muted);border-radius:99px;padding:0 7px;margin-left:auto;letter-spacing:.04em}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.nav-foot label{color:var(--nav-muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.nav-foot select{background:var(--nav-hover);border:1px solid var(--nav-hover);border-radius:8px;padding:8px;color:var(--nav-ink)}
.who{color:var(--nav-muted);font-size:.8rem}

.main{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--gold-soft);color:var(--ink);font-size:.82rem;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-bar b{font-weight:600}
.view{padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%}
.view-in{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-inline:clamp(0px,1.6vw,18px)}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.page-head .sub{color:var(--muted);margin-top:4px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--sage)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:transparent;font-size:1.4rem;line-height:1;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 13px;font-weight:600;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sage-soft);color:var(--deep)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.pill.st-agendado{background:var(--sage-soft);color:var(--deep)}
.pill.st-confirmado{background:var(--accent);color:var(--on-accent)}
.pill.st-realizado{background:var(--ok-soft);color:var(--ok)}
.pill.st-cancelado{background:var(--bad-soft);color:var(--bad)}
.pill.st-ausencia{background:var(--warn-soft);color:var(--warn)}
.pill.rascunho{background:var(--warn-soft);color:var(--warn)}
.pill.finalizado{background:var(--ok-soft);color:var(--ok)}
.pill.ativo{background:var(--ok-soft);color:var(--ok)}
.pill.espera{background:var(--warn-soft);color:var(--warn)}
.pill.encerrado{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.online{background:var(--gold-soft);color:var(--gold)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--sage);outline-offset:0;border-color:var(--sage)}
.row2,.row3{display:grid;gap:12px}
.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.form-err{background:var(--bad-soft);color:var(--bad);padding:9px 12px;border-radius:8px;margin:0;font-size:.88rem}
.hint{font-size:.8rem;color:var(--muted);margin:0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding-block:max(5vh,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:560px;border:1px solid var(--line)}
.sheet.wide{max-width:760px}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px 6px 22px}
.sheet header h2{flex:1}
.sheet-body{padding:8px 22px 22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* dashboard */
.shortcuts{display:flex;flex-wrap:wrap;gap:10px}
.shortcut{flex:1 1 170px;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:.06em;font-size:.8rem;text-transform:uppercase}
.shortcut span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:.82rem}
.shortcut:hover{border-color:var(--sage)}
.shortcut.lead{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.shortcut.lead span{color:var(--on-accent);opacity:.8}
.shortcut.off{opacity:.55;cursor:default}
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.stat{flex:1 1 150px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.stat .n.money{font-size:1.65rem}
.stat .n{font-family:var(--f-display);font-size:2.2rem;line-height:1.05;font-weight:500;font-variant-numeric:lining-nums tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.aitem:first-child{border-top:0}
.aitem:hover{background:var(--surface-2)}
.aitem .t{font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums}
.aitem .who{font-weight:600;color:var(--ink);font-size:.95rem}
.aitem .meta{font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.slot-chip{font-family:var(--f-mono);font-size:.82rem;border:1px dashed var(--sage);color:var(--deep);border-radius:7px;padding:3px 9px;background:transparent;cursor:pointer}
.pend{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.pend li{display:flex;gap:10px;align-items:baseline;font-size:.92rem}
.pend .n{font-family:var(--f-mono);font-weight:500;min-width:2ch;text-align:right;color:var(--gold)}

/* agenda */
.ag-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ag-title{font-family:var(--f-display);font-size:1.5rem;font-weight:500;min-width:0}
.ag-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tg{display:grid;min-width:780px}
.tg.day{min-width:0}
.tg-head{display:contents}
.tg-h{padding:10px 8px;border-bottom:1px solid var(--line);font-size:.82rem;text-align:center;color:var(--muted);position:sticky;top:0;background:var(--surface);z-index:2}
.tg-h b{display:block;font-family:var(--f-display);font-size:1.4rem;color:var(--ink);font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.tg-h.is-today b{color:var(--on-accent);background:var(--accent);border-radius:99px;display:inline-block;min-width:1.9em;padding:0 .3em}
.tg-times{position:relative;border-right:1px solid var(--line)}
.tg-times span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.day-col{position:relative;border-right:1px solid var(--line);cursor:copy;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hpx,52px))}
.day-col:last-child{border-right:0}
.day-col.is-today{background-color:var(--surface-2)}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:4px 7px;font-size:.78rem;line-height:1.25;overflow:hidden;text-align:left;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.ev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tm{font-family:var(--f-mono);font-size:.7rem;opacity:.85}
.ev.st-agendado{background:var(--sage-soft);color:var(--deep);border-color:var(--sage)}
.ev.st-confirmado{background:var(--accent);color:var(--on-accent)}
.ev.st-realizado{background:var(--ok-soft);color:var(--ok)}
.ev.st-cancelado{background:var(--surface-2);color:var(--muted);text-decoration:line-through;border-color:var(--line)}
.ev.st-ausencia{background:var(--warn-soft);color:var(--warn)}
.ev.online::after{content:"on-line";position:absolute;right:5px;top:4px;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.8}
.blk{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--gold-soft) 0 6px,transparent 6px 12px);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);color:var(--gold);font-size:.72rem;font-weight:600;padding:3px 7px;cursor:pointer}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--gold);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:640px}
.mcell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:transparent;text-align:left;border-top:0;border-left:0}
.mcell:nth-child(7n){border-right:0}
.mcell:hover{background:var(--surface-2)}
.mcell.out{opacity:.45}
.mcell .d{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mcell.is-today .d{color:var(--on-accent);background:var(--accent);border-radius:99px;padding:0 6px;align-self:flex-start}
.mchip{font-size:.72rem;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip.st-agendado{background:var(--sage-soft);color:var(--deep)}
.mchip.st-confirmado{background:var(--accent);color:var(--on-accent)}
.mchip.st-realizado{background:var(--ok-soft);color:var(--ok)}
.mchip.st-cancelado{color:var(--muted);text-decoration:line-through}
.mchip.st-ausencia{background:var(--warn-soft);color:var(--warn)}
.mhead{padding:8px;font-size:.76rem;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}

/* patients */
.pt-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.pt-list{display:flex;flex-direction:column;gap:10px;position:sticky;top:0}
.pt-items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.pt-item{display:flex;flex-direction:column;gap:2px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.pt-item:first-child{border-top:0}
.pt-item:hover{background:var(--surface-2)}
.pt-item[aria-current="true"]{background:var(--sage-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pt-item .nm{font-weight:600;display:flex;gap:8px;align-items:center}
.pt-item .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pt-item .meta{font-size:.8rem;color:var(--muted)}

/* emdr */
.emdr{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;height:100%}
.stage.immersive{position:fixed;inset:0;z-index:100;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.fs-hud{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:8px 10px;font-size:.85rem;opacity:0;transition:opacity .4s;max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
.fs-hud .mono{padding:0 6px}
.fs-hud button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.stage.is-fs .fs-hud{display:flex}
.stage.is-fs.hud-on .fs-hud{opacity:1}
.fs-stop{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:none;border:1px solid rgba(255,255,255,.4);background:rgba(160,40,40,.75);color:#fff;border-radius:99px;padding:8px 16px;font-weight:700;letter-spacing:.04em;cursor:pointer;font-size:.8rem}
.stage.is-fs .fs-stop{display:block}
.stage-idle{position:absolute;left:16px;top:14px;color:rgba(255,255,255,.55);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;pointer-events:none}
.stage.is-fs .stage-idle{display:none}
.transport{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.transport .btn{padding:11px 18px;font-size:.95rem}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.hud div{padding:10px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.hud div:last-child{border-right:0}
.hud .v{font-family:var(--f-mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.hud .l{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
.state{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.state.run{color:var(--ok)} .state.pause{color:var(--warn)}
.ctrl{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ctrl section{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.ctrl section:first-child{border-top:0;padding-top:0}
.range{display:flex;flex-direction:column;gap:4px}
.range .top{display:flex;justify-content:space-between;align-items:baseline;font-size:.84rem}
.range .top span:first-child{font-weight:600;color:var(--muted);font-size:.78rem}
.range .top .mono{font-size:.84rem}
input[type="range"]{width:100%;accent-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.sw-custom{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.sw-custom input{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface-2)}
.preset-row{display:flex;flex-wrap:wrap;gap:6px}
.preset{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 12px;font-size:.84rem;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.preset:hover{border-color:var(--sage)}
.preset .x{color:var(--muted);font-weight:400}

.setlog div:first-child{border-top:0}
.disclaim{font-size:.78rem;color:var(--muted);line-height:1.45;margin:0}
.kbd{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}

.modal{z-index:400!important}.toast{z-index:410!important}

.lg-banner{background:var(--gold-soft);border:1px solid rgba(176,141,69,.35);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.86rem;line-height:1.45}
.lg-doc{display:flex;flex-direction:column;gap:6px;max-width:78ch}
.lg-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:.8rem}
.lg-status{color:var(--warn);font-weight:600}
.lg-intro{font-size:1rem;line-height:1.6;margin:6px 0}
.lg-sec h3{font:600 1.12rem var(--f-display);margin:16px 0 6px}
.lg-sec p,.lg-sec li{line-height:1.6;font-size:.93rem}
.lg-sec ul,.lg-sec ol{padding-left:22px;margin:6px 0}
.lg-sec li+li{margin-top:4px}
.lg-tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lg-t{width:100%;border-collapse:collapse;font-size:.85rem}
.lg-t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px}
.lg-t td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top;line-height:1.45}
.lg-t tr.lg-deny td{color:var(--bad)}
mark.lg-todo{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 3px;font-weight:600}
.lg-rows{display:flex;flex-direction:column}
.lg-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.lg-row:last-child{border-bottom:0}
.lg-row>div{flex:1;min-width:200px}.lg-row b{display:block;font-size:.93rem}.lg-row small{display:block;color:var(--muted);font-size:.82rem;line-height:1.4}
.lg-badge{font:700 .62rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:3px 7px;vertical-align:middle;margin-left:6px}
.lg-eth-acts{display:flex;flex-wrap:wrap;gap:10px}
.lg-pdf iframe{width:100%;height:min(78vh,900px);border:1px solid var(--line);border-radius:10px;background:#fff}
.lg-princ{padding-left:22px;margin:0}.lg-princ li{line-height:1.6;margin:6px 0}
.zv-acc,.zv-lock{position:fixed;inset:0;z-index:600;background:rgba(18,26,16,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.zv-lock{z-index:650;background:var(--bg)}
.zv-acc-box,.zv-lock-box{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 24px 70px rgba(10,20,15,.35);display:flex;flex-direction:column;gap:10px;margin:auto}
.zv-lock-box{max-width:380px;text-align:center;align-items:stretch;box-shadow:none}
.zv-acc-box h2,.zv-lock-box h2{margin:0;font:600 1.6rem var(--f-display)}
.zv-acc-box p,.zv-lock-box p{margin:0;line-height:1.5}
.zv-acc-logo{width:64px;height:64px;border-radius:50%;align-self:center}
.zv-acc-box .zv-acc-logo{align-self:flex-start}
.zv-acc-d{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.zv-acc-d summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.9rem}
.zv-acc-txt{max-height:40vh;overflow-y:auto;padding:0 14px 12px;font-size:.88rem}
.zv-chk{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;line-height:1.45;cursor:pointer}
.zv-chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
.zv-pin{font:600 1.5rem var(--f-mono);letter-spacing:.3em;text-align:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);color:var(--ink);width:100%}
.zv-lock-err{color:var(--bad);min-height:1.2em;font-size:.88rem}
.zv-code{font:700 1.3rem var(--f-mono);letter-spacing:.12em;text-align:center;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:14px;margin:8px 0;user-select:all;word-break:break-all}
body.zv-locked .app{visibility:hidden}


.mt-rec{align-self:flex-start;flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100% - 24px);background:rgba(20,24,18,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#F0EDE2;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:7px 8px 7px 12px;font-size:.84rem}
.mt-rec b{font-weight:600}.mt-rec .hint3{color:#B8BDAE;font-size:.78rem}
.mt-rec button{border:0;border-radius:9px;padding:7px 12px;font:600 .82rem var(--f-body);cursor:pointer;background:#E2C27A;color:#1D2318}
.mt-rec button.ghost{background:transparent;color:#F0EDE2;border:1px solid rgba(255,255,255,.25)}
.mt-rec.ok{border-color:rgba(140,190,120,.5)}.mt-rec .ok-dot{color:#9FD18A;font-weight:700}
.mt-rec.on{border-color:rgba(230,90,90,.6)}.mt-rec.on button:not(.ghost){background:#D9534F;color:#fff}
.rec-live{color:#FF6B6B;animation:recBlink 1.2s ease-in-out infinite}
@keyframes recBlink{50%{opacity:.25}}
.mt-stage{position:relative}
.rec-ask{display:flex;flex-direction:column;gap:10px}
.rec-ask .btn{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px;height:auto;white-space:normal}
.rec-ask .btn small{font-weight:400;opacity:.85;font-size:.8rem}
@media (max-width:640px){.mt-rec{font-size:.8rem}.mt-rec .hint3{display:none}}

.zv-move{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;width:min(760px,calc(100vw - 24px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;box-shadow:0 14px 40px rgba(10,20,15,.22)}
.zv-move>div:first-child{flex:1;min-width:240px}.zv-move b{display:block;font-size:.95rem}.zv-move span{display:block;color:var(--muted);font-size:.83rem;line-height:1.45;margin-top:2px}
.zv-move-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.zv-move .x{border:0;background:transparent;font-size:1.4rem;line-height:1;color:var(--muted);cursor:pointer;width:34px;height:34px;border-radius:8px}
.brand-chev{width:12px;height:12px;vertical-align:middle;opacity:.7;margin-left:2px;transition:transform .2s}
.brand-home[aria-expanded=true] .brand-chev{transform:rotate(180deg)}
.brand-home[aria-expanded=true] .brand-logo{box-shadow:0 0 0 3px var(--nav-gold)}
.bm{position:fixed;z-index:440;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(10,20,15,.28);overflow-y:auto;overscroll-behavior:contain;padding:8px;opacity:0;transform:translateY(-6px);transition:opacity .16s ease,transform .18s ease}
.bm.in{opacity:1;transform:none}
.bm-head{display:flex;gap:12px;align-items:center;padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.bm-head img{width:44px;height:44px;border-radius:50%;flex:none}
.bm-head b{display:block;font:600 1.15rem var(--f-display)}.bm-head small{color:var(--muted);font-size:.8rem}
.bm-sep{font:700 .64rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.bm-sep.bm-line{padding:0;margin:6px 4px;border-top:1px solid var(--line)}
.bm-it{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit}
.bm-it:hover,.bm-it:focus-visible{background:var(--surface-2);outline:none}
.bm-it.on{background:var(--sage-soft)}
.bm-it i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--sage-soft);color:var(--deep);flex:none;font-style:normal}
.bm-it i svg{width:17px;height:17px}
.bm-it b{display:block;font-size:.92rem;font-weight:600}.bm-it small{display:block;color:var(--muted);font-size:.78rem;line-height:1.35}
@media (prefers-reduced-motion:reduce){.bm{transition:none}}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
.cfg-h{display:flex;align-items:center;gap:12px}.cfg-h h2{margin:0}
.cfg-h i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--sage-soft);color:var(--deep);font-style:normal}.cfg-h i svg{width:19px;height:19px}
.cfg-card .lg-row .seg{flex-wrap:wrap}
@media (max-width:420px){.cfg-grid{grid-template-columns:1fr}}
.zv-calm *,.zv-calm *::before,.zv-calm *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
.zv-calm #stage *,.zv-calm .proj *{animation-duration:revert!important;transition-duration:revert!important}

@media print{.nav,.page-head .btn,.lg-banner{display:none!important}}
</style>

  else if(c.shape==='esfera'){const gr=g.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);gr.addColorStop(0,'#FFFFFF');gr.addColorStop(.35,c.dot);gr.addColorStop(1,c.dot);g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=r*.5;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
  else{g.shadowColor=c.dot;g.shadowBlur=r*1.2;g.fillStyle=c.dot;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}g.restore()}

function conflict(start,dur,ignore){
  const s=start.getTime(),e=s+dur*60000;
  for(const a of S.appts){if(a.id===ignore||a.status==='cancelado')continue;const as=P(a.start).getTime(),ae=as+a.dur*60000;if(s<ae&&e>as)return `Conflito com ${pname(getP(a.pid))} às ${fmtT(P(a.start))}.`}
  for(const b of S.blocks){if(b.id===ignore)continue;const bs=P(b.start).getTime(),be=bs+b.dur*60000;if(s<be&&e>bs)return `Horário bloqueado (${b.motivo}) das ${fmtT(P(b.start))} às ${fmtT(new Date(be))}.`}
  return null;
}
function freeSlots(day){const a=S.prefs.agenda;const now=new Date();const out=[];if(!a.days.includes(day.getDay()))return out;for(let m=a.start*60;m+a.dur<=a.end*60;m+=60){const s=new Date(day.getFullYear(),day.getMonth(),day.getDate(),Math.floor(m/60),m%60);if(s<now)continue;if(!conflict(s,a.dur))out.push(s)}return out}

/* =========================================================

   ========================================================= */
let H0=8,H1=20,PX=54;let justDragged=0;
function agCfg(){const a=S.prefs.agenda;H0=a.start;H1=a.end;PX=a.density==='compacta'?40:a.density==='ampla'?74:54}
const weekDays=d=>Array.from({length:7},(_,i)=>addDays(sow(d),i)).filter(x=>S.prefs.agenda.days.includes(x.getDay()));
function renderAgenda(){
  agCfg();const d=ui.agDate,v=ui.agView;let title='';
  if(v==='dia')title=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  else if(v==='semana'){const wd=weekDays(d),a=wd[0],b=wd[wd.length-1];title=`${a.getDate()} ${a.getMonth()!==b.getMonth()?MES[a.getMonth()].slice(0,3)+' ':''}– ${b.getDate()} de ${MES[b.getMonth()]} ${b.getFullYear()}`}
  else title=`${MES[d.getMonth()]} de ${d.getFullYear()}`;
  let body='';
  if(v==='mes')body=monthGrid(d);else body=timeGrid(v==='dia'?[new Date(d)]:weekDays(d));
  $('#view').innerHTML=`<div class="view-in">
   <div class="page-head"><div><div class="eyebrow">Agenda clínica</div><h1>Agenda</h1></div><span class="sp"></span>
     <button class="btn" data-act="waitlist">Lista de espera (${S.waitlist.length})</button>
     ${dd('Novo',[{label:'Consulta',hint:'Agenda um atendimento presencial ou on-line, com checagem de conflitos',act:'newAppt'},{label:'Bloqueio de horário',hint:'Reserva um período sem atendimentos, como supervisão ou almoço',act:'newBlock'},'-',{label:'Pessoa na lista de espera',hint:'Registra quem aguarda vaga, com a preferência de horário',act:'waitlist'},'-',{label:'Ajustes da agenda',hint:'Expediente, dias exibidos, intervalo da grade, duração padrão e arraste',act:'agSettings'}],'btn primary')}</div>
   ${howto('Como funciona a agenda',`<ul><li>Clique num espaço vazio da grade para agendar naquele horário, ou use <b>Novo</b>.</li><li>Para reagendar, arraste a consulta com o mouse para outro dia ou horário, ou abra a consulta e mude a data ou a hora. O sistema impede sobreposição com outras consultas e com bloqueios.</li><li><b>Status</b>: Agendado (marcado), Confirmado (paciente confirmou), Realizado, Cancelado (libera o horário) e Ausência (não compareceu).</li><li>O paciente só recebe informações administrativas. Não escreva conteúdo clínico na observação da consulta.</li></ul>`)}
   <div class="ag-bar">
     <div class="seg" role="group" aria-label="Visualização">${['dia','semana','mes'].map(x=>`<button data-act="agView" data-v="${x}" aria-pressed="${v===x}">${x==='mes'?'Mês':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
     <div class="seg"><button data-act="agNav" data-n="-1" aria-label="Anterior">‹</button><button data-act="agNav" data-n="0">Hoje</button><button data-act="agNav" data-n="1" aria-label="Próximo">›</button></div>
     <span class="ag-title">${title}</span>
   </div>
   <div class="ag-scroll">${body}</div>
   <div class="legend">${Object.keys(STATUS).map(s=>`<span class="pill st-${s}">${STATUS[s]}</span>`).join('')}<span>· Clique num espaço vazio para agendar${S.prefs.agenda.drag?'; arraste uma consulta com o mouse para reagendar':''}.</span></div>
  </div>`;
  bindDrag();
}
function timeGrid(days){
  const tk=dkey(new Date());const n=days.length;const hgt=(H1-H0)*PX;
  let html=`<div class="tg ${n===1?'day':''} ${S.prefs.agenda.drag?'can-drag':''}" style="grid-template-columns:56px repeat(${n},minmax(0,1fr));--hpx:${PX}px"><div class="tg-h"></div>`;
  days.forEach((d,i)=>{const k=dkey(d);html+=`<div class="tg-h ${k===tk?'is-today':''}">${DOW[(d.getDay()+6)%7]}<b>${d.getDate()}</b></div>`});
  html+=`<div class="tg-times" style="height:${hgt}px">${Array.from({length:H1-H0},(_,i)=>i?`<span style="top:${i*PX}px">${pad(H0+i)}:00</span>`:'').join('')}</div>`;
  days.forEach(d=>{
    const k=dkey(d);
    const evs=S.appts.filter(a=>a.start.slice(0,10)===k).sort(byStart);
    const bl=S.blocks.filter(b=>b.start.slice(0,10)===k);
    let inner='';
    bl.forEach(b=>{const s=P(b.start);const m=s.getHours()*60+s.getMinutes()-H0*60;inner+=`<div class="blk" data-act="editBlock" data-id="${b.id}" style="top:${m/60*PX}px;height:${b.dur/60*PX}px">${esc(b.motivo)}</div>`});
    evs.forEach(a=>{const s=P(a.start);const m=s.getHours()*60+s.getMinutes()-H0*60;if(m<0||m>(H1-H0)*60)return;
      inner+=`<button class="ev st-${a.status} ${a.mod==='online'?'online':''} ${a.demo?'is-demo':''}" data-act="appt" data-id="${a.id}" style="top:${m/60*PX+1}px;height:${Math.max(a.dur/60*PX-3,22)}px"><span class="tm">${fmtT(s)}–${fmtT(addMin(s,a.dur))}</span><b>${esc(pname(getP(a.pid)))}</b></button>`});
    if(k===tk){const n=new Date();const m=n.getHours()*60+n.getMinutes()-H0*60;if(m>0&&m<(H1-H0)*60)inner+=`<div class="nowline" style="top:${m/60*PX}px"></div>`}
    html+=`<div class="day-col ${k===tk?'is-today':''}" data-act="slot" data-day="${k}" style="height:${hgt}px">${inner}</div>`;
  });
  return html+'</div>';
}
function monthGrid(d){
  const first=new Date(d.getFullYear(),d.getMonth(),1);const start=sow(first);const tk=dkey(new Date());
  let html=`<div class="mgrid">${DOW.map(x=>`<div class="mhead">${x}</div>`).join('')}`;
  const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const cells=Math.ceil((((first.getDay()+6)%7)+dim)/7)*7;
  for(let i=0;i<cells;i++){const c=addDays(start,i);const k=dkey(c);
    const evs=S.appts.filter(a=>a.start.slice(0,10)===k).sort(byStart);
    html+=`<button class="mcell ${c.getMonth()!==d.getMonth()?'out':''} ${k===tk?'is-today':''}" data-act="gotoDay" data-day="${k}"><span class="d">${c.getDate()}</span>${evs.slice(0,3).map(a=>`<span class="mchip st-${a.status}">${fmtT(P(a.start))} ${esc(pname(getP(a.pid)).split(' ')[0])}</span>`).join('')}${evs.length>3?`<span class="mchip muted">+${evs.length-3}</span>`:''}</button>`}
  return html+'</div>';
}
ACT.agView=d=>{ui.agView=d.v;renderAgenda()};
ACT.agNav=d=>{const n=+d.n;if(!n)ui.agDate=new Date();else{const x=new Date(ui.agDate);if(ui.agView==='dia')x.setDate(x.getDate()+n);else if(ui.agView==='semana')x.setDate(x.getDate()+7*n);else{x.setDate(1);x.setMonth(x.getMonth()+n)}ui.agDate=x}renderAgenda()};
ACT.gotoDay=d=>{ui.agDate=P(d.day+'T00:00');ui.agView='dia';renderAgenda()};
ACT.slot=(d,el,e)=>{if(Date.now()-justDragged<400)return;const r=el.getBoundingClientRect();const y=e.clientY-r.top;const stp=S.prefs.agenda.step;let m=H0*60+Math.floor(y/PX*60/stp)*stp;m=Math.min(m,H1*60-stp);openAppt(null,{day:d.day,time:`${pad(Math.floor(m/60))}:${pad(m%60)}`})};
ACT.newAppt=d=>openAppt(null,{day:d.day,time:d.time,pid:d.pid});
ACT.appt=d=>{if(Date.now()-justDragged<400)return;openAppt(d.id)};

function openAppt(id,pre={}){
  const a=id?S.appts.find(x=>x.id===id):null;
  const st=a?P(a.start):null;
  const day=a?dkey(st):pre.day||dkey(new Date());const time=a?fmtT(st):pre.time||'09:00';
  const list=S.patients.filter(p=>p.sit!=='encerrado'||(a&&a.pid===p.id)).sort((x,y)=>pname(x).localeCompare(pname(y)));
  const sel=a?a.pid:pre.pid||'';
  const p=a?getP(a.pid):null;
  modal(a?'Consulta':'Nova consulta',`<form id="f-appt" class="form" novalidate>
    <div class="field"><label for="a-pid">Paciente</label><select id="a-pid" required><option value="">Selecione…</option>${list.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(pname(p))}</option>`).join('')}</select></div>
    <div class="row3"><div class="field"><label for="a-day">Data</label><input id="a-day" type="date" value="${day}" required></div>
      <div class="field"><label for="a-time">Início</label><input id="a-time" type="time" value="${time}" step="300" required></div>
      <div class="field"><label for="a-dur">Duração (min)</label><input id="a-dur" type="number" min="10" max="240" step="5" value="${a?a.dur:S.prefs.agenda.dur}"></div></div>
    <div class="row2"><div class="field"><label for="a-mod">Modalidade</label><select id="a-mod"><option value="presencial">Presencial</option><option value="online" ${(a?a.mod:pre.mod)==='online'?'selected':''}>Teleconsulta (on-line)</option></select></div>
      <div class="field"><label for="a-st">Status</label><select id="a-st">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${(a?a.status:'agendado')===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
    <div class="field"><label for="a-note">Observação administrativa</label><input id="a-note" value="${esc(a?.note||'')}" placeholder="Não registre conteúdo clínico aqui"></div>
    ${p?`<p class="hint">Comparecimento de ${esc(pname(p))}: ${attendance(p.id)}</p>`:''}
    ${a&&a.mod==='online'&&on('teleconsulta')?inviteHtml(a):''}
    <p class="form-err" id="a-err" hidden></p>
    <div class="form-actions">${a&&a.demo&&canAdmin()?`<button type="button" class="btn danger" data-act="demoDel" data-k="appt" data-id="${a.id}">Excluir exemplo</button>`:''}${a&&canClinical()&&on('emdr')&&a.status!=='cancelado'?`<button type="button" class="btn ghost" data-act="emdrFor" data-pid="${a.pid}">Iniciar EMDR</button>`:''}${a?`<button type="button" class="btn ghost" data-act="openPatient" data-pid="${a.pid}">Abrir cadastro</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary" type="submit">Salvar</button></div>
  </form>`);
  $('#f-appt').onsubmit=e=>{e.preventDefault();
    const pid=$('#a-pid').value,dd=$('#a-day').value,tt=$('#a-time').value,dur=Math.max(10,+$('#a-dur').value||50),status=$('#a-st').value;
    const err=$('#a-err');const fail=m=>{err.textContent=m;err.hidden=false};
    if(!pid)return fail('Selecione o paciente.');if(!dd||!tt)return fail('Informe data e horário.');
    const s=P(dd+'T'+tt);
    if(status!=='cancelado'){const c=conflict(s,dur,a?.id);if(c)return fail(c+' Escolha outro horário.')}
    const rec={pid,start:isoL(s),dur,mod:$('#a-mod').value,status,note:$('#a-note').value.trim()};
    if(a){const moved=a.start!==rec.start;const stCh=a.status!==rec.status;Object.assign(a,rec);audit(moved?`Reagendamento para ${fmtD(s)} ${fmtT(s)}`:stCh?`Status da consulta: ${STATUS[status]}`:'Consulta atualizada',pid);toast(moved?'Consulta reagendada':'Consulta atualizada')}
    else{S.appts.push({id:uid(),...rec});audit(`Consulta agendada para ${fmtD(s)} ${fmtT(s)}`,pid);toast('Consulta agendada')}
    save();closeModal();route();
  };
}
function attendance(pid){const l=S.appts.filter(a=>a.pid===pid&&P(a.start)<new Date());const r=l.filter(a=>a.status==='realizado').length,c=l.filter(a=>a.status==='cancelado').length,f=l.filter(a=>a.status==='ausencia').length;return `${r} realizadas, ${c} canceladas, ${f} ausências`}

ACT.newBlock=()=>openBlock();ACT.editBlock=d=>openBlock(d.id);
function openBlock(id){const b=id?S.blocks.find(x=>x.id===id):null;const s=b?P(b.start):null;
  modal(b?'Horário bloqueado':'Bloquear horário',`<form id="f-blk" class="form">
   <div class="row3"><div class="field"><label for="b-day">Data</label><input id="b-day" type="date" value="${b?dkey(s):dkey(ui.agDate)}"></div>
   <div class="field"><label for="b-s">Início</label><input id="b-s" type="time" value="${b?fmtT(s):'12:00'}"></div>
   <div class="field"><label for="b-e">Fim</label><input id="b-e" type="time" value="${b?fmtT(addMin(s,b.dur)):'13:00'}"></div></div>
   <div class="field"><label for="b-m">Motivo</label><input id="b-m" value="${esc(b?.motivo||'')}" placeholder="Ex.: supervisão, almoço, curso"></div>
   <p class="form-err" id="b-err" hidden></p>
   <div class="form-actions">${b?`<button type="button" class="btn danger" data-act="delBlock" data-id="${b.id}">Remover bloqueio</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`);
  $('#f-blk').onsubmit=e=>{e.preventDefault();const st=P($('#b-day').value+'T'+$('#b-s').value),en=P($('#b-day').value+'T'+$('#b-e').value);const dur=Math.round((en-st)/60000);
    if(!(dur>0)){$('#b-err').textContent='O fim precisa ser depois do início.';$('#b-err').hidden=false;return}
    const clash=S.appts.find(a=>a.status!=='cancelado'&&P(a.start)<en&&addMin(P(a.start),a.dur)>st);
    if(clash){$('#b-err').textContent=`Já existe consulta de ${pname(getP(clash.pid))} às ${fmtT(P(clash.start))}. Reagende antes de bloquear.`;$('#b-err').hidden=false;return}
    const rec={start:isoL(st),dur,motivo:$('#b-m').value.trim()||'Indisponível'};if(b)Object.assign(b,rec);else S.blocks.push({id:uid(),...rec});save();closeModal();route();toast('Bloqueio salvo')}}
ACT.delBlock=d=>{S.blocks=S.blocks.filter(b=>b.id!==d.id);save();closeModal();route();toast('Bloqueio removido')};

ACT.waitlist=()=>{
  const list=S.waitlist.map(w=>`<div class="docrow"><div style="flex:1;min-width:0"><b>${esc(w.nome)}</b><br><span class="muted" style="font-size:.84rem">${esc(w.tel)} · ${esc(w.pref||'sem preferência')} · desde ${fmtD(new Date(w.created))}</span></div><button class="btn sm" data-act="wlConvert" data-id="${w.id}">Cadastrar paciente</button><button class="btn sm ghost" data-act="wlDel" data-id="${w.id}">Remover</button></div>`).join('')||'<p class="empty">Lista vazia.</p>';
  modal('Lista de espera',`<div class="doclist">${list}</div>
   <form id="f-wl" class="form" style="margin-top:18px"><div class="eyebrow">Adicionar</div><div class="row3"><div class="field"><label for="w-n">Nome</label><input id="w-n" required></div><div class="field"><label for="w-t">Telefone</label><input id="w-t"></div><div class="field"><label for="w-p">Preferência de horário</label><input id="w-p"></div></div>
   <div class="form-actions"><span class="sp"></span><button class="btn primary">Adicionar à lista</button></div></form>`,true);
  $('#f-wl').onsubmit=e=>{e.preventDefault();const n=$('#w-n').value.trim();if(!n)return;S.waitlist.push({id:uid(),nome:n,tel:$('#w-t').value.trim(),pref:$('#w-p').value.trim(),created:Date.now()});save();ACT.waitlist();route()}};
ACT.wlDel=d=>{S.waitlist=S.waitlist.filter(w=>w.id!==d.id);save();ACT.waitlist();route()};
ACT.wlConvert=d=>{const w=S.waitlist.find(x=>x.id===d.id);closeModal();openPatientForm(null,{nome:w.nome.replace(/\s*\(fictício\)/,''),tel:w.tel,sit:'espera'},()=>{S.waitlist=S.waitlist.filter(x=>x.id!==d.id);save()})};

/* =========================================================
   PACIENTES E PRONTUÁRIO
   ========================================================= */
function renderPacientes(){
  const q=ui.q.trim().toLowerCase();
  const ord={ativo:0,espera:1,encerrado:2};
  const list=S.patients.filter(p=>(ui.sitF==='todos'||p.sit===ui.sitF)&&(!q||(p.nome+' '+p.social).toLowerCase().includes(q))).sort((a,b)=>ord[a.sit]-ord[b.sit]||pname(a).localeCompare(pname(b)));
  const p=ui.pid?getP(ui.pid):null;
  $('#view').innerHTML=`<div class="view-in">
  <div class="page-head"><div><div class="eyebrow">Cadastro e prontuário eletrônico</div><h1>Pacientes</h1></div><span class="sp"></span><button class="btn primary" data-act="newPatient">Novo paciente</button></div>
  ${howto('Como funciona o prontuário',`<ul><li><b>Cadastro</b>: contatos, responsável legal e termos. Visível também para a recepção.</li><li><b>Registro clínico</b>: anamnese, queixa, objetivos e plano. Cada gravação guarda a versão anterior.</li><li><b>Evoluções</b> e <b>EMDR</b>: rascunhos podem ser editados; registros finalizados só recebem adendos, e o original fica preservado.</li><li><b>Auditoria</b>: quem abriu ou alterou o prontuário, e quando.</li><li>Use o menu <b>Ações</b> do paciente para criar registros sem trocar de aba.</li></ul>`)}
  <div class="pt-wrap ${p?'has-sel':''}">
    <div class="pt-list">
      <input class="search" id="pt-q" type="search" placeholder="Buscar por nome ou nome social" value="${esc(ui.q)}" aria-label="Buscar paciente">
      <div class="seg" role="group" aria-label="Filtrar por situação" style="align-self:flex-start">${[['todos','Todos'],['ativo','Ativos'],['espera','Espera'],['encerrado','Encerrados']].map(([k,l])=>`<button data-act="sitF" data-v="${k}" aria-pressed="${ui.sitF===k}">${l}</button>`).join('')}</div>
      <div class="pt-items">${list.map(x=>`<button class="pt-item" data-act="openPatient" data-pid="${x.id}" aria-current="${x.id===ui.pid}"><span class="nm"><span>${esc(pname(x))}</span><span class="pill ${x.sit}">${x.sit==='ativo'?'Ativo':x.sit==='espera'?'Espera':'Encerrado'}</span>${x.demo?DEMOS:''}</span><span class="meta">${age(x.nasc)} anos${x.social?' · nome social':''}${x.resp?' · com responsável':''}</span></button>`).join('')||'<p class="empty" style="padding:14px">Nenhum paciente encontrado.</p>'}</div>
    </div>
    <div class="pt-detail">${p?patientDetail(p):`<div class="locked"><h2>Selecione um paciente</h2><p class="muted" style="margin:0">O prontuário abre aqui, com cadastro, registro clínico, evoluções e registros de EMDR.</p></div>`}</div>
  </div></div>`;
  const qi=$('#pt-q');qi.oninput=()=>{ui.q=qi.value;const pos=qi.selectionStart;renderPacientes();const n=$('#pt-q');n.focus();n.setSelectionRange(pos,pos)};
}
ACT.sitF=d=>{ui.sitF=d.v;renderPacientes()};
ACT.openPatient=d=>{ui.pid=d.pid;ui.ptab='cadastro';closeModal();audit('Abertura do cadastro',d.pid);if(current!=='pacientes')go('pacientes');else renderPacientes()};
ACT.backList=()=>{ui.pid=null;renderPacientes()};
ACT.ptab=d=>{ui.ptab=d.t;if(['clinico','evol','emdr','rel','audit'].includes(d.t)){if(canClinical())audit(`Acesso ao prontuário: ${({clinico:'registro clínico',evol:'evoluções',emdr:'registros EMDR',rel:'relatórios psicológicos',audit:'auditoria'})[d.t]}`,ui.pid);else audit('Tentativa de acesso ao prontuário clínico (negada)',ui.pid,true)}renderPacientes()};

function patientDetail(p){
  const tabs=[['cadastro','Cadastro',false],['clinico','Registro clínico',true],['evol','Evoluções',true],['emdr','EMDR',true],['rel','Relatórios',true],['audit','Auditoria',true]];
  let body='';
  const t=ui.ptab;
  if(tabs.find(x=>x[0]===t)[2]&&!canClinical())body=`<div class="locked"><span class="eyebrow">Acesso restrito</span><h2>Conteúdo clínico protegido</h2><p class="muted" style="margin:0;max-width:52ch">Os perfis Recepção e Administrador acessam agenda, cadastro e dados administrativos. Registros clínicos são exclusivos da psicóloga responsável. Esta tentativa ficou registrada na auditoria.</p></div>`;
  else body=({cadastro:tabCadastro,clinico:tabClinico,evol:tabEvol,emdr:tabEmdr,rel:tabRel,audit:tabAudit})[t](p);
  return `<div class="stack">
    <div class="pt-head"><button class="btn sm ghost back-btn" data-act="backList">‹ Lista</button>
      <div style="flex:1;min-width:0"><h1 style="font-size:1.7rem">${esc(pname(p))}</h1><div class="civil">${p.social?`Nome civil: ${esc(p.nome)} · `:''}${age(p.nasc)} anos · desde ${fmtD(new Date(p.created))} · <span class="pill ${p.sit}">${SIT[p.sit]}</span>${p.demo?' '+DEMOP:''}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${p.demo&&canAdmin()?`<button class="btn danger" data-act="demoDel" data-k="patient" data-id="${p.id}">Excluir exemplo</button>`:''}${canClinical()&&on('emdr')&&p.sit!=='encerrado'?`<button class="btn primary" data-act="emdrFor" data-pid="${p.id}">Iniciar EMDR</button>`:''}${canClinical()?dd('Documentos',Object.entries(DOCS_CLIN).map(([k,v])=>({label:v.label,hint:v.hint,act:'docOpen',data:{k,pid:p.id}}))):''}${dd('Ações',patientMenu(p))}</div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l,c])=>`<button role="tab" aria-selected="${t===k}" data-act="ptab" data-t="${k}">${l}${c&&!canClinical()?' <span class="lock" aria-label="restrito">🔒</span>':''}</button>`).join('')}</div>
    ${body}</div>`;
}
function patientMenu(p){const m=on('agenda')?[{label:'Agendar consulta',hint:'Abre uma nova consulta com este paciente já selecionado',act:'newAppt',data:{pid:p.id}}]:[];
  if(canClinical())m.push('-',{label:'Nova evolução',hint:'Registro da sessão, salvo como rascunho ou finalizado',act:'pNew',data:{k:'evol'}},{label:'Novo registro EMDR',hint:'Fase, alvo, cognições, VOC e SUD',act:'pNew',data:{k:'emdr'}});
  if(canClinical()&&on('anotacoes'))m.push({label:'Nova anotação',hint:'Nota livre vinculada a este paciente, fora do prontuário',act:'pNew',data:{k:'note'}});
  m.push('-',{label:'Editar cadastro',hint:'Contatos, responsável legal e situação do acompanhamento',act:'editPatient',data:{pid:p.id}});return m}
ACT.pNew=d=>{if(d.k==='note'){openNote(null,{pid:ui.pid,cat:'Sessão'});return}ui.ptab=d.k;renderPacientes();d.k==='evol'?openEvol():openEmdrRec()};
function tabCadastro(p){
  const past=S.appts.filter(a=>a.pid===p.id).sort((a,b)=>b.start.localeCompare(a.start)).slice(0,8);
  const minor=age(p.nasc)<18;
  return `<section class="panel"><div class="panel-head"><h2>Dados cadastrais</h2><span class="sp"></span><button class="btn sm" data-act="editPatient" data-pid="${p.id}">Editar</button></div>
   <dl class="kv">
    <div><dt>Nome completo</dt><dd>${esc(p.nome)}</dd></div><div><dt>Nome social</dt><dd>${esc(p.social)||'—'}</dd></div>
    <div><dt>Data de nascimento</dt><dd>${fmtD(P(p.nasc+'T00:00'))} (${age(p.nasc)} anos)</dd></div><div><dt>Situação</dt><dd>${SIT[p.sit]}</dd></div>
    <div><dt>Telefone</dt><dd>${esc(p.tel)||'—'}</dd></div><div><dt>E-mail</dt><dd>${esc(p.email)||'—'}</dd></div>
    <div><dt>Contato de emergência</dt><dd>${esc(p.emerg)||'—'}</dd></div><div><dt>Responsável legal</dt><dd>${esc(p.resp)||(minor?'<span style="color:var(--bad)">Obrigatório para menor de idade</span>':'Não se aplica')}</dd></div>
   </dl></section>
  <section class="panel"><h2>Documentos e consentimentos</h2><div class="doclist">${DOCS.filter(([k])=>k!=='resp'||minor||p.resp).map(([k,l])=>{const v=p.docs?.[k];return `<div class="docrow"><span style="flex:1;min-width:0">${l}</span>${v?`<span class="pill finalizado">Assinado em ${fmtD(new Date(v))}</span><button class="btn sm ghost" data-act="docToggle" data-k="${k}">Desfazer</button>`:`<span class="pill rascunho">Pendente</span><button class="btn sm" data-act="docToggle" data-k="${k}">Registrar assinatura</button>`}</div>`}).join('')}</div>
   <p class="hint">Na fase 2, o paciente assina pelo portal. Aqui a psicóloga registra assinaturas colhidas presencialmente.</p></section>
  <section class="panel"><h2>Histórico de atendimentos</h2><p class="hint">${attendance(p.id)}</p><div class="alist">${past.length?past.map(a=>apptRow(a,true)).join(''):'<p class="empty">Sem consultas.</p>'}</div></section>`;
}
ACT.docToggle=d=>{const p=getP(ui.pid);p.docs=p.docs||{};const on=!p.docs[d.k];p.docs[d.k]=on?Date.now():null;audit(`${on?'Registro':'Remoção'} de assinatura: ${DOCS.find(x=>x[0]===d.k)[1]}`,p.id);save();renderPacientes()};

ACT.newPatient=()=>openPatientForm();
ACT.editPatient=d=>openPatientForm(d.pid);
function openPatientForm(id,pre={},after){
  const p=id?getP(id):{nome:'',social:'',nasc:'',tel:'',email:'',emerg:'',resp:'',sit:'ativo',...pre};
  modal(id?'Editar cadastro':'Novo paciente',`<form id="f-pt" class="form" novalidate>
   <div class="row2"><div class="field"><label for="pf-nome">Nome completo</label><input id="pf-nome" value="${esc(p.nome)}" required></div><div class="field"><label for="pf-social">Nome social</label><input id="pf-social" value="${esc(p.social)}" placeholder="Usado em toda a interface"></div></div>
   <div class="row3"><div class="field"><label for="pf-nasc">Nascimento</label><input id="pf-nasc" type="date" value="${p.nasc}"></div><div class="field"><label for="pf-tel">Telefone</label><input id="pf-tel" value="${esc(p.tel)}"></div><div class="field"><label for="pf-sit">Situação</label><select id="pf-sit">${Object.entries(SIT).map(([k,v])=>`<option value="${k}" ${p.sit===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
   <div class="field"><label for="pf-email">E-mail</label><input id="pf-email" type="email" value="${esc(p.email)}"></div>
   <div class="field"><label for="pf-emerg">Contato de emergência</label><input id="pf-emerg" value="${esc(p.emerg)}" placeholder="Nome, vínculo e telefone"></div>
   <div class="field"><label for="pf-resp">Responsável legal</label><input id="pf-resp" value="${esc(p.resp)}" placeholder="Obrigatório para menores de 18 anos"></div>
   <p class="hint">Use apenas dados fictícios nesta demonstração.</p>
   <p class="form-err" id="pf-err" hidden></p>
   <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`,true);
  $('#f-pt').onsubmit=e=>{e.preventDefault();const v=k=>$('#pf-'+k).value.trim();const err=$('#pf-err');
    if(!v('nome')){err.textContent='Informe o nome completo.';err.hidden=false;return}
    if(!v('nasc')){err.textContent='Informe a data de nascimento.';err.hidden=false;return}
    if(age(v('nasc'))<18&&!v('resp')){err.textContent='Paciente menor de idade: informe o responsável legal.';err.hidden=false;return}
    const rec={nome:v('nome'),social:v('social'),nasc:v('nasc'),tel:v('tel'),email:v('email'),emerg:v('emerg'),resp:v('resp'),sit:$('#pf-sit').value};
    if(id){Object.assign(getP(id),rec);audit('Cadastro atualizado',id)}
    else{const np={id:uid(),...rec,created:Date.now(),docs:{}};S.patients.push(np);ui.pid=np.id;ui.ptab='cadastro';audit('Paciente cadastrado',np.id)}
    save();after&&after();closeModal();toast('Cadastro salvo');if(current!=='pacientes')go('pacientes');else renderPacientes()};
}

function tabClinico(p){
  const c=S.clinical[p.id]||{fields:{},history:[]};
  return `<section class="panel"><div class="panel-head"><h2>Registro clínico</h2><span class="sp"></span><span class="hint">${c.updated?`Última alteração ${fmtDT(c.updated)} · ${esc(c.by)}`:'Ainda não preenchido'}</span></div>
   <form id="f-cl" class="form">${CLIN.map(([k,l])=>`<div class="field"><label for="cl-${k}">${l}</label><textarea id="cl-${k}" rows="3">${esc(c.fields[k]||'')}</textarea></div>`).join('')}
   <div class="form-actions"><p class="hint">Cada gravação fica no histórico, com autoria, data e o conteúdo anterior.</p><span class="sp"></span><button class="btn primary">Salvar registro</button></div></form></section>
   <section class="panel"><h2>Histórico de alterações</h2><div class="hist">${(c.history||[]).length?c.history.map(h=>`<details><summary>${fmtDT(h.ts)} · ${esc(h.who)} · alterou ${h.changed.map(k=>CLIN.find(x=>x[0]===k)[1]).join(', ')}</summary>${h.changed.map(k=>`<pre><b>${CLIN.find(x=>x[0]===k)[1]} (versão anterior):</b>\n${esc(h.prev[k]||'(vazio)')}</pre>`).join('')}</details>`).join(''):'<p class="empty">Sem alterações registradas.</p>'}</div></section>`;
}
document.addEventListener('submit',e=>{if(e.target.id!=='f-cl')return;e.preventDefault();
  const p=getP(ui.pid);const c=S.clinical[p.id]||(S.clinical[p.id]={fields:{},history:[]});
  const changed=[],prev={};CLIN.forEach(([k])=>{const v=$('#cl-'+k).value;if((c.fields[k]||'')!==v){changed.push(k);prev[k]=c.fields[k]||'';c.fields[k]=v}});
  if(!changed.length){toast('Nenhuma alteração para salvar');return}
  c.history=c.history||[];c.history.unshift({ts:Date.now(),who:me().name,changed,prev});c.updated=Date.now();c.by=me().name;
  audit('Registro clínico alterado',p.id);save();renderPacientes();toast('Registro clínico salvo')});

function authCrp(r){const c=r.crp||(r.author===profile().name?profile().crp:'');return c?' · '+esc(c):''}
function recFoot(r){return `<div class="rec-foot">Autoria: ${esc(r.author)}${authCrp(r)} · criado em ${fmtDT(r.created)}${r.history?.length?' · '+r.history.map(h=>`${h.action} ${fmtDT(h.ts)}`).join(' · '):''}</div>`}
function addendaHtml(r){return (r.addenda||[]).map(a=>`<div class="addendum"><small>Adendo · ${fmtDT(a.ts)} · ${esc(a.who)}${a.crp?' · '+esc(a.crp):''}</small>${esc(a.text)}</div>`).join('')}
function tabEvol(p){
  const list=S.evol.filter(e=>e.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  return `<div class="panel-head"><h2>Evolução das sessões</h2><span class="sp"></span><button class="btn primary" data-act="evolNew">Nova evolução</button></div>
  ${list.length?list.map(e=>`<article class="rec"><div class="rec-head"><span class="date">${fmtD(P(e.date+'T00:00'))}</span><span class="pill ${e.status}">${e.status==='rascunho'?'Rascunho':'Finalizado'}</span>${e.demo?DEMOP:''}<span class="sp"></span>${e.demo?`<button class="btn sm ghost danger" data-act="demoDel" data-k="evol" data-id="${e.id}">Excluir exemplo</button>`:''}${e.status==='rascunho'?`<button class="btn sm" data-act="evolEdit" data-id="${e.id}">Editar</button>`:`<button class="btn sm ghost" data-act="addendum" data-kind="evol" data-id="${e.id}">Adicionar adendo</button>`}</div><div class="rec-body">${esc(e.text)}</div>${addendaHtml(e)}${recFoot(e)}</article>`).join(''):'<p class="empty">Nenhuma evolução registrada.</p>'}`;
}
ACT.evolNew=()=>openEvol();ACT.evolEdit=d=>openEvol(d.id);
function openEvol(id){const e=id?S.evol.find(x=>x.id===id):null;
  modal(e?'Editar evolução':'Nova evolução',`<form id="f-ev" class="form"><div class="field"><label for="v-date">Data da sessão</label><input id="v-date" type="date" value="${e?e.date:dkey(new Date())}"></div>
  <div class="field"><label for="v-text">Registro da sessão</label><textarea id="v-text" rows="9">${esc(e?.text||'')}</textarea></div>
  <p class="hint">Rascunhos podem ser editados. Depois de finalizado, o registro só recebe adendos.</p>
  <div class="form-actions"><span class="sp"></span><button type="button" class="btn" id="v-draft">Salvar rascunho</button><button class="btn primary">Finalizar registro</button></div></form>`,true);
  const store=fin=>{const text=$('#v-text').value.trim();if(!text){toast('Escreva o registro antes de salvar');return}
    const rec=e||{id:uid(),pid:ui.pid,author:me().name,crp:profile().crp,created:Date.now(),addenda:[],history:[]};
    rec.date=$('#v-date').value||dkey(new Date());rec.text=text;rec.status=fin?'finalizado':'rascunho';rec.history.push({ts:Date.now(),who:me().name,action:fin?'Finalizado':'Rascunho salvo'});
    if(!e)S.evol.push(rec);audit(fin?'Evolução finalizada':'Evolução salva como rascunho',ui.pid);save();closeModal();renderPacientes();toast(fin?'Evolução finalizada':'Rascunho salvo')};
  $('#v-draft').onclick=()=>store(false);$('#f-ev').onsubmit=ev=>{ev.preventDefault();store(true)}}
ACT.addendum=d=>{const arr=d.kind==='evol'?S.evol:S.emdr;const r=arr.find(x=>x.id===d.id);
  modal('Adicionar adendo',`<form id="f-ad" class="form"><p class="hint">O registro original permanece inalterado. O adendo é anexado com data e autoria.</p><div class="field"><label for="ad-t">Texto do adendo</label><textarea id="ad-t" rows="5"></textarea></div><div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Anexar adendo</button></div></form>`);
  $('#f-ad').onsubmit=e=>{e.preventDefault();const t=$('#ad-t').value.trim();if(!t)return;r.addenda=r.addenda||[];r.addenda.push({ts:Date.now(),who:me().name,crp:profile().crp,text:t});r.history.push({ts:Date.now(),who:me().name,action:'Adendo'});audit('Adendo anexado',r.pid);save();closeModal();renderPacientes();toast('Adendo anexado')}};

function sudChart(recs){
  const pts=recs.filter(r=>r.sudi!==''||r.sudf!=='').sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
  if(pts.length<2)return'';
  const W=520,H=150,l=34,rgt=14,t=12,b=30;const n=pts.length;const x=i=>l+(n===1?0:i*(W-l-rgt)/(n-1));const y=v=>t+(10-v)*(H-t-b)/10;
  const line=(k,cls)=>{const a=pts.map((r,i)=>r[k]===''?null:[x(i),y(+r[k])]).filter(Boolean);if(!a.length)return'';return `<polyline points="${a.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${cls}" stroke-width="2" ${k==='sudi'?'stroke-dasharray="4 4"':''}/>${a.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===a.length-1?4.5:3}" fill="${cls}"/>`).join('')}`};
  return `<section class="panel"><div class="panel-head"><h2>Escala SUD ao longo das sessões</h2><span class="sp"></span><span class="legend"><span style="color:var(--sage)">- - SUD inicial</span><span style="color:var(--accent)">— SUD final</span></span></div>
  <div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="SUD inicial e final por sessão">
   ${[0,2,4,6,8,10].map(v=>`<line x1="${l}" x2="${W-rgt}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`).join('')}
   ${pts.map((r,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${r.date.slice(8,10)}/${r.date.slice(5,7)}</text>`).join('')}
   ${line('sudi','var(--sage)')}${line('sudf','var(--accent)')}
  </svg></div><p class="hint">Apenas os valores registrados pela psicóloga. O sistema não interpreta nem sugere condutas.</p></section>`;
}
function tabEmdr(p){
  const recs=S.emdr.filter(r=>r.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  const v=(l,x)=>x?`<div><dt>${l}</dt><dd>${esc(x)}</dd></div>`:'';
  return `<div class="panel-head"><h2>Registros EMDR</h2><span class="sp"></span><button class="btn primary" data-act="emdrRecNew">Novo registro EMDR</button></div>
  ${sudChart(recs)}
  ${recs.length?recs.map(r=>`<article class="rec"><div class="rec-head"><span class="date">${fmtD(P(r.date+'T00:00'))}</span><span class="phase">${r.fase?`Fase ${r.fase} · ${FASES[r.fase-1]}`:'Fase não informada'}</span><span class="pill ${r.status}">${r.status==='rascunho'?'Rascunho':'Finalizado'}</span>${r.demo?DEMOP:''}<span class="sp"></span>${r.demo?`<button class="btn sm ghost danger" data-act="demoDel" data-k="emdr" data-id="${r.id}">Excluir exemplo</button>`:''}${r.status==='rascunho'?`<button class="btn sm" data-act="emdrRecEdit" data-id="${r.id}">Editar</button>`:`<button class="btn sm ghost" data-act="addendum" data-kind="emdr" data-id="${r.id}">Adicionar adendo</button>`}</div>
   ${(r.voc||r.sudi||r.sudf||r.sets?.length)?`<div class="scales">${r.voc?`<span>VOC <b>${r.voc}</b>/7</span>`:''}${r.sudi!==''?`<span>SUD inicial <b>${r.sudi}</b>/10</span>`:''}${r.sudf!==''?`<span>SUD final <b>${r.sudf}</b>/10</span>`:''}${r.sets?.length?`<span>${r.sets.length} sets · ${r.sets.reduce((s,x)=>s+x.passes,0)} passagens</span>`:''}</div>`:''}

function rangeH(id,label,min,max,step,val,unit,tip){const t='t-'+id;return `<div class="range"><div class="top"><span class="lab-row"><label for="${id}">${label}</label>${tip?`<button type="button" class="info-btn" data-act="info" data-t="${t}" aria-expanded="false" aria-label="O que é ${label}?">?</button>`:''}</span><span class="mono" id="${id}-v">${val} ${unit}</span></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}">${tip?`<p class="explain" id="${t}" hidden>${tip}</p>`:''}</div>`}

function emdrMount(){
  E.stage=$('#stage');E.cv=$('#cv');E.g=E.cv.getContext('2d');
  const fit=()=>{E.dpr=Math.min(window.devicePixelRatio||1,2);E.cv.width=Math.round(E.stage.clientWidth*E.dpr);E.cv.height=Math.round(E.stage.clientHeight*E.dpr)};
  fit();E.ro=new ResizeObserver(fit);E.ro.observe(E.stage);
  $('#ctrl').addEventListener('input',readCfg);$('#ctrl').addEventListener('change',readCfg);
  $('#c-pid').addEventListener('change',e=>{ui.emdrPid=e.target.value});
  $('#c-notes').addEventListener('input',e=>{S.sessNotes=e.target.value;clearTimeout(E.nt);E.nt=setTimeout(save,400)});
  E.stage.addEventListener('pointermove',showHud);E.stage.addEventListener('pointerdown',showHud);
  E.fsH=()=>{const on=document.fullscreenElement===E.stage||E.stage.classList.contains('immersive');E.stage.classList.toggle('is-fs',on);if(on)showHud()};
  document.addEventListener('fullscreenchange',E.fsH);
  E.keyH=e=>{if(current!=='emdr'||!$('#modal').hidden)return;const tag=(e.target.tagName||'').toLowerCase();
    if(e.code==='Space'){if(['input','select','textarea','button'].includes(tag))return;e.preventDefault();eToggle()}
    if(e.key==='Escape'){if(E.stage.classList.contains('immersive')){exitFs()}else if(E.running)emdrStop('interrompido')}};
  document.addEventListener('keydown',E.keyH);
  renderPresets();renderSetLog();updateCfgLabels();updateTransport();
  E.lastTs=0;cancelAnimationFrame(E.raf);E.raf=requestAnimationFrame(frame);
}
function emdrTeardown(){
  if(E.running)finishSet('interrompido',true);
  cancelAnimationFrame(E.raf);E.raf=0;E.ro&&E.ro.disconnect();E.ro=null;
  if(E.keyH)document.removeEventListener('keydown',E.keyH);if(E.fsH)document.removeEventListener('fullscreenchange',E.fsH);
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  E.stage=null;E.cv=null;releaseWake();
}
function readCfg(e){
  const c=S.cfg;const n=id=>+$('#'+id).value;
  c.ppm=n('c-ppm');c.amp=n('c-amp');c.size=n('c-size');c.motion=$('#c-motion').value;if($('#c-shape'))c.shape=$('#c-shape').value;c.mode=$('#c-mode').value;
  c.limit=Math.max(2,n('c-limit')||30);c.secs=Math.max(5,n('c-secs')||30);c.audio=$('#c-audio').checked;c.vol=n('c-vol');c.tone=n('c-tone');
  if(e&&e.target.id==='c-dot'){c.dot=e.target.value;markSw()}
  if(e&&e.target.id==='c-bg'){c.bg=e.target.value;markSw()}
  $('#w-limit').hidden=c.mode!=='passagens';$('#w-secs').hidden=c.mode!=='tempo';
  if(e&&e.target.id==='c-audio'&&c.audio)ensureAudio();
  updateCfgLabels();clearTimeout(readCfg._t);readCfg._t=setTimeout(save,300);
}
function updateCfgLabels(){
  $$('#ctrl input[type=range]').forEach(r=>{$('#'+r.id+'-v').textContent=`${r.value} ${r.dataset.unit}`});

ACT.ePreset=d=>{const p=BUILTIN.find(x=>x.id===d.id)||S.presets.find(x=>x.id===d.id);if(!p)return;const {id,name,...rest}=p;Object.assign(S.cfg,rest);applyCfgToControls();save();toast(`Configuração “${p.name}” aplicada`)};

function eToggle(){
  if(!E.running){E.running=true;E.paused=false;E.phase=0;E.passes=0;E.setMs=0;E.ending=false;if(!E.sessionStart)E.sessionStart=Date.now();if(S.cfg.audio){ensureAudio();beep(-1)}requestWake()}
  else E.paused=!E.paused;
  updateTransport();

ACT.eToggle=()=>eToggle();
ACT.eStop=()=>emdrStop('interrompido');
function emdrStop(reason){if(E.running)finishSet(reason)}
function finishSet(reason,silent){
  E.sets.push({ts:Date.now(),durMs:Math.round(E.setMs),passes:E.passes,ppm:S.cfg.ppm,motion:S.cfg.motion,reason});
  E.running=false;E.paused=false;E.ending=false;releaseWake();
  if(!silent){updateTransport();renderSetLog()}
}
function updateTransport(){
  const t=$('#b-toggle');if(!t)return;
  const lab=!E.running?'Iniciar set':E.paused?'Retomar':'Pausar';t.textContent=lab;$('#fh-toggle').textContent=!E.running?'Iniciar':E.paused?'Retomar':'Pausar';
  $('#b-stop').disabled=!E.running;
  const st=$('#h-state');st.className='state '+(E.running?(E.paused?'pause':'run'):'');st.textContent=E.running?(E.paused?'Pausado':'Em estimulação'):(E.sets.length?'Set encerrado':'Pronto');
  $('#st-idle').hidden=E.running;
}
function renderSetLog(){const el=$('#setlog');if(!el)return;
  el.innerHTML=E.sets.length?`<div class="setlog">${E.sets.map((s,i)=>`<div><span class="mono muted">${i+1}</span><span>${s.passes} passagens · ${fmtDur(s.durMs)} · ${s.ppm}/min</span><span class="pill ${s.reason==='concluído'?'finalizado':'rascunho'}">${s.reason}</span></div>`).join('')}</div>`:'<p class="empty">Nenhum set realizado. Os sets aparecem aqui e podem ser anexados a um registro EMDR em rascunho.</p>';
  const a=$('#b-attach');if(a)a.disabled=!E.sets.length;
}
ACT.eNewSession=(d,b)=>{if(E.running)return toast('Interrompa o set atual primeiro');

  delete b.dataset.arm;b.textContent='Nova sessão';S.sessNotes='';$('#c-notes').value='';save();E.sets=[];E.sessionStart=null;E.setMs=0;E.passes=0;E.phase=0;renderSetLog();updateTransport();toast('Sessão reiniciada')};
ACT.eAttach=()=>{if(E.running)return toast('Interrompa o set atual primeiro');const pid=$('#c-pid').value;if(!pid){toast('Selecione o paciente para anexar');$('#c-pid').focus();return}
  if(!E.sets.length)return;const sets=E.sets.slice();const notes=S.sessNotes||'';S.sessNotes='';E.sets=[];E.sessionStart=null;save();

ACT.eFs=()=>enterFs();ACT.eExitFs=()=>exitFs();
async function enterFs(){const st=E.stage;try{if(st.requestFullscreen){await st.requestFullscreen();return}if(st.webkitRequestFullscreen){st.webkitRequestFullscreen();return}throw 0}catch(e){st.classList.add('immersive');E.fsH()}}
function exitFs(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(E.stage){E.stage.classList.remove('immersive');E.fsH()}}
function showHud(){if(!E.stage)return;E.stage.classList.add('hud-on');clearTimeout(E.hudTimer);E.hudTimer=setTimeout(()=>E.stage&&E.stage.classList.remove('hud-on'),2600)}
async function requestWake(){try{if(navigator.wakeLock)E.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{E.wl&&E.wl.release()}catch(e){}E.wl=null}
function ensureAudio(){try{if(!E.actx)E.actx=new(window.AudioContext||window.webkitAudioContext)();if(E.actx.state==='suspended')E.actx.resume()}catch(e){}}
function beep(side){const c=S.cfg;if(!c.audio||!E.actx||c.vol<=0)return;try{const a=E.actx,t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=c.tone;const v=Math.max(0.0002,c.vol/100*0.5);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);o.connect(g);
  if(a.createStereoPanner){const p=a.createStereoPanner();p.pan.value=side;g.connect(p);p.connect(a.destination)}else g.connect(a.destination);o.start(t);o.stop(t+0.2)}catch(e){}}
ACT.eTestAudio=()=>{ensureAudio();const was=S.cfg.audio;S.cfg.audio=true;beep(-1);setTimeout(()=>{beep(1);S.cfg.audio=was},450)};

function frame(ts){
  const dt=E.lastTs?Math.min(ts-E.lastTs,100):0;E.lastTs=ts;const c=S.cfg;
  if(E.running&&!E.paused){
    const prev=E.phase;E.phase+=dt/(60000/c.ppm);E.setMs+=dt;
    const n=Math.floor(E.phase)-Math.floor(prev);
    for(let i=0;i<n;i++){E.passes++;beep(E.passes%2?1:-1)}
    if(c.mode==='tempo'&&E.setMs>=c.secs*1000)E.ending=true;
    if((c.mode==='passagens'&&E.passes>=c.limit)||(E.ending&&n>0)){E.phase=E.passes;finishSet('concluído')}
  }
  draw();
  if(ts-E.hudT>90){E.hudT=ts;hud()}
  if(E.cv)E.raf=requestAnimationFrame(frame);
}
function draw(){
  const cv=E.cv;if(!cv||!cv.width)return;const g=E.g,W=cv.width,H=cv.height,d=E.dpr,c=S.cfg;
  g.fillStyle=c.bg;g.fillRect(0,0,W,H);
  const p=E.phase;let pos;
  if(c.motion==='linear'){const f=((p%2)+2)%2;pos=f<1?-1+2*f:3-2*f}else pos=-Math.cos(Math.PI*p);
  const r=c.size/2*d;const span=Math.max(0,(W/2-r-14*d))*(c.amp/100);
  const x=W/2+pos*span,y=H/2;
  drawDot(g,c,x,y,r);
}
function hud(){
  if(!$('#h-set'))return;const set=fmtDur(E.setMs);
  $('#h-set').textContent=set;$('#h-pass').textContent=E.passes;$('#h-cyc').textContent=Math.floor(E.passes/2);
  $('#h-sess').textContent=E.sessionStart?fmtDur(Date.now()-E.sessionStart):'00:00';
  $('#fh-set').textContent=set;$('#fh-pass').textContent=`${E.passes} passagens`;
  if(!E.running&&$('#b-stop')&&!$('#b-stop').disabled)updateTransport();
}

function bindDrag(){if(!S.prefs.agenda.drag)return;$$('.tg .ev[data-id]').forEach(el=>el.addEventListener('pointerdown',e=>startDrag(e,el)))}
function startDrag(e,el){
  if(e.pointerType==='touch'||e.button!==0)return;
  const a=S.appts.find(x=>x.id===el.dataset.id);if(!a)return;
  const r=el.getBoundingClientRect();const D={x0:e.clientX,y0:e.clientY,off:e.clientY-r.top,moved:false,ghost:null,target:null};
  const move=ev=>{
    if(!D.moved){if(Math.hypot(ev.clientX-D.x0,ev.clientY-D.y0)<6)return;D.moved=true;el.classList.add('dragging');D.ghost=el.cloneNode(true);D.ghost.classList.remove('dragging');D.ghost.classList.add('ev-ghost');D.ghost.removeAttribute('data-act');D.ghost.removeAttribute('data-id')}
    const col=$$('.tg .day-col').find(c=>{const cr=c.getBoundingClientRect();return ev.clientX>=cr.left&&ev.clientX<cr.right});if(!col)return;
    const cr=col.getBoundingClientRect();const stp=S.prefs.agenda.step;
    let m=H0*60+Math.round(((ev.clientY-D.off-cr.top)/PX*60)/stp)*stp;m=Math.max(H0*60,Math.min(m,H1*60-stp));
    if(D.ghost.parentNode!==col)col.appendChild(D.ghost);D.ghost.style.top=((m-H0*60)/60*PX+1)+'px';
    const s=P(`${col.dataset.day}T${pad(Math.floor(m/60))}:${pad(m%60)}`);D.target=s;
    const c=a.status==='cancelado'?null:conflict(s,a.dur,a.id);D.ghost.classList.toggle('bad',!!c);
    const tm=D.ghost.querySelector('.tm');if(tm)tm.textContent=`${fmtT(s)}–${fmtT(addMin(s,a.dur))}`};
  const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
    if(!D.moved)return;justDragged=Date.now();const s=D.target;
    if(!s||isoL(s)===a.start){renderAgenda();return}
    if(a.status==='realizado'){toast('Consultas realizadas não podem ser movidas.');renderAgenda();return}
    const c=a.status==='cancelado'?null:conflict(s,a.dur,a.id);if(c){toast(c);renderAgenda();return}
    a.start=isoL(s);audit(`Reagendamento (arrastar) para ${fmtD(s)} ${fmtT(s)}`,a.pid);save();renderAgenda();toast(`Reagendada para ${fmtD(s)} às ${fmtT(s)}`)};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);e.preventDefault();
}

function extenso(v){const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],ce=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];

  let g='';for(let v=0;v<=top+1e-6;v+=stp)g+=`<line x1="${l}" x2="${W-rr}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)"/><text x="${l-8}" y="${yv(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${kfmt(v)}</text>`;
