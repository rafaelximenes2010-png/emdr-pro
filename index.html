  b.innerHTML=`<button class="pt-ib ${RTC.cam?'':'off'}" data-act="rtcCam">${RTC.cam?IC.cam:IC.camoff}<span>Câmera</span></button><button class="pt-ib ${RTC.mic?'':'off'}" data-act="rtcMic">${RTC.mic?IC.mic:IC.micoff}<span>Microfone</span></button><button class="pt-ib" data-act="devices">${IC.gear}<span>Dispositivos</span></button>${document.fullscreenEnabled?`<button class="pt-ib" data-act="ptFull">${IC.full}<span>Tela cheia</span></button>`:''}<button class="pt-ib leave" data-act="ptLeave">${IC.leave}<span>Sair</span></button>`}
ACT.ptJoin=async()=>{meterStop();ptJoined=true;try{ptAC=ptAC||new(window.AudioContext||window.webkitAudioContext)();ptAC.resume&&ptAC.resume()}catch(e){}
  try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}
  try{RTC.peer&&RTC.peer.destroy()}catch(e){}RTC.peer=null;RTC.conn=null;RTC.call=null;RTC.role=null;ptState('wait');rtcJoin(SALA)};
window.addEventListener('resize',()=>{if(PATIENT&&RTC.conn&&RTC.conn.open){clearTimeout(window.__dimT);window.__dimT=setTimeout(()=>send({type:'dims',w:innerWidth,h:innerHeight}),300)}});
ACT.ptLeave=()=>{if(PJ.running)pjFinish('interrompido pelo paciente');document.body.classList.remove('pj-present','pj-running');ptTrStop();rtcStop();ptJoined=false;ptState('bye')};
ACT.ptStop=()=>{if(PJ.running){pjFinish('interrompido pelo paciente');toast('Estimulação interrompida')}};
function ptBye(){ptTrStop();document.body.classList.remove('pj-present','pj-running');setTimeout(()=>{rtcStop();ptJoined=false;ptState('bye')},300)}
function ptTrStop(){if(ptTR){ptTR.on=false;try{ptTR.r.stop()}catch(e){}ptTR=null}}
function ptMsg(m){
  if(m.type==='consent-req'){modal('Autorização',`<p style="margin-top:0">A psicóloga pede autorização para <b>gravar e transcrever</b> esta sessão, para o seu prontuário. A gravação fica guardada apenas com ela, em sigilo.</p><p class="hint">Você pode recusar sem nenhum prejuízo ao atendimento.</p><div class="form-actions"><button class="btn ghost" data-act="ptConsent" data-v="0">Não autorizo</button><span class="sp"></span><button class="btn primary" data-act="ptConsent" data-v="1">Autorizo</button></div>`)}
  else if(m.type==='tr-start'){if(!RTC.consent)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||ptTR)return;const r=new SR();r.lang='pt-BR';r.continuous=true;r.interimResults=false;ptTR={r,on:true};
    r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal&&res[0].transcript.trim())send({type:'tr',text:res[0].transcript.trim()})}};
    r.onend=()=>{if(ptTR&&ptTR.on){try{r.start()}catch(e){}}};try{r.start()}catch(e){}}
  else if(m.type==='tr-stop')ptTrStop();
  else if(m.type==='ping2')send({type:'pong2',t:m.t});
  else if(m.type==='share')toast(m.on?'A psicóloga está compartilhando a tela':'Compartilhamento de tela encerrado')}
ACT.ptPause=()=>{if(!PJ.running||PJ.paused)return;PJ.paused=true;PJ.patientPause=true;pjUi();pjStatus();send({type:'pausereq'});toast('Pausa pedida. Aguarde a psicóloga.')};
function ptFeedback(){modal('Como foi?',`<p style="margin-top:0">Esse foi um teste curto. Como você se sentiu com o movimento e o som?</p><div class="form-actions" style="flex-direction:column;align-items:stretch"><button class="btn primary" data-act="ptFb" data-v="Confortável">Confortável</button><button class="btn" data-act="ptFb" data-v="Pode ser mais devagar">Pode ser mais devagar</button><button class="btn" data-act="ptFb" data-v="Pode ser mais rápido">Pode ser mais rápido</button><button class="btn danger" data-act="ptFb" data-v="Desconfortável">Desconfortável</button></div>`)}
ACT.ptFb=d=>{send({type:'feedback',v:d.v});closeModal();toast('Obrigado! Resposta enviada.')};
ACT.ptFull=()=>{try{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){toast('Este aparelho não permite tela cheia aqui.')}};
ACT.ptConsent=d=>{RTC.consent=d.v==='1';send({type:'consent',value:RTC.consent});closeModal();toast(RTC.consent?'Obrigado. Autorização enviada.':'Tudo bem. A sessão segue sem gravação.')};

/* =========================================================
   APP NATIVO (iOS e Android, via Capacitor)
   ========================================================= */
function isNative(){try{return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}catch(e){return false}}
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(b)});
async function saveFile(name,blob){
  if(!isNative()){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.dataset.native='0';document.body.appendChild(a);a.click();a.remove();return}
  try{const P=window.Capacitor.Plugins;const data=await blobB64(blob);
    const w=await P.Filesystem.writeFile({path:name,data,directory:'CACHE'});
    await P.Share.share({title:name,files:[w.uri],dialogTitle:'Salvar ou enviar'});}
  catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('Não foi possível salvar o arquivo.')}}
/* No app, todo link de download vira "Salvar ou enviar" (Arquivos, Drive, AirDrop, WhatsApp, Imprimir). */
document.addEventListener('click',e=>{if(!isNative())return;const a=e.target.closest&&e.target.closest('a[download]');if(!a||a.dataset.native==='0')return;e.preventDefault();e.stopImmediatePropagation();
  fetch(a.href).then(r=>r.blob()).then(b=>saveFile(a.getAttribute('download')||'arquivo',b)).catch(()=>toast('Não foi possível salvar o arquivo.'))},true);
if(isNative()){document.documentElement.classList.add('is-native');
  try{const SB=window.Capacitor.Plugins.StatusBar;SB&&SB.setStyle&&SB.setStyle({style:'DARK'})}catch(e){}}

/* =========================================================
   APLICATIVO (PWA): instalação, offline e cópia de segurança
   ========================================================= */
const isStandalone=()=>isNative()||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let installEvt=null;
function installUi(){const b=$('#nav-install');if(!b)return;b.hidden=isStandalone()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;installUi()});
window.addEventListener('appinstalled',()=>{installEvt=null;installUi();toast('EMDR PRO instalado')});
const SHARE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 11v9h14v-9"/></svg>';
const PLUS_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
const isIPad=()=>/ipad/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isIOSChrome=()=>/CriOS|FxiOS|EdgiOS/i.test(navigator.userAgent);
const isAndroid=()=>/android/i.test(navigator.userAgent);
function instClose(remember){const o=$('#inst');if(o)o.remove();$$('.inst-arrow').forEach(x=>x.remove());if(remember){try{localStorage.setItem('emdrpro.inst',String(Date.now()))}catch(e){}}}
function instSheet(){if(isStandalone())return;instClose();const logo=($('.brand-logo')||{}).src||'';
  let body,arrow='';
  if(installEvt){body=`<button class="btn primary huge" data-act="instNow">Baixar o app</button><p class="hint" style="margin:0;text-align:center">Instala direto na tela inicial, com o ícone do coração.</p>`}
  else if(isIOS()){const top=isIPad()||isIOSChrome();arrow=`<svg class="inst-arrow ${top?'up':'down'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg>`;
    body=`<ol class="inst-steps"><li><i>1</i><span>Toque em ${SHARE_SVG} <b>Compartilhar</b> ${top?'no topo da tela':'na barra de baixo'}</span></li><li><i>2</i><span>Toque em ${PLUS_SVG} <b>Adicionar à Tela de Início</b></span></li></ol><p class="hint" style="margin:0">Pronto: o EMDR PRO fica na tela inicial e abre como app. Se não aparecer a opção, toque no ícone do Safari (bússola) para abrir o link no Safari e repita.</p>`}
  else if(isAndroid()){body=`<ol class="inst-steps"><li><i>1</i><span>Toque no menu <b>⋮</b> do Chrome</span></li><li><i>2</i><span>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b></span></li></ol>`}
  else{body=`<ol class="inst-steps"><li><i>1</i><span>No Chrome ou no Edge, clique no ícone de instalar ${PLUS_SVG} na barra de endereço</span></li><li><i>2</i><span>Confirme em <b>Instalar</b></span></li></ol>`}
  const o=document.createElement('div');o.id='inst';o.className='inst';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Baixar o app EMDR PRO');
  o.innerHTML=`<div class="inst-card"><button class="icon-btn inst-x" data-act="instLater" aria-label="Fechar">×</button><div class="inst-top">${logo?`<img src="${logo}" alt="">`:''}<div><b>EMDR PRO</b><span>Karina Ximenes · Psicóloga</span></div></div>${body}<button class="btn ghost" data-act="instLater">Agora não</button></div>`;
  o.addEventListener('click',e=>{if(e.target===o)instClose(true)});document.body.appendChild(o);if(arrow)document.body.insertAdjacentHTML('beforeend',arrow)}
ACT.install=()=>instSheet();
ACT.instLater=()=>instClose(true);
ACT.instNow=async()=>{if(!installEvt){instSheet();return}installEvt.prompt();try{const r=await installEvt.userChoice;if(r&&r.outcome==='accepted')toast('Instalando o EMDR PRO na tela inicial')}catch(e){}installEvt=null;instClose(true);installUi()};
function instAuto(){if(isStandalone()||PATIENT)return;const forced=/[?&#]instalar\b/.test(location.href);let last=0;try{last=+localStorage.getItem('emdrpro.inst')||0}catch(e){}
  if(!forced&&Date.now()-last<3*86400000)return;if(!(isIOS()||isAndroid()||installEvt))return;setTimeout(()=>{if(!$('#modal').hidden||$('#tour:not([hidden])'))return;instSheet()},forced?300:1500)}
window.addEventListener('beforeinstallprompt',()=>{const o=$('#inst');if(o)instSheet()});
window.addEventListener('load',()=>setTimeout(instAuto,400));
if(!isNative()&&'serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:'){let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
installUi();

function backupHtml(){return `<section class="panel" id="pz-backup"><h2>Cópia de segurança</h2>
  <p class="hint" style="margin:0">Os dados ficam guardados neste aparelho. Baixe uma cópia com regularidade e use <b>Restaurar</b> para levar tudo a outro aparelho, por exemplo do computador para o celular.</p>
  <div class="form-actions"><button class="btn primary" data-act="bkSave">Baixar cópia (.json)</button><label class="btn" for="bk-file">Restaurar cópia</label><input type="file" id="bk-file" accept="application/json,.json" hidden></div>
  <p class="hint" style="margin:0">A cópia contém prontuários e dados clínicos. Guarde o arquivo em local protegido e não envie por e-mail ou mensagem.</p></section>`}
ACT.bkSave=()=>{if(!canClinical()){toast('Somente a psicóloga pode baixar a cópia completa');return}
  const n=new Date();const name=`emdrpro-copia_${dkey(n)}_${pad(n.getHours())}h${pad(n.getMinutes())}.json`;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'EMDR PRO',version:APP_VERSION,exported:n.toISOString(),data:S})],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();audit('Cópia de segurança baixada');save();toast(`Cópia gerada: ${name}`)}
  catch(e){toast('O navegador bloqueou o download.')}};
document.addEventListener('change',e=>{if(e.target.id!=='bk-file')return;const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(!canAdmin()){toast('Sem permissão para restaurar');return}
  const rd=new FileReader();rd.onload=()=>{let j;try{j=JSON.parse(rd.result)}catch(x){toast('Arquivo inválido: não é uma cópia do EMDR PRO.');return}
    const d=j&&j.app==='EMDR PRO'&&j.data;if(!d||!Array.isArray(d.patients)||!Array.isArray(d.appts)){toast('Arquivo inválido: não é uma cópia do EMDR PRO.');return}
    window.__bk=d;modal('Restaurar cópia',`<p style="margin-top:0">Restaurar a cópia de <b>${esc(fmtDT(j.exported))}</b>, com ${d.patients.length} pacientes e ${d.appts.length} agendamentos?</p><p class="hint">Todos os dados atuais deste aparelho serão substituídos pela cópia. Se tiver dúvida, baixe antes uma cópia dos dados atuais.</p><div class="form-actions"><span class="sp"></span><button class="btn ghost" data-close>Cancelar</button><button class="btn danger solid" data-act="bkRestoreOk">Substituir e restaurar</button></div>`)};
  rd.readAsText(f)});
ACT.bkRestoreOk=()=>{const d=window.__bk;if(!d)return;emdrTeardown();S=d;S.cfg={...DEF_CFG,...S.cfg};migrate();window.__bk=null;ui.pid=null;audit('Cópia de segurança restaurada');save();closeModal();go('painel');route();toast('Cópia restaurada')};

/* ---------- início ---------- */
load();route();
</script>
