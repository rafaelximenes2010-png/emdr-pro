    g+=`<rect x="${x-bw-2}" y="${yv(d.r)}" width="${bw}" height="${Math.max(0,yv(0)-yv(d.r))}" rx="3" fill="var(--accent)" opacity="${cur?1:.6}"><title>Recebido: ${brl(d.r)}</title></rect><rect x="${x+2}" y="${yv(d.e)}" width="${bw}" height="${Math.max(0,yv(0)-yv(d.e))}" rx="3" fill="var(--gold)" opacity="${cur?1:.6}"><title>Despesas: ${brl(d.e)}</title></rect><text x="${x}" y="${H-10}" text-anchor="middle" font-size="12" fill="${cur?'var(--ink)':'var(--muted)'}" font-weight="${cur?700:400}">${MES[mm-1].slice(0,3)}/${d.k.slice(2,4)}</text>`});
  return `<section class="panel"><div class="panel-head"><h2>Recebido e despesas</h2><span class="sp"></span><span class="legend"><span><i class="legend-dot" style="background:var(--accent)"></i>Recebido</span><span><i class="legend-dot" style="background:var(--gold)"></i>Despesas</span></span></div><div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recebido e despesas nos últimos quatro meses, em reais">${g}</svg></div><p class="hint">Valores em reais, pelo mês do pagamento ou da despesa.</p></section>`}

let fm=null,ftab='cobrancas',ff='todas';
function renderFinanceiro(){
  syncCharges();if(!fm)fm=todayKey().slice(0,7);const k=finMonth(fm);const[y,m]=fm.split('-').map(Number);
  let body='';
  if(ftab==='cobrancas'){
    const list=S.fin.charges.filter(c=>ff==='atraso'?isLate(c):c.date.slice(0,7)===fm&&(ff==='todas'||(ff==='pendentes'&&c.status==='pendente')||(ff==='pagas'&&c.status==='pago'))).sort((a,b)=>b.date.localeCompare(a.date));
    body=`<div class="panel-head"><div class="seg" role="group" aria-label="Filtrar cobranças">${[['todas','Todas'],['pendentes','A receber'],['atraso','Em atraso (todas)'],['pagas','Pagas']].map(([v,l])=>`<button data-act="ff" data-v="${v}" aria-pressed="${ff===v}">${l}</button>`).join('')}</div><span class="sp"></span><span class="hint">${list.length} cobranças · ${brl(fsum(list.filter(c=>c.status!=='isento')))}</span></div>
    ${list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Paciente</th><th>Descrição</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>${list.map(chargeRow).join('')}</tbody></table></div>`:'<p class="empty">Nenhuma cobrança neste filtro.</p>'}`;
  }else if(ftab==='despesas'){
    const list=S.fin.expenses.filter(e=>e.date.slice(0,7)===fm).sort((a,b)=>b.date.localeCompare(a.date));const byCat={};list.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+(+e.amount));
    body=`<div class="panel-head"><div class="chips">${Object.entries(byCat).map(([c,v])=>`<span class="pill encerrado">${esc(c)} · ${brl(v)}</span>`).join('')}</div><span class="sp"></span><button class="btn sm primary" data-act="fExp">Nova despesa</button></div>
    ${list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th><th></th></tr></thead><tbody>${list.map(e=>`<tr><td class="mono">${fmtShort(e.date)}</td><td>${esc(e.desc)}</td><td>${esc(e.cat)}</td><td class="num mono">${brl(e.amount)}</td><td class="acts">${dd('⋯',[{label:'Editar',hint:'Data, descrição, categoria ou valor',act:'fExp',data:{id:e.id}},'-',{label:'Excluir',hint:'Remove a despesa, após confirmação',act:'fExpDel',data:{id:e.id},danger:true}],'icon-btn',true)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total do mês</td><td class="num mono">${brl(fsum(list))}</td><td></td></tr></tfoot></table></div>`:'<p class="empty">Nenhuma despesa lançada neste mês.</p>'}`;
  }else{
    const pts=S.patients.filter(p=>p.sit!=='encerrado'||S.fin.charges.some(c=>c.pid===p.id&&c.status==='pendente')).sort((a,b)=>pname(a).localeCompare(pname(b)));
    body=`<p class="hint" style="margin:0">O valor da sessão vale para as próximas cobranças. Cobranças já geradas mantêm o valor original e podem ser editadas uma a uma.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Paciente</th><th class="num">Valor da sessão</th><th class="num">Sessões no mês</th><th class="num">Recebido no mês</th><th class="num">Em aberto</th><th></th></tr></thead><tbody>${pts.map(p=>{const ch=S.fin.charges.filter(c=>c.pid===p.id);const sm=ch.filter(c=>c.date.slice(0,7)===fm&&c.status!=='isento').length;const rec=fsum(ch.filter(c=>c.status==='pago'&&(c.paidAt||'').slice(0,7)===fm));const ab=ch.filter(c=>c.status==='pendente');const late=ab.some(isLate);
      return `<tr><td>${esc(pname(p))}</td><td class="num mono">${brl(priceFor(p.id))}${S.fin.prices[p.id]==null?' <span class="pill encerrado">padrão</span>':''}</td><td class="num mono">${sm}</td><td class="num mono">${brl(rec)}</td><td class="num mono" style="color:${late?'var(--bad)':'inherit'}">${brl(fsum(ab))}</td><td class="acts"><button class="btn sm" data-act="fPrice" data-pid="${p.id}">Alterar valor</button></td></tr>`}).join('')}</tbody></table></div>`;
  }
  $('#view').innerHTML=`<div class="view-in">
  <div class="page-head"><div><div class="eyebrow">Gestão financeira</div><h1>Financeiro</h1><div class="sub">${MES[m-1][0].toUpperCase()+MES[m-1].slice(1)} de ${y} · separado do prontuário clínico</div></div><span class="sp"></span>
    <div class="seg"><button data-act="fMonth" data-n="-1" aria-label="Mês anterior">‹</button><button data-act="fMonth" data-n="0">Mês atual</button><button data-act="fMonth" data-n="1" aria-label="Próximo mês">›</button></div>
    ${dd('Lançar',[{label:'Cobrança avulsa',hint:'Valor fora de uma sessão agendada, como relatório ou devolutiva',act:'fCharge'},{label:'Despesa',hint:'Aluguel, supervisão, materiais e outros custos do consultório',act:'fExp'},'-',{label:'Valores e prazos',hint:'Valor padrão da sessão, prazo de pagamento, cobrança de ausências e cidade do recibo',act:'finSettings'}],'btn primary')}</div>
  ${howto('Como funciona o financeiro',`<ul><li>Quando uma consulta é marcada como <b>Realizada</b> na agenda, uma cobrança é criada com o valor da sessão do paciente e o prazo definido em Valores e prazos.</li><li><b>Receber</b> registra data, forma e valor do pagamento e numera o recibo. <b>Recibo</b> mostra o texto pronto, com valor por extenso, para copiar.</li><li>Cobrança vencida e não paga aparece como <b>Em atraso</b> e entra nas pendências do painel.</li><li>A recepção também acessa este módulo; nada do prontuário clínico aparece aqui.</li></ul>`)}
  <div class="stats kpis">
    <button type="button" class="stat" data-act="drill" data-k="recebido" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money">${brl(k.recebido)}</span><span class="l">Recebido no mês <span class="caret">▾</span></span></button>
    <button type="button" class="stat" data-act="drill" data-k="areceber" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money">${brl(k.aReceber)}</span><span class="l">A receber (no prazo) <span class="caret">▾</span></span></button>
    <button type="button" class="stat" data-act="drill" data-k="atraso" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money" style="color:${k.atraso?'var(--bad)':'inherit'}">${brl(k.atraso)}</span><span class="l">Em atraso · ${k.nAtraso} cobranças <span class="caret">▾</span></span></button>
    <button type="button" class="stat" data-act="drill" data-k="despesas" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money">${brl(k.despesas)}</span><span class="l">Despesas do mês <span class="caret">▾</span></span></button>
    <button type="button" class="stat" data-act="drill" data-k="resultado" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money">${brl(k.resultado)}</span><span class="l">Resultado do mês <span class="caret">▾</span></span></button>
    ${on('agenda')?`<button type="button" class="stat" data-act="drill" data-k="ocupacao" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n">${k.ocup}%</span><span class="l">Ocupação da agenda <span class="caret">▾</span></span></button>`:''}
  </div>
  ${finChart()}
  <section class="panel"><div class="tabs" role="tablist">${[['cobrancas','Cobranças'],['despesas','Despesas'],['pacientes','Por paciente']].map(([t,l])=>`<button role="tab" aria-selected="${ftab===t}" data-act="ftab" data-t="${t}">${l}</button>`).join('')}</div>${body}</section>
  </div>`;
}
function chargeRow(c){const p=getP(c.pid);const late=isLate(c);
  const sit=c.status==='pago'?`<span class="pill finalizado">Pago ${fmtShort(c.paidAt)} · ${esc(c.method)}</span>`:c.status==='isento'?'<span class="pill encerrado">Isento</span>':late?`<span class="pill st-cancelado">Em atraso · venceu ${fmtShort(c.due)}</span>`:`<span class="pill rascunho">A receber · vence ${fmtShort(c.due)}</span>`;
  const acts=c.status==='pendente'?`<button class="btn sm primary" data-act="fPay" data-id="${c.id}">Receber</button>${dd('⋯',[{label:'Editar valor',hint:'Ajusta o valor só desta cobrança',act:'fEdit',data:{id:c.id}},{label:'Isentar',hint:'Marca como sem cobrança, por exemplo sessão social',act:'fExempt',data:{id:c.id}}],'icon-btn',true)}`
    :c.status==='pago'?`<button class="btn sm" data-act="fReceipt" data-id="${c.id}">Recibo</button>${dd('⋯',[{label:'Estornar pagamento',hint:'Volta a cobrança para “a receber”',act:'fUnpay',data:{id:c.id}}],'icon-btn',true)}`
    :dd('⋯',[{label:'Reabrir cobrança',hint:'Volta a cobrança para “a receber”',act:'fUnpay',data:{id:c.id}}],'icon-btn',true);
  return `<tr><td class="mono">${fmtShort(c.date)}</td><td>${esc(pname(p))}</td><td>${esc(c.desc)}${c.demo?' '+DEMOS:''}</td><td class="num mono">${brl(c.amount)}</td><td>${sit}</td><td class="acts">${acts}${c.demo&&canAdmin()?`<button class="btn sm ghost danger" data-act="demoDel" data-k="charge" data-id="${c.id}">Excluir exemplo</button>`:''}</td></tr>`}
const fCh=id=>S.fin.charges.find(x=>x.id===id);
ACT.ftab=d=>{ftab=d.t;renderFinanceiro()};ACT.ff=d=>{ff=d.v;renderFinanceiro()};
ACT.fMonth=d=>{const n=+d.n;if(!n)fm=todayKey().slice(0,7);else{const[y,m]=fm.split('-').map(Number);fm=dkey(new Date(y,m-1+n,1)).slice(0,7)}renderFinanceiro()};
ACT.fPay=d=>{const c=fCh(d.id);modal('Registrar pagamento',`<form id="f-pay" class="form"><p class="hint" style="margin:0">${esc(pname(getP(c.pid)))} · ${esc(c.desc)} · ${fmtD(P(c.date+'T00:00'))}</p>
  <div class="row3"><div class="field"><label for="py-d">Data do pagamento</label><input id="py-d" type="date" value="${todayKey()}"></div><div class="field"><label for="py-m">Forma de pagamento</label><select id="py-m">${PAY_METHODS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="py-v">Valor (R$)</label><input id="py-v" type="number" min="0" step="0.01" value="${c.amount}"></div></div>
  <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Confirmar recebimento</button></div></form>`);
  $('#f-pay').onsubmit=e=>{e.preventDefault();const v=+$('#py-v').value;if(!(v>0)){toast('Informe um valor maior que zero');return}
    Object.assign(c,{status:'pago',paidAt:$('#py-d').value||todayKey(),method:$('#py-m').value,amount:v,receipt:c.receipt||++S.fin.seq});save();closeModal();renderFinanceiro();toast(`Pagamento registrado · recibo nº ${String(c.receipt).padStart(4,'0')}`)}};
ACT.fUnpay=d=>{const c=fCh(d.id);c.status='pendente';delete c.paidAt;delete c.method;save();renderFinanceiro();toast('Cobrança reaberta')};
ACT.fExempt=d=>{fCh(d.id).status='isento';save();renderFinanceiro();toast('Cobrança isenta')};
ACT.fEdit=d=>{const c=fCh(d.id);modal('Editar valor',`<form id="f-ed" class="form"><div class="field"><label for="ed-v">Valor desta cobrança (R$)</label><input id="ed-v" type="number" min="0" step="0.01" value="${c.amount}"></div><div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`);
  $('#f-ed').onsubmit=e=>{e.preventDefault();const v=+$('#ed-v').value;if(!(v>=0))return;c.amount=v;save();closeModal();renderFinanceiro();toast('Valor atualizado')}};
ACT.fCharge=()=>{const pts=S.patients.filter(p=>p.sit!=='encerrado').sort((a,b)=>pname(a).localeCompare(pname(b)));
  modal('Cobrança avulsa',`<form id="f-ch" class="form"><div class="field"><label for="ch-p">Paciente</label><select id="ch-p">${pts.map(p=>`<option value="${p.id}">${esc(pname(p))}</option>`).join('')}</select></div>
  <div class="field"><label for="ch-d">Descrição</label><input id="ch-d" placeholder="Ex.: relatório psicológico"></div>
  <div class="row3"><div class="field"><label for="ch-dt">Data</label><input id="ch-dt" type="date" value="${todayKey()}"></div><div class="field"><label for="ch-due">Vencimento</label><input id="ch-due" type="date" value="${dkey(addDays(new Date(),+S.prefs.fin.prazo||0))}"></div><div class="field"><label for="ch-v">Valor (R$)</label><input id="ch-v" type="number" min="0" step="0.01" value="${S.prefs.fin.price}"></div></div>
  <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Lançar cobrança</button></div></form>`);
  $('#f-ch').onsubmit=e=>{e.preventDefault();const v=+$('#ch-v').value;const desc=$('#ch-d').value.trim();if(!desc||!(v>0)){toast('Informe descrição e valor');return}
    S.fin.charges.push({id:uid(),apptId:null,pid:$('#ch-p').value,date:$('#ch-dt').value||todayKey(),due:$('#ch-due').value||todayKey(),amount:v,desc,status:'pendente'});save();closeModal();ftab='cobrancas';renderFinanceiro();toast('Cobrança lançada')}};
ACT.fExp=d=>{const x=d.id?S.fin.expenses.find(e=>e.id===d.id):{date:todayKey(),desc:'',cat:EXP_CATS[0],amount:''};
  modal(d.id?'Editar despesa':'Nova despesa',`<form id="f-ex" class="form"><div class="field"><label for="ex-d">Descrição</label><input id="ex-d" value="${esc(x.desc)}"></div>
  <div class="row3"><div class="field"><label for="ex-dt">Data</label><input id="ex-dt" type="date" value="${x.date}"></div><div class="field"><label for="ex-c">Categoria</label><select id="ex-c">${EXP_CATS.map(c=>`<option ${x.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="ex-v">Valor (R$)</label><input id="ex-v" type="number" min="0" step="0.01" value="${x.amount}"></div></div>
  <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar despesa</button></div></form>`);
  $('#f-ex').onsubmit=e=>{e.preventDefault();const v=+$('#ex-v').value,desc=$('#ex-d').value.trim();if(!desc||!(v>0)){toast('Informe descrição e valor');return}
    const rec={date:$('#ex-dt').value||todayKey(),desc,cat:$('#ex-c').value,amount:v};if(d.id)Object.assign(x,rec);else S.fin.expenses.push({id:uid(),...rec});
    fm=rec.date.slice(0,7);ftab='despesas';save();closeModal();renderFinanceiro();toast('Despesa salva')}};
ACT.fExpDel=d=>{const x=S.fin.expenses.find(e=>e.id===d.id);modal('Excluir despesa',`<p style="margin-top:0">Excluir “${esc(x.desc)}” (${brl(x.amount)})?</p><div class="form-actions"><span class="sp"></span><button class="btn ghost" data-close>Cancelar</button><button class="btn danger solid" data-act="fExpDelOk" data-id="${x.id}">Excluir</button></div>`)};
ACT.fExpDelOk=d=>{S.fin.expenses=S.fin.expenses.filter(e=>e.id!==d.id);save();closeModal();renderFinanceiro();toast('Despesa excluída')};
ACT.fPrice=d=>{const p=getP(d.pid);const cur=S.fin.prices[p.id];
  modal('Valor da sessão',`<form id="f-pr" class="form"><p class="hint" style="margin:0">${esc(pname(p))}. Deixe em branco para usar o valor padrão (${brl(S.prefs.fin.price)}).</p><div class="field"><label for="pr-v">Valor por sessão (R$)</label><input id="pr-v" type="number" min="0" step="0.01" value="${cur??''}"></div><div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`);
  $('#f-pr').onsubmit=e=>{e.preventDefault();const v=$('#pr-v').value;if(v==='')delete S.fin.prices[p.id];else S.fin.prices[p.id]=+v;save();closeModal();renderFinanceiro();toast('Valor atualizado')}};
ACT.finSettings=()=>{const f=S.prefs.fin;
  modal('Valores e prazos',`<form id="f-fs" class="form"><div class="row2"><div class="field">${info('fs-p','Valor padrão da sessão (R$)','Usado para pacientes sem valor próprio. Muda só as próximas cobranças.')}<input id="fs-p" type="number" min="0" step="0.01" value="${f.price}"></div>
  <div class="field">${info('fs-z','Prazo de pagamento (dias)','Dias entre a sessão e o vencimento. Zero significa pagamento no dia da sessão.')}<input id="fs-z" type="number" min="0" max="60" value="${f.prazo}"></div></div>
  <div class="field">${info('fs-c','Cidade do recibo','Aparece na linha de local e data do recibo.')}<input id="fs-c" value="${esc(f.cidade)}" placeholder="Cidade"></div>
  <label class="check"><input type="checkbox" id="fs-a" ${f.ausencia?'checked':''}> Gerar cobrança para ausências sem aviso</label>
  <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`);
  $('#f-fs').onsubmit=e=>{e.preventDefault();Object.assign(f,{price:Math.max(0,+$('#fs-p').value||0),prazo:Math.max(0,+$('#fs-z').value||0),cidade:$('#fs-c').value.trim(),ausencia:$('#fs-a').checked});syncCharges();save();closeModal();route();toast('Valores e prazos salvos')}};
ACT.fReceipt=d=>{const c=fCh(d.id);const p=getP(c.pid);const pr=profile();const pf=S.prefs.fin;const dt=P(c.paidAt+'T00:00');const sd=P(c.date+'T00:00');
  const minor=age(p.nasc)<18&&p.resp;const nome=p.nome+(p.social?` (nome social: ${p.social})`:'');
  const ref=c.apptId?`sessão de psicoterapia realizada em ${fmtD(sd)}`:`${c.desc} (${fmtD(sd)})`;
  const txt=`RECIBO Nº ${String(c.receipt||0).padStart(4,'0')}                Valor: ${brl(c.amount)}\n\nRecebi de ${nome}${minor?`, por meio de seu responsável legal ${p.resp.split('·')[0].trim()}`:''}, a importância de ${brl(c.amount)} (${extenso(+c.amount)}), referente a ${ref}, paga via ${c.method}.\n\n${pf.cidade||'____________'}, ${dt.getDate()} de ${MES[dt.getMonth()]} de ${dt.getFullYear()}.\n\n\n______________________________\n${pr.name}\nPsicóloga · ${pr.crp||'CRP'}`;
  modal('Recibo',`<div class="receipt"><pre id="rc-txt">${esc(txt)}</pre></div><p class="hint">Para dedução no Imposto de Renda, o recibo precisa do CPF do paciente e da profissional. Esses campos entram junto com o servidor seguro.</p><div class="form-actions"><span class="sp"></span><button class="btn ghost" data-close>Fechar</button><button class="btn primary" data-act="copyRc">Copiar texto</button></div>`,true)};
ACT.copyRc=()=>{const el=$('#rc-txt');const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto selecionado. Use Ctrl+C para copiar.')};
  try{navigator.clipboard.writeText(el.textContent).then(()=>toast('Recibo copiado'),sel)}catch(e){sel()}};

const getPref=p=>p.split('.').reduce((o,k)=>o?.[k],S.prefs);
function setPref(p,v){const ks=p.split('.');let o=S.prefs;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks[ks.length-1]]=v}
function swRow(path,label,desc,dis){return `<label class="sw-row ${dis?'is-dis':''}"><span class="sw-txt"><b>${label}</b>${desc?`<small>${desc}</small>`:''}</span><input type="checkbox" class="switch" data-pref="${path}" ${getPref(path)!==false?'checked':''} ${dis?'disabled':''} aria-label="${label}"></label>`}
function renderPersonalizar(){
  if(!canAdmin()){$('#view').innerHTML=`<div class="view-in"><div class="locked"><span class="eyebrow">Acesso restrito</span><h2>Personalizar</h2><p class="muted" style="margin:0">As preferências do consultório são definidas pela psicóloga responsável.</p></div></div>`;return}
  const a=S.prefs.agenda,f=S.prefs.fin,pr=profile();const noAg=!on('agenda'),noFin=!on('financeiro');

ACT.tour=()=>{closeModal();closeMenus();tour={list:TOUR.map((s,i)=>i).filter(i=>tourOk(TOUR[i])),pos:-1,el:null};$('#tour').hidden=false;$('.tour-card').innerHTML='';tourGo(0)};
function tourGo(pos){if(!tour)return;if(pos<0)pos=0;if(pos>=tour.list.length){tourEnd(true);return}tour.pos=pos;const s=TOUR[tour.list[pos]];
  if(s.pre)s.pre();if(current!==s.r||s.pre)go(s.r);
  setTimeout(()=>{if(!tour)return;const el=document.querySelector(s.sel);
    if(!el||!el.getClientRects().length){tour.list.splice(pos,1);tourGo(pos);return}
    tour.el=el;el.scrollIntoView({block:'center'});const n=tour.list.length,last=pos===n-1;
    $('.tour-card').innerHTML=`<div class="tour-step">Passo ${pos+1} de ${n}</div><h3 id="tour-t">${s.t}</h3><p>${s.x}</p><div class="tour-bar"><span style="width:${(pos+1)/n*100}%"></span></div><div class="tour-actions"><button class="btn sm ghost" data-act="tourEnd">Sair</button><span class="sp"></span>${pos?'<button class="btn sm" data-act="tourPrev">Voltar</button>':''}<button class="btn sm primary" data-act="tourNext">${last?'Concluir':'Próximo'}</button></div>`;
    requestAnimationFrame(()=>{tourPlace();const b=$('.tour-card [data-act=tourNext]');b&&b.focus({preventScroll:true})})},150)}
function tourPlace(){if(!tour||!tour.el||!tour.el.isConnected)return;const r=tour.el.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,pd=6;
  const top=Math.max(6,r.top-pd),left=Math.max(6,r.left-pd),w=Math.min(r.width+pd*2,vw-12),h=Math.min(r.height+pd*2,vh-12);
  Object.assign($('.tour-hole').style,{top:top+'px',left:left+'px',width:w+'px',height:h+'px'});
  const card=$('.tour-card'),cw=card.offsetWidth,ch=card.offsetHeight;let ct,cl;
  if(vw<640){cl=(vw-cw)/2;ct=(top+h/2>vh/2)?16:vh-ch-16}
  else if(top+h+14+ch<vh-8){ct=top+h+14;cl=Math.min(Math.max(16,left),vw-cw-16)}
  else if(top-14-ch>8){ct=top-14-ch;cl=Math.min(Math.max(16,left),vw-cw-16)}
  else if(left+w+16+cw<vw-8){cl=left+w+16;ct=Math.min(Math.max(16,top),vh-ch-16)}
  else if(left-16-cw>8){cl=left-16-cw;ct=Math.min(Math.max(16,top),vh-ch-16)}
  else{cl=(vw-cw)/2;ct=vh-ch-16}
  Object.assign(card.style,{top:ct+'px',left:cl+'px'})}
ACT.tourNext=()=>tourGo(tour.pos+1);ACT.tourPrev=()=>tourGo(tour.pos-1);ACT.tourEnd=()=>tourEnd(false);

    else if(b.table){const n=b.table.head.length;const ws=b.table.w||Array(n).fill(1);const tot=ws.reduce((a,c)=>a+c,0);const cw=ws.map(x=>x/tot*CW);
      const row=(cells,hd)=>{pdf.setFont('helvetica',hd?'bold':'normal');pdf.setFontSize(8.8);const wr=cells.map((c,i)=>pdf.splitTextToSize(String(c??''),cw[i]-3));const h=Math.max(1,...wr.map(w=>w.length))*3.9+2.6;need(h+1);if(hd){pdf.setFillColor(242,239,228);pdf.rect(M,y-3.8,CW,h,'F')}pdf.setTextColor(...(hd?OL:INK));let x=M;wr.forEach((w,i)=>{pdf.text(w,x+1.5,y);x+=cw[i]});y+=h;pdf.setDrawColor(225,222,210);pdf.setLineWidth(.15);pdf.line(M,y-3.8,W-M,y-3.8)};
      row(b.table.head,true);if(!b.table.rows.length)row(['Nenhum registro.',...Array(n-1).fill('')]);b.table.rows.forEach(r=>row(r));y+=3}
    else if(b.sign){need(34);y+=16;pdf.setDrawColor(...INK);pdf.setLineWidth(.3);pdf.line(W/2-35,y,W/2+35,y);y+=5;pdf.setFont('times','bold');pdf.setFontSize(11);pdf.setTextColor(...INK);pdf.text(pr.name||'',W/2,y,{align:'center'});y+=4.5;pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(...GR);pdf.text(`Psicóloga · ${pr.crp||''}`,W/2,y,{align:'center'});y+=6}}
  const pages=pdf.getNumberOfPages();const today=fmtD(new Date());
  for(let i=1;i<=pages;i++){pdf.setPage(i);pdf.setDrawColor(...GD);pdf.setLineWidth(.3);pdf.line(M,280,W-M,280);pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(...GR);pdf.text(`${pr.name||''} · ${pr.crp||''}`,M,285);pdf.text(`Emitido em ${today}`,W/2,285,{align:'center'});pdf.text(`Página ${i} de ${pages}`,W-M,285,{align:'right'});if(d.conf)pdf.text('Documento sigiloso. Uso restrito à finalidade a que se destina.',W/2,289.5,{align:'center'})}
  return pdf}

async function xlsx(name,sheets){try{await loadLib('xlsx')}catch(e){toast('Não foi possível carregar o gerador de Excel. Verifique a conexão com a internet.');return}
  const X=window.XLSX;const wb=X.utils.book_new();
  for(const [sn,rows] of sheets){const data=rows.length?rows:[{'Sem dados':'Nenhum registro no período'}];const ws=X.utils.json_to_sheet(data);const keys=Object.keys(data[0]);ws['!cols']=keys.map(k=>({wch:Math.min(60,Math.max(k.length,...data.map(r=>String(r[k]??'').length))+2)}));X.utils.book_append_sheet(wb,ws,sn.slice(0,31))}
  if(isNative()){await saveFile(name,new Blob([X.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));return}
  try{X.writeFile(wb,name);toast(`Planilha gerada: ${name}`)}catch(e){toast('O navegador bloqueou o download. Use o arquivo HTML salvo no computador.')}}
const dm=x=>x&&x.demo?'Sim':'';
const per=()=>`${rp.from}_a_${rp.to}`;
const pnm=id=>pname(getP(id));
function finTables(){const f=finRange();const months={};const addM=(k,field,v)=>{const m=k.slice(0,7);months[m]=months[m]||{'Mês':`${m.slice(5,7)}/${m.slice(0,4)}`,'Faturado (R$)':0,'Recebido (R$)':0,'Despesas (R$)':0};months[m][field]+=+v};
  S.fin.charges.filter(c=>c.status!=='isento'&&inR(c.date)).forEach(c=>addM(c.date,'Faturado (R$)',c.amount));f.paid.forEach(c=>addM(c.paidAt,'Recebido (R$)',c.amount));f.exp.forEach(e=>addM(e.date,'Despesas (R$)',e.amount));
  const mon=Object.keys(months).sort().map(k=>({...months[k],'Resultado (R$)':months[k]['Recebido (R$)']-months[k]['Despesas (R$)']}));
  const years={};mon.forEach(m=>{const y=m['Mês'].slice(3);const Y=years[y]=years[y]||{'Ano':y,'Faturado (R$)':0,'Recebido (R$)':0,'Despesas (R$)':0,'Resultado (R$)':0};['Faturado (R$)','Recebido (R$)','Despesas (R$)','Resultado (R$)'].forEach(k=>Y[k]+=m[k])});
  const byP={};S.fin.charges.filter(c=>inR(c.date)||inR(c.paidAt)).forEach(c=>{const r=byP[c.pid]=byP[c.pid]||{'Paciente':pnm(c.pid),'Sessões cobradas':0,'Recebido (R$)':0,'Em aberto (R$)':0,'Demonstração':dm(getP(c.pid))};if(inR(c.date)&&c.status!=='isento')r['Sessões cobradas']++;if(c.status==='pago'&&inR(c.paidAt))r['Recebido (R$)']+=+c.amount;if(c.status==='pendente')r['Em aberto (R$)']+=+c.amount});
  return{f,mon,years:Object.values(years),byP:Object.values(byP)}}

const dataAttrs=o=>Object.entries(o||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ');
function occDetail(mk){const[y,m]=mk.split('-').map(Number);const a=S.prefs.agenda;const dim=new Date(y,m,0).getDate();let avail=0;
  for(let d=1;d<=dim;d++){const dt=new Date(y,m-1,d);if(!a.days.includes(dt.getDay()))continue;avail+=(a.end-a.start)*60;const k=dkey(dt);S.blocks.filter(b=>b.start.slice(0,10)===k).forEach(b=>avail-=b.dur)}

function drillData(k,mk){

  const F=S.fin;
  switch(k){
    case'hoje':return{t:'Consultas de hoje',items:S.appts.filter(a=>a.start.slice(0,10)===tk&&a.status!=='cancelado').sort(byStart).map(ap),more:on('agenda')?{label:'Abrir a agenda do dia',act:'goAgendaDay'}:null};
    case'realizado':case'cancelado':case'ausencia':return{t:{realizado:'Realizadas',cancelado:'Cancelamentos',ausencia:'Ausências'}[k]+` · ${mesNome}`,items:mon.filter(a=>a.status===k).sort(byStart).reverse().map(ap),more:on('agenda')?{label:'Abrir a agenda do mês',act:'goAgendaMonth'}:null};
    case'ativos':return{t:'Pacientes ativos',items:S.patients.filter(p=>p.sit==='ativo').sort((a,b)=>pname(a).localeCompare(pname(b))).map(p=>({label:pname(p),sub:`${age(p.nasc)} anos · desde ${fmtD(new Date(p.created))}`,right:p.demo?'Demo':'',act:'openPatient',data:{pid:p.id}})),more:{label:'Abrir pacientes',act:'toPatients'}};
    case'espera':return{t:'Lista de espera',items:S.waitlist.map(w=>({label:w.nome,sub:`${w.tel||'sem telefone'} · ${w.pref||'sem preferência'}`,act:'waitlist'})),more:{label:'Gerenciar a lista de espera',act:'waitlist'}};
    case'recebido':return{t:`Recebido · ${mesNome}`,items:F.charges.filter(c=>c.status==='pago'&&(c.paidAt||'').slice(0,7)===mk).sort((a,b)=>b.paidAt.localeCompare(a.paidAt)).map(ch),more:{label:'Abrir o financeiro',act:'goFin'}};
    case'atraso':return{t:'Cobranças em atraso',items:F.charges.filter(isLate).sort((a,b)=>a.due.localeCompare(b.due)).map(ch),more:{label:'Abrir o financeiro',act:'goFin'}};
    case'areceber':return{t:'A receber no prazo',items:F.charges.filter(c=>c.status==='pendente'&&!isLate(c)).sort((a,b)=>a.due.localeCompare(b.due)).map(ch),more:{label:'Abrir o financeiro',act:'goFin'}};
    case'despesas':return{t:`Despesas · ${mesNome}`,items:F.expenses.filter(e=>e.date.slice(0,7)===mk).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>({label:e.desc,sub:`${fmtShort(e.date)} · ${e.cat}`,right:brl(e.amount),act:'goFin'})),more:{label:'Lançar despesa',act:'fExp'}};
    case'resultado':{const f=finMonth(mk);return{t:`Resultado · ${mesNome}`,items:[{label:'Recebido',right:brl(f.recebido)},{label:'Despesas',right:'− '+brl(f.despesas)},{label:'Resultado',sub:'Recebido menos despesas',right:brl(f.resultado)}],more:null}}
    case'ocupacao':{const o=occDetail(mk);return{t:`Ocupação da agenda · ${mesNome}`,items:[{label:'Horas agendadas',sub:'Consultas não canceladas',right:hrs(o.used)},{label:'Horas disponíveis',sub:'Expediente menos bloqueios',right:hrs(Math.max(0,o.avail))},{label:'Ocupação',right:(o.avail>0?Math.round(o.used/o.avail*100):0)+'%'}],more:on('agenda')?{label:'Ajustar o expediente',act:'agSettings'}:null}}
  }return{t:'',items:[]}}
ACT.drill=(d,b)=>{const pop=$('#drill');const open=!pop.hidden&&pop.dataset.k===d.k&&pop.dataset.m===(d.m||'');closeMenus();if(open)return;

  pop.hidden=false;b.setAttribute('aria-expanded','true');const r=b.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  pop.style.left=Math.max(12,Math.min(r.left,innerWidth-pw-12))+'px';pop.style.top=(r.bottom+6+ph>innerHeight-8&&r.top-6-ph>8?r.top-6-ph:Math.max(8,Math.min(r.bottom+6,innerHeight-ph-8)))+'px';

const REC={mr:null,chunks:[],streams:[],ctx:null,start:0,last:null,files:{},mode:'audio',stopP:null,name:''};
const TR={rec:null,on:false,t:0};
const mb=b=>`${(b/1048576).toFixed(1).replace('.',',')} MB`;
function recPanelHtml(){const L=S.teleLive;const ok=!!L.consent;const recOn=!!(REC.mr&&REC.mr.state==='recording');const trOn=TR.on;
  return `<div class="recbox"><div class="panel-head"><h3>Gravação e transcrição</h3><span class="sp"></span>${recOn?`<span class="rec-dot">● Gravando <span class="mono" id="rc-clock">00:00</span></span>`:''}${trOn?'<span class="pill st-confirmado">Transcrevendo</span>':''}</div>
  <div class="transport"><button class="btn sm" data-act="consentReq" ${RTC.conn&&RTC.conn.open?'':'disabled'}>Pedir autorização ao paciente pela sala</button>${L.consentBy?`<span class="pill ${ok?'finalizado':'rascunho'}">${ok?'Autorizado':'Não autorizado'} ${esc(L.consentBy)}</span>`:''}</div>
  <label class="check"><input type="checkbox" id="tl-consent" ${ok?'checked':''} ${recOn||trOn?'disabled':''}> O paciente autorizou a gravação e a transcrição desta sessão</label>
  <div class="row2"><div class="field">${info('tl-rmode','O que gravar','Somente áudio gera arquivos bem menores. Áudio e vídeo grava também a imagem da aba da sala de vídeo.')}<select id="tl-rmode" ${recOn?'disabled':''}><option value="audio">Somente áudio</option><option value="video" ${REC.mode==='video'?'selected':''}>Áudio e vídeo da sala</option></select></div></div>
  <div class="transport">${recOn?'<button class="btn danger solid" data-act="recStop">■ Parar gravação</button>':`<button class="btn" data-act="recStart" ${ok?'':'disabled'}>● Gravar sessão</button>`}${trOn?'<button class="btn" data-act="trStop">Parar transcrição</button>':`<button class="btn" data-act="trStart" ${ok?'':'disabled'}>Iniciar transcrição</button>`}${REC.last?`<a class="btn primary" href="${REC.last.url}" download="${esc(REC.last.name)}">Baixar gravação (${mb(REC.last.size)})</a>`:''}</div>
  <div class="field">${info('tl-trans','Transcrição','Texto reconhecido pelo microfone, com o tempo da sessão. Corrija o que precisar antes de exportar. A transcrição automática capta melhor quem fala perto do microfone; com fones de ouvido, evita-se eco.')}<textarea id="tl-trans" rows="6" placeholder="${ok?'Clique em Iniciar transcrição':'Marque a autorização do paciente para habilitar'}">${esc(L.transcript||'')}</textarea><span class="hint" id="tl-interim"></span></div>
  <div class="form-actions"><button class="btn sm" data-act="trTxt">Exportar transcrição (.txt)</button><button class="btn sm" data-act="trPdf">Transcrição em PDF</button></div>
  <p class="hint" style="margin:0">Com o paciente na sala, a gravação junta a sua voz e a dele (e o vídeo dele, se escolher Áudio e vídeo), sem precisar compartilhar tela. Na transcrição, as falas aparecem como Psicóloga e Paciente; a do paciente é feita no aparelho dele, depois da autorização. A gravação fica só no seu computador. A transcrição automática usa o serviço de voz do navegador (Chrome ou Edge), que processa o áudio fora do sistema. Grave apenas com autorização registrada e guarde os arquivos em local protegido. No link do Claude, gravação e downloads ficam bloqueados; use o arquivo HTML.</p></div>`}
function bindRecPanel(){const c=$('#tl-consent');if(c)c.onchange=()=>{S.teleLive.consent=c.checked;const a=S.appts.find(x=>x.id===S.teleLive.apptId);audit(c.checked?'Autorização do paciente para gravação e transcrição registrada':'Autorização de gravação e transcrição desmarcada',a&&a.pid);save();renderTele()};
  const m=$('#tl-rmode');if(m)m.onchange=()=>{REC.mode=m.value};
  const t=$('#tl-trans');if(t)t.oninput=()=>{S.teleLive.transcript=t.value;clearTimeout(TR.t);TR.t=setTimeout(save,500)}}
ACT.recStart=async()=>{const L=S.teleLive;if(!L||!L.consent){toast('Registre a autorização do paciente antes de gravar');return}
  if(RTC.remote&&window.MediaRecorder){return recStartRtc()}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.MediaRecorder){toast('Este navegador não permite gravar aqui. Use Chrome ou Edge no computador.');return}
  let disp=null,mic=null;
  try{disp=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true})}catch(e){toast('Gravação não iniciada. Escolha a aba da sala de vídeo e marque “Compartilhar áudio da aba”.');return}
  try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){}
  const ctx=new(window.AudioContext||window.webkitAudioContext)();const dest=ctx.createMediaStreamDestination();
  const tabA=disp.getAudioTracks();if(tabA.length)ctx.createMediaStreamSource(new MediaStream(tabA)).connect(dest);if(mic)ctx.createMediaStreamSource(mic).connect(dest);
  if(!tabA.length&&!mic){disp.getTracks().forEach(t=>t.stop());ctx.close();toast('Nenhum áudio disponível para gravar.');return}
  const video=REC.mode==='video';const tracks=[...dest.stream.getAudioTracks(),...(video?disp.getVideoTracks():[])];
  const types=video?['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']:['audio/webm;codecs=opus','audio/webm','audio/mp4'];
  const mime=types.find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}})||'';
  let mr;try{mr=new MediaRecorder(new MediaStream(tracks),mime?{mimeType:mime}:undefined)}catch(e){disp.getTracks().forEach(t=>t.stop());mic&&mic.getTracks().forEach(t=>t.stop());ctx.close();toast('Não foi possível iniciar a gravação neste navegador.');return}
  const a=S.appts.find(x=>x.id===L.apptId);const p=getP(a&&a.pid);const ext=mime.includes('mp4')?(video?'mp4':'m4a'):'webm';const n=new Date();
  REC.name=`teleconsulta_${slug(pname(p))}_${dkey(n)}_${pad(n.getHours())}h${pad(n.getMinutes())}.${ext}`;
  REC.chunks=[];REC.streams=[disp,mic].filter(Boolean);REC.ctx=ctx;REC.mr=mr;REC.start=Date.now();REC.last=null;
  REC.stopP=new Promise(res=>{mr.onstop=()=>{const blob=new Blob(REC.chunks,{type:mr.mimeType||mime||(video?'video/webm':'audio/webm')});REC.last={url:URL.createObjectURL(blob),size:blob.size,name:REC.name};res()}});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};mr.start(1000);
  disp.getVideoTracks().forEach(t=>t.onended=()=>{if(REC.mr&&REC.mr.state==='recording')recStop().then(()=>{renderTele();toast('Compartilhamento encerrado. Gravação concluída.')})});
  if(!tabA.length)toast('Sem áudio da aba: somente o microfone será gravado.');
  L.recorded=true;audit('Gravação de teleconsulta iniciada (autorização registrada)',a&&a.pid);save();renderTele()};
async function recStop(){const mr=REC.mr;if(!mr)return;if(mr.state!=='inactive')mr.stop();await REC.stopP;REC.streams.forEach(s=>s.getTracks().forEach(t=>t.stop()));try{REC.ctx&&REC.ctx.close()}catch(e){}REC.mr=null;REC.streams=[]}
ACT.recStop=async()=>{await recStop();renderTele();toast('Gravação concluída. Use Baixar gravação para salvar no computador.')};
ACT.trStart=()=>{const L=S.teleLive;if(!L||!L.consent){toast('Registre a autorização do paciente antes de transcrever');return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('A transcrição automática funciona no Chrome e no Edge.');return}
  const r=new SR();r.lang='pt-BR';r.continuous=true;r.interimResults=true;
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)trAppend(res[0].transcript.trim(),'Psicóloga');else interim+=res[0].transcript}const el=$('#tl-interim');if(el)el.textContent=interim};
  r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){TR.on=false;toast('Não foi possível usar o microfone para a transcrição.');renderTele()}};
  r.onend=()=>{if(TR.on){try{r.start()}catch(e){}}};
  TR.rec=r;TR.on=true;try{r.start()}catch(e){}if(RTC.conn&&RTC.conn.open)send({type:'tr-start'});const a=S.appts.find(x=>x.id===L.apptId);audit('Transcrição de teleconsulta iniciada (autorização registrada)',a&&a.pid);renderTele()};
function trAppend(t,who){if(!t||!S.teleLive)return;const line=`[${fmtDur(Date.now()-S.teleLive.start)}] ${who?who+': ':''}${t}`;const ta=$('#tl-trans');const cur=ta?ta.value:(S.teleLive.transcript||'');
  S.teleLive.transcript=(cur.trim()?cur.replace(/\s+$/,'')+'\n':'')+line;if(ta){ta.value=S.teleLive.transcript;ta.scrollTop=ta.scrollHeight}clearTimeout(TR.t);TR.t=setTimeout(save,500)}

const PJ_KEY='emdrpro.msg';const pjSeen=new Set();let pjChan=null;
try{pjChan=new BroadcastChannel('emdrpro-estimulo')}catch(e){pjChan=null}
const STIM_T=new Set(['start','pause','resume','stop','cfg','ping','present']);
function send(m){m.id=m.id||uid();m.ts=Date.now();const stim=STIM_T.has(m.type);if(!PATIENT&&stim)mirApply(m);
  try{if(RTC.conn&&RTC.conn.open&&!(stim&&!PATIENT&&MEET.present==='janela'))RTC.conn.send(m)}catch(e){}if(PATIENT)return;try{pjChan&&pjChan.postMessage(m)}catch(e){}try{localStorage.setItem(PJ_KEY,JSON.stringify(m))}catch(e){}}
function onPjMsg(m){if(!m||!m.id||pjSeen.has(m.id))return;pjSeen.add(m.id);if(pjSeen.size>500)pjSeen.clear();
  if(current==='estimulo'){
    if(m.type==='start'){PJ.test=!!m.test;pjStart(m.cfg)}
    else if(m.type==='present'){if(PATIENT){document.body.classList.toggle('pj-present',!!m.on);if(m.cfg)PJ.cfg={...PJ.cfg,...m.cfg};document.body.classList.toggle('hide-psi',PJ.cfg.showPsi===false);if(!m.on&&PJ.running)pjFinish('apresentação encerrada');pjUi()}}else if(m.type==='pause'){if(PJ.running){PJ.paused=true;pjUi();pjStatus()}}else if(m.type==='resume'){if(PJ.running){PJ.paused=false;pjUi();pjStatus()}}
    else if(m.type==='stop'){if(PJ.running)pjFinish(m.reason||'interrompido')}else if(m.type==='cfg'){PJ.cfg={...PJ.cfg,...m.cfg};if(PATIENT)document.body.classList.toggle('hide-psi',PJ.cfg.showPsi===false)}else if(m.type==='ping')pjStatus();
    else if(m.type==='bye'){if(PJ.running)pjFinish('interrompido');PJ.bye=true;pjUi();if(PATIENT)ptBye()}
    if(PATIENT)ptMsg(m);
  }else{
    if(m.type==='consent'&&S.teleLive){S.teleLive.consent=!!m.value;S.teleLive.consentBy='paciente, pelo link';const a=S.appts.find(x=>x.id===S.teleLive.apptId);audit(m.value?'Paciente autorizou gravação e transcrição pelo link da sala':'Paciente não autorizou gravação e transcrição',a&&a.pid);save();toast(m.value?'O paciente autorizou a gravação e a transcrição':'O paciente não autorizou a gravação e a transcrição');renderTele();if(m.value&&MEET.open&&!(REC.mr||TR.on))ACT.recAsk()}
    else if(m.type==='tr'&&S.teleLive&&m.text){trAppend(String(m.text).slice(0,2000),'Paciente')}
    else if(m.type==='pong2'&&m.t){RTC.rtt=Math.max(1,Date.now()-m.t);pjCtrlUi()}
    else if(m.type==='pausereq'){toast('O paciente pediu uma pausa. A estimulação foi pausada.');const a=S.teleLive&&S.appts.find(x=>x.id===S.teleLive.apptId);audit('Paciente pediu pausa na estimulação',a&&a.pid)}
    else if(m.type==='feedback'&&S.teleLive){const L=S.teleLive;const last=(L.sets||[]).filter(x=>x.test).pop();if(last){last.feedback=m.v;save();pjSetsUi()}toast(`Teste de tolerância: ${m.v}`)}
    if(m.type==='status'){PJC.st=m;PJC.ts=Date.now();mirSync(m);pjCtrlUi();qbarUi()}
    else if((m.type==='hello'||m.type==='dims')&&m.w){RTC.pdims={w:m.w,h:m.h};if(m.type==='hello')hostHello(m)}
    else if(m.type==='ping2'){}
    else if(m.type==='hello'){PJC.ts=Date.now();send({type:'cfg',cfg:S.cfg});pjCtrlUi()}
    else if(m.type==='set'&&S.teleLive){S.teleLive.sets=S.teleLive.sets||[];S.teleLive.sets.push(m.set);save();pjSetsUi();toast(`Set ${m.set.reason}: ${m.set.passes} passagens`)}
  }}
if(pjChan)pjChan.onmessage=e=>{if(!PATIENT)onPjMsg(e.data)};
window.addEventListener('storage',e=>{if(!PATIENT&&e.key===PJ_KEY&&e.newValue){try{onPjMsg(JSON.parse(e.newValue))}catch(x){}}});

const PJ={running:false,paused:false,phase:0,passes:0,setMs:0,last:0,raf:0,cv:null,g:null,dpr:1,ending:false,cfg:null,stT:0,el:null,hudT:0,bye:false,keyH:null,rsH:null};
function renderProj(){projTeardown();const el=document.createElement('div');el.id='proj';el.className='proj';
  el.innerHTML=`<canvas aria-hidden="true"></canvas><div class="pj-wait" id="pj-wait">Aguarde o início da estimulação</div><div class="pj-hud"><button data-act="pjLocalToggle" id="pj-lt">Iniciar</button><button data-act="pjLocalStop">Interromper</button><button data-act="pjFs">Tela cheia</button><button data-act="pjClose">Fechar</button></div>`;
  document.body.appendChild(el);document.title='Estimulação · ZOEVITA';PJ.el=el;PJ.cv=el.querySelector('canvas');PJ.g=PJ.cv.getContext('2d');PJ.cfg={...S.cfg};PJ.bye=false;
  const fit=()=>{PJ.dpr=Math.min(window.devicePixelRatio||1,2);PJ.cv.width=Math.round(innerWidth*PJ.dpr);PJ.cv.height=Math.round(innerHeight*PJ.dpr)};fit();PJ.rsH=fit;window.addEventListener('resize',fit);
  el.addEventListener('pointermove',()=>{el.classList.add('hud-on');clearTimeout(PJ.hudT);PJ.hudT=setTimeout(()=>el.classList.remove('hud-on'),2000)});
  PJ.keyH=e=>{if(current!=='estimulo')return;if(e.code==='Space'){e.preventDefault();ACT.pjLocalToggle()}else if(e.key==='Escape'&&PJ.running)pjFinish('interrompido')};document.addEventListener('keydown',PJ.keyH);
  PJ.last=0;PJ.raf=requestAnimationFrame(pjFrame);PJ.stT=setInterval(pjStatus,300);pjUi();send({type:'hello'})}
function projTeardown(){if(!PJ.el)return;if(PJ.running)pjFinish('interrompido');cancelAnimationFrame(PJ.raf);clearInterval(PJ.stT);PJ.el.remove();PJ.el=null;PJ.cv=null;document.title='ZOEVITA';
  if(PJ.keyH)document.removeEventListener('keydown',PJ.keyH);if(PJ.rsH)window.removeEventListener('resize',PJ.rsH);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
function pjFrame(ts){const dt=PJ.last?Math.min(ts-PJ.last,100):0;PJ.last=ts;const c=PJ.cfg;
  if(PJ.running&&!PJ.paused){const prev=PJ.phase;PJ.phase+=dt/(60000/c.ppm);PJ.setMs+=dt;const n=Math.floor(PJ.phase)-Math.floor(prev);for(let i=0;i<n;i++){PJ.passes++;if(PATIENT)ptBeep(PJ.passes%2?1:-1)}
    if(c.mode==='tempo'&&PJ.setMs>=c.secs*1000)PJ.ending=true;if((c.mode==='passagens'&&PJ.passes>=c.limit)||(PJ.ending&&n>0)){PJ.phase=PJ.passes;pjFinish('concluído')}}
  const cv=PJ.cv;if(!cv)return;if(!PJ.g){PJ.raf=requestAnimationFrame(pjFrame);return}const g=PJ.g,W=cv.width,H=cv.height,d=PJ.dpr;g.fillStyle=c.bg;g.fillRect(0,0,W,H);
  {const p=PJ.phase;const pos=(!PJ.running&&!PJ.passes)?0:c.motion==='linear'?(f=>f<1?-1+2*f:3-2*f)(((p%2)+2)%2):-Math.cos(Math.PI*p);const r=c.size/2*d;const span=Math.max(0,(W/2-r-14*d))*(c.amp/100);
    drawDot(g,c,W/2+pos*span,H/2,r)}
  if(PJ.el)PJ.raf=requestAnimationFrame(pjFrame)}
function pjStart(cfg){if(cfg)PJ.cfg={...PJ.cfg,...cfg};PJ.patientPause=false;if(PATIENT){document.body.classList.add('pj-running','pj-present');document.body.classList.toggle('hide-psi',PJ.cfg.showPsi===false)}PJ.running=true;PJ.paused=false;PJ.phase=0;PJ.passes=0;PJ.setMs=0;PJ.ending=false;PJ.bye=false;pjUi();pjStatus()}
function pjFinish(reason){if(PATIENT)document.body.classList.remove('pj-running');const set={ts:Date.now(),durMs:Math.round(PJ.setMs),passes:PJ.passes,ppm:PJ.cfg.ppm,motion:PJ.cfg.motion,reason,remote:true,test:!!PJ.test};const wasTest=PJ.test&&reason==='concluído';PJ.test=false;if(PATIENT&&wasTest)setTimeout(ptFeedback,200);PJ.running=false;PJ.paused=false;if(set.passes||set.durMs>500)send({type:'set',set});pjUi();pjStatus()}
function pjStatus(){if(current!=='estimulo')return;send({type:'status',running:PJ.running,paused:PJ.paused,patientPause:!!PJ.patientPause,passes:PJ.passes,setMs:Math.round(PJ.setMs)})}
function pjUi(){const w=$('#pj-wait');if(w){const bg=(PJ.cfg&&PJ.cfg.bg||'#000').replace('#','');const lum=bg.length>=6?(parseInt(bg.slice(0,2),16)*299+parseInt(bg.slice(2,4),16)*587+parseInt(bg.slice(4,6),16)*114)/1000:0;
    w.style.color=lum>140?'rgba(0,0,0,.45)':'rgba(255,255,255,.55)';w.hidden=PJ.running;w.textContent=PJ.bye?'Sessão encerrada':PJ.passes?'Pausa entre séries':'Acompanhe o ponto com os olhos. Vai começar em instantes.'}
  const t=$('#pj-lt');if(t)t.textContent=!PJ.running?'Iniciar':PJ.paused?'Retomar':'Pausar'}
ACT.pjLocalToggle=()=>{if(!PJ.running)pjStart();else{PJ.paused=!PJ.paused;pjUi();pjStatus()}};

function isNative(){try{return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}catch(e){return false}}
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(b)});
async function saveFile(name,blob){
  if(!isNative()){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.dataset.native='0';document.body.appendChild(a);a.click();a.remove();return}
  try{const P=window.Capacitor.Plugins;const data=await blobB64(blob);
    const w=await P.Filesystem.writeFile({path:name,data,directory:'CACHE'});
    await P.Share.share({title:name,files:[w.uri],dialogTitle:'Salvar ou enviar'});}
  catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('Não foi possível salvar o arquivo.')}}
/* No app, todo link de download vira "Salvar ou enviar" (Arquivos, Drive, AirDrop, WhatsApp, Imprimir). */
document.addEventListener('click',e=>{if(!isNative())return;const a=e.target.closest&&e.target.closest('a[download]');if(!a||a.dataset.native==='0')return;e.preventDefault();e.stopImmediatePropagation();
  fetch(a.href).then(r=>r.blob()).then(b=>saveFile(a.getAttribute('download')||'arquivo',b)).catch(()=>toast('Não foi possível salvar o arquivo.'))},true);

  try{const SB=window.Capacitor.Plugins.StatusBar;SB&&SB.setStyle&&SB.setStyle({style:'DARK'})}catch(e){}}

/* O que vai acontecer nos próximos 14 dias (sem nomes para o servidor) */
function ntfPlan(withNames){const x=NTF.get(),now=Date.now(),lim=now+14*86400e3,rem=[],rooms=[];
  const list=(S&&S.appts||[]).filter(a=>a.status!=='cancelado');
  list.forEach(a=>{const d=P(a.start),st=d.getTime();
    if(a.mod==='online'&&a.room&&st+a.dur*60e3+3*3600e3>now&&st<now+30*86400e3)rooms.push({r:String(a.room).toLowerCase().replace(/[^a-z0-9]/g,''),exp:st+a.dur*60e3+3*3600e3,t:fmtT(d)});
    if(!x.lembrete||st<=now||st>lim)return;const at=st-x.antes*60e3;if(at<now-20*60e3)return;
    const who=withNames&&(a.pid?pname(getP(a.pid)):a.guest);
    rem.push({id:`l-${a.id}-${a.start}-${x.antes}`,at,kind:'lembrete',title:`Sessão às ${fmtT(d)} · em ${x.antes} min`,
      body:(who?who+' · ':'')+(a.mod==='online'?'Teleconsulta. Toque para abrir a sala.':'Atendimento presencial.'),url:a.mod==='online'?'./#teleconsulta':'./#agenda'})});
  if(x.resumo){const[hh,mm]=(x.resumoHora||'07:00').split(':').map(Number);const days={};
    list.forEach(a=>{const d=P(a.start);if(d.getTime()<now||d.getTime()>lim)return;(days[dkey(d)]=days[dkey(d)]||[]).push(a)});
    Object.entries(days).forEach(([k,arr])=>{const d=P(k+'T00:00');d.setHours(hh||0,mm||0,0,0);arr.sort(byStart);
      if(d.getTime()<now-20*60e3)return;const on2=arr.filter(a=>a.mod==='online').length;rem.push({id:`r-${k}-${x.resumoHora}-${arr.length}`,at:d.getTime(),kind:'resumo',title:'Sua agenda de hoje',
        body:`${arr.length} ${arr.length===1?'sessão':'sessões'}, a primeira às ${fmtT(P(arr[0].start))}${on2?` · ${on2} ${on2===1?'teleconsulta':'teleconsultas'}`:''}.`,url:'./#agenda'})})}
  rem.sort((a,b)=>a.at-b.at);return {rem:rem.slice(0,90),rooms:rooms.slice(0,80)}}

/* Inscrição no servidor (Web Push) */
async function ntfSub(create){const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub&&create){const r=await fetch(NTF_URL+'/key');if(!r.ok)throw new Error('servidor');const key=(await r.json()).key;if(!key)throw new Error('servidor');
    const raw=atob(key.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((key.length+3)%4));sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(raw,c=>c.charCodeAt(0))})}
  return sub}
async function ntfSync(create){const x=NTF.get();if(!x.on||!ntfWebOk()||ntfPerm()!=='granted')return false;
  try{const sub=await ntfSub(create);if(!sub)return false;const pl=ntfPlan(false);
    const r=await fetch(NTF_URL+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sub:sub.toJSON(),topics:{lembrete:x.lembrete,resumo:x.resumo,sala:x.sala,versao:x.versao},rem:pl.rem,rooms:pl.rooms})});
    if(!r.ok)throw new Error('servidor');const y=NTF.get();y.server='ok';y.syncedAt=Date.now();NTF.set(y);return true}
  catch(e){const y=NTF.get();y.server='off';NTF.set(y);return false}}
/* App nativo: agenda no próprio aparelho (aparece na tela bloqueada mesmo sem internet) */
const ntfNum=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1};
async function ntfNative(){const LN=ntfLN();if(!LN)return;const x=NTF.get();
  try{const p=await LN.getPending();if(p&&p.notifications&&p.notifications.length)await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))})}catch(e){}
  if(!x.on)return;const pl=ntfPlan(x.nomes).rem.filter(r=>r.at>Date.now()+5e3).slice(0,60);
  try{await LN.schedule({notifications:pl.map(r=>({id:ntfNum(r.id),title:r.title,body:r.body,schedule:{at:new Date(r.at),allowWhileIdle:true},extra:{url:r.url,id:r.id,kind:r.kind}}))})}catch(e){console.warn(e)}}

  S.sec={enabled:false,lockMin:s.lockMin};audit('Acesso recuperado com código de recuperação; PIN removido');save();unlock();toast('PIN removido. Crie um novo PIN agora.');go('privacidade');setTimeout(()=>ACT.pinSet(),200)};

function recCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(12));return [...r].map(x=>A[x%A.length]).join('').replace(/(.{4})(?=.)/g,'$1-')}
ACT.pinSet=()=>{if(!canAdmin()){toast('Somente a Psicóloga ou o Administrador configura o bloqueio');return}
  modal(secOn()?'Trocar PIN':'Criar PIN de bloqueio',`<form id="f-pin" class="form"><p class="hint" style="margin:0">O PIN bloqueia o aplicativo neste aparelho e passa a ser pedido para assumir o perfil Psicóloga. Use no mínimo 6 números e não repita sequências óbvias.</p>
   <div class="row2"><div class="field"><label for="pin-1">Novo PIN</label><input id="pin-1" type="password" inputmode="numeric" autocomplete="new-password" minlength="6" maxlength="12" required></div><div class="field"><label for="pin-2">Repita o PIN</label><input id="pin-2" type="password" inputmode="numeric" autocomplete="new-password" minlength="6" maxlength="12" required></div></div>
   <div class="field"><label for="pin-min">Bloquear após inatividade de</label><select id="pin-min">${[2,5,10,15,30].map(m=>`<option value="${m}" ${+S.sec.lockMin===m?'selected':''}>${m} minutos</option>`).join('')}</select></div>
   <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Salvar PIN</button></div></form>`);
  $('#f-pin').addEventListener('submit',async e=>{e.preventDefault();const a=$('#pin-1').value,b=$('#pin-2').value;
    if(!/^\d{6,12}$/.test(a)){toast('O PIN precisa ter de 6 a 12 números');return}if(a!==b){toast('Os PINs não conferem');return}
    if(/^(\d)\1+$/.test(a)||'0123456789012'.includes(a)||'9876543210987'.includes(a)){toast('PIN fraco: evite números repetidos ou em sequência');return}
    const iter=210000,salt=crypto.getRandomValues(new Uint8Array(16)),code=recCode();
    S.sec={enabled:true,lockMin:+$('#pin-min').value,iter,salt:b64e(salt),pin:await pinHash(a,salt,iter),rec:await pinHash(code.replace(/-/g,''),salt,iter),since:Date.now()};
    audit('PIN de bloqueio definido');save();LOCK.last=Date.now();
    modal('Guarde seu código de recuperação',`<p style="margin-top:0">Se esquecer o PIN, este código é a única forma de recuperar o acesso neste aparelho. Ele aparece só agora.</p><div class="zv-code">${code}</div><p class="hint">Anote em papel e guarde em local seguro. Não fotografe nem envie por mensagem.</p><div class="form-actions"><span class="sp"></span><button class="btn primary" data-close>Guardei o código</button></div>`);
    if(current==='privacidade')renderPrivacidade()})};

/* ---------- cópia de segurança protegida por senha ---------- */
async function bkKey(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
ACT.bkSave=()=>{if(!canClinical()){toast('Somente a psicóloga pode baixar a cópia completa');return}
  modal('Cópia de segurança protegida',`<form id="f-bk" class="form"><p class="hint" style="margin:0">A cópia contém prontuários. Ela será protegida por senha (criptografia AES-256). Sem a senha, ninguém consegue abrir o arquivo, nem você.</p>
   <div class="row2"><div class="field"><label for="bk-1">Senha da cópia</label><input id="bk-1" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="bk-2">Repita a senha</label><input id="bk-2" type="password" autocomplete="new-password" minlength="8" required></div></div>
   <p class="hint" style="margin:0">Mínimo de 8 caracteres. Use uma frase que só você saiba.</p>
   <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Baixar cópia protegida</button></div></form>`);
  $('#f-bk').addEventListener('submit',async e=>{e.preventDefault();const a=$('#bk-1').value;if(a.length<8){toast('Use ao menos 8 caracteres');return}if(a!==$('#bk-2').value){toast('As senhas não conferem');return}
    const n=new Date(),iter=310000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await bkKey(a,salt,iter),new TextEncoder().encode(JSON.stringify({app:'ZOEVITA',version:APP_VERSION,exported:n.toISOString(),data:S})));
    const env={app:'ZOEVITA',format:'zoevita-backup',v:1,enc:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter,salt:b64e(salt),iv:b64e(iv),exported:n.toISOString(),data:b64e(ct)};
    const name=`zoevita-copia_${dkey(n)}_${pad(n.getHours())}h${pad(n.getMinutes())}.zoevita`;
    try{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(env)],{type:'application/octet-stream'}));l.download=name;document.body.appendChild(l);l.click();l.remove();audit('Cópia de segurança protegida por senha baixada');save();closeModal();toast(`Cópia protegida gerada: ${name}`)}catch(x){toast('O navegador bloqueou o download.')}})};
function bkAccept(j){const d=j&&(j.app==='EMDR PRO'||j.app==='ZOEVITA')&&j.data;if(!d||!Array.isArray(d.patients)||!Array.isArray(d.appts)){toast('Arquivo inválido: não é uma cópia da ZOEVITA.');return}
  window.__bk=d;modal('Restaurar cópia',`<p style="margin-top:0">Restaurar a cópia de <b>${esc(fmtDT(j.exported))}</b>, com ${d.patients.length} pacientes e ${d.appts.length} agendamentos?</p><p class="hint">Todos os dados atuais deste aparelho serão substituídos pela cópia. Se tiver dúvida, baixe antes uma cópia dos dados atuais.</p><div class="form-actions"><span class="sp"></span><button class="btn ghost" data-close>Cancelar</button><button class="btn danger solid" data-act="bkRestoreOk">Substituir e restaurar</button></div>`)}
document.addEventListener('change',e=>{if(e.target.id!=='bk-file')return;const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(!canAdmin()){toast('Sem permissão para restaurar');return}
  const rd=new FileReader();rd.onload=()=>{let j;try{j=JSON.parse(rd.result)}catch(x){toast('Arquivo inválido: não é uma cópia da ZOEVITA.');return}
    if(j&&j.format==='zoevita-backup'){window.__bkEnc=j;modal('Cópia protegida',`<p style="margin-top:0">Digite a senha usada ao gerar esta cópia.</p><div class="field"><label for="bk-pw">Senha da cópia</label><input id="bk-pw" type="password" autocomplete="off"></div><div class="form-actions"><span class="sp"></span><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" data-act="bkDecrypt">Abrir cópia</button></div>`);return}
    bkAccept(j)};rd.readAsText(f)});
ACT.bkDecrypt=async()=>{const j=window.__bkEnc;if(!j)return;try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(j.iv)},await bkKey($('#bk-pw').value,b64d(j.salt),j.iter),b64d(j.data));window.__bkEnc=null;bkAccept(JSON.parse(new TextDecoder().decode(pt)))}
  catch(x){audit('Senha incorreta ao abrir cópia de segurança',null,true);toast('Senha incorreta ou arquivo danificado')}};

  if(!(REC.mr&&REC.mr.state==='recording'))await ACT.recStart();if(!TR.on)ACT.trStart();renderTele()};
ACT.recHalt=async()=>{if(REC.mr&&REC.mr.state!=='inactive')await recStop();if(TR.on)trStop();renderTele();if(REC.last){MEET.pane='gravar';renderTele()}toast(REC.last?'Gravação concluída. Baixe o arquivo em Gravar e transcrever.':'Transcrição pausada')};

/* Compartilhar o app: mensagem + ícone (WhatsApp e outros) */
const SHARE_TXT=`Oi! 🌿 Segue o link para instalar a *ZOEVITA*, a plataforma clínica da Dra. Karina Ximenes.

📱 *iPhone ou iPad* (Safari): https://app.zoevita.net.br
Toque em *Compartilhar* → *Adicionar à Tela de Início*.

🤖 *Android*: https://zoevita.net.br/android

💻 *Computador* (Chrome ou Edge): https://app.zoevita.net.br

🌐 Site: https://zoevita.net.br`;
ACT.shareApp=async()=>{let file=null;try{const b=await (await fetch('icons/icon-512.png')).blob();file=new File([b],'zoevita.png',{type:'image/png'})}catch(e){}
  try{if(file&&navigator.canShare&&navigator.canShare({files:[file],text:SHARE_TXT})){await navigator.share({files:[file],text:SHARE_TXT,title:'ZOEVITA'});return}
    if(navigator.share){await navigator.share({text:SHARE_TXT,title:'ZOEVITA'});return}}catch(e){if(e&&e.name==='AbortError')return}
  modal('Compartilhar o app',`<p style="margin-top:0">Envie a mensagem pelo WhatsApp. O ícone aparece na prévia do link.</p><div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><img src="icons/icon-512.png" alt="Ícone da ZOEVITA" width="72" height="72" style="border-radius:16px"><a class="btn sm" href="icons/icon-512.png" download="zoevita.png">Baixar ícone</a></div><textarea readonly rows="10" style="width:100%">${esc(SHARE_TXT)}</textarea><div class="form-actions"><button class="btn" data-act="shareCopy">Copiar mensagem</button><span class="sp"></span><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(SHARE_TXT)}" target="_blank" rel="noopener" data-nav="1">Abrir no WhatsApp</a></div>`)};
ACT.shareCopy=async()=>{try{await navigator.clipboard.writeText(SHARE_TXT);toast('Mensagem copiada')}catch(e){toast('Selecione o texto e copie')}};

/* Mudança de endereço: github.io → app.zoevita.net.br */
function moveBanner(){if(PATIENT)return;const old=/github\.io$/.test(location.hostname),neu=/(^|\.)zoevita\.net\.br$/.test(location.hostname);
  let off=false;try{off=localStorage.getItem('zv.move.off')==='1'}catch(e){}if((!old&&!neu)||off||$('#zv-move'))return;
  if(neu&&(S.patients||[]).some(p=>!p.demo))return;
  const b=document.createElement('div');b.id='zv-move';b.className='zv-move';b.setAttribute('role','region');b.setAttribute('aria-label','Novo endereço da ZOEVITA');
  b.innerHTML=old?`<div><b>A ZOEVITA mudou de endereço: <a href="https://app.zoevita.net.br/" target="_blank" rel="noopener" data-nav="1">app.zoevita.net.br</a></b><span>Para levar seus dados: 1) baixe aqui a cópia de segurança protegida; 2) abra o novo endereço e restaure a cópia em Configurações › Restaurar cópia. Este endereço continua funcionando.</span></div><div class="zv-move-a">${canClinical()?'<button class="btn sm" data-act="bkSave">Baixar cópia protegida</button>':''}<a class="btn sm primary" href="https://app.zoevita.net.br/" target="_blank" rel="noopener" data-nav="1">Abrir o novo endereço</a><button class="x" data-act="moveOff" aria-label="Fechar aviso">×</button></div>`
   :`<div><b>Bem-vinda ao novo endereço da ZOEVITA</b><span>Usava o endereço antigo? Traga seus dados: lá, baixe a cópia de segurança protegida; aqui, restaure em Configurações › Restaurar cópia.</span></div><div class="zv-move-a">${canAdmin()?'<button class="btn sm primary" data-act="cfgBk">Restaurar cópia</button>':''}<button class="x" data-act="moveOff" aria-label="Fechar aviso">×</button></div>`;
  document.body.appendChild(b)}
ACT.moveOff=()=>{try{localStorage.setItem('zv.move.off','1')}catch(e){}const b=$('#zv-move');if(b)b.remove()};

load();legalInit();route();ntfInit();moveBanner();if(secOn())lockNow();
</script>
