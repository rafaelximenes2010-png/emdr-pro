<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMDR PRO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180-v2.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180-v2.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167-v2.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152-v2.png?v=2">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120-v2.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMDR PRO">
<meta name="description" content="Gestão clínica e estimulação bilateral EMDR · Karina Ximenes, Psicóloga">
<meta name="theme-color" content="#2F3B27">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: clinical workspace — deep-green rail + working canvas on creme; the EMDR stage is its own dark room */
:root{
  --bg:#F4F1E8; --surface:#FFFEFB; --surface-2:#F8F6EF; --ink:#232A1E; --muted:#5F6855; --line:#DEDCCD;
  --deep:#3D4E30; --sage:#8A9B74; --sage-soft:#E7EADB; --gold:#977536; --gold-soft:#F2EAD7;
  --accent:#4A5D39; --on-accent:#F8F5EC;
  --nav-bg:#2F3B27; --nav-ink:#EEEADC; --nav-muted:#AEB79C; --nav-hover:#3B4932; --nav-gold:#D6BE82;
  --ok:#2C7650; --ok-soft:#DFEEE5; --warn:#9A6A12; --warn-soft:#F5EAD2; --bad:#A0413A; --bad-soft:#F6E2DF;
  --shadow:0 1px 2px rgba(27,40,34,.06),0 8px 24px rgba(27,40,34,.07);
  --f-display:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13170F; --surface:#1A2016; --surface-2:#20271B; --ink:#ECEADF; --muted:#A3AA94; --line:#2F3828;
  --deep:#C3D3AA; --sage:#8FA377; --sage-soft:#273022; --gold:#D6BA78; --gold-soft:#342C1A;
  --accent:#AFC290; --on-accent:#141A10;
  --nav-bg:#0E120B; --nav-ink:#E6E3D5; --nav-muted:#8E987D; --nav-hover:#1C2417; --nav-gold:#D6BE82;
  --ok:#7FCB9D; --ok-soft:#18301F; --warn:#E2B55B; --warn-soft:#352A15; --bad:#E78E85; --bad-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13170F; --surface:#1A2016; --surface-2:#20271B; --ink:#ECEADF; --muted:#A3AA94; --line:#2F3828;
  --deep:#C3D3AA; --sage:#8FA377; --sage-soft:#273022; --gold:#D6BA78; --gold-soft:#342C1A;
  --accent:#AFC290; --on-accent:#141A10;
  --nav-bg:#0E120B; --nav-ink:#E6E3D5; --nav-muted:#8E987D; --nav-hover:#1C2417; --nav-gold:#D6BE82;
  --ok:#7FCB9D; --ok-soft:#18301F; --warn:#E2B55B; --warn-soft:#352A15; --bad:#E78E85; --bad-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:2.35rem;line-height:1.1}
h1 em{font-style:italic;color:var(--gold);font-weight:500}
h2{font-size:1.5rem;line-height:1.2;font-weight:600}
h3{font-size:1.2rem;line-height:1.25;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sp{flex:1}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100%}
.nav{background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;gap:26px;padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand-logo{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--nav-gold)}
.brand-txt{min-width:0}
.brand-txt b{font-family:var(--f-display);font-weight:500;font-size:1.5rem;display:block;line-height:1;color:var(--nav-ink)}
.brand-role{display:block;font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;color:var(--nav-gold);margin-top:5px}
.brand-txt small{display:block;color:var(--nav-muted);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;margin-top:6px}
.brand-app{width:100%;font-size:.72rem;color:var(--nav-muted);border-top:1px solid var(--nav-hover);padding-top:10px;letter-spacing:.03em}
.brand-app b{font-family:var(--f-body);font-size:.72rem;font-weight:700;color:var(--nav-ink);letter-spacing:.08em;display:inline}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:6px}
.pillars div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.pillars svg{width:40px;height:40px;color:var(--accent);margin-bottom:4px}
.pillars b{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.pillars span{font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:1.05rem}
.nav-links{display:flex;flex-direction:column;gap:2px}
.nav-links a,.nav-soon{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-weight:500;font-size:.94rem;white-space:nowrap}
.nav-links a:hover{background:var(--nav-hover)}
.nav-links a[aria-current="page"]{background:var(--nav-hover);box-shadow:inset 2px 0 0 var(--gold)}
.nav-links svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-sep{height:1px;background:var(--nav-hover);margin:10px 4px}
.nav-soon{color:var(--nav-muted);cursor:default}
.nav-soon i{font-style:normal;font-size:.68rem;border:1px solid var(--nav-muted);border-radius:99px;padding:0 7px;margin-left:auto;letter-spacing:.04em}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.nav-foot label{color:var(--nav-muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.nav-foot select{background:var(--nav-hover);border:1px solid var(--nav-hover);border-radius:8px;padding:8px;color:var(--nav-ink)}
.who{color:var(--nav-muted);font-size:.8rem}

.main{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--gold-soft);color:var(--ink);font-size:.82rem;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-bar b{font-weight:600}
.view{padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%}
.view-in{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-inline:clamp(0px,1.6vw,18px)}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.page-head .sub{color:var(--muted);margin-top:4px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--sage)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:transparent;font-size:1.4rem;line-height:1;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 13px;font-weight:600;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sage-soft);color:var(--deep)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.pill.st-agendado{background:var(--sage-soft);color:var(--deep)}
.pill.st-confirmado{background:var(--accent);color:var(--on-accent)}
.pill.st-realizado{background:var(--ok-soft);color:var(--ok)}
.pill.st-cancelado{background:var(--bad-soft);color:var(--bad)}
.pill.st-ausencia{background:var(--warn-soft);color:var(--warn)}
.pill.rascunho{background:var(--warn-soft);color:var(--warn)}
.pill.finalizado{background:var(--ok-soft);color:var(--ok)}
.pill.ativo{background:var(--ok-soft);color:var(--ok)}
.pill.espera{background:var(--warn-soft);color:var(--warn)}
.pill.encerrado{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.online{background:var(--gold-soft);color:var(--gold)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--sage);outline-offset:0;border-color:var(--sage)}
.row2,.row3{display:grid;gap:12px}
.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.form-err{background:var(--bad-soft);color:var(--bad);padding:9px 12px;border-radius:8px;margin:0;font-size:.88rem}
.hint{font-size:.8rem;color:var(--muted);margin:0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding-block:max(5vh,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:560px;border:1px solid var(--line)}
.sheet.wide{max-width:760px}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px 6px 22px}
.sheet header h2{flex:1}
.sheet-body{padding:8px 22px 22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* dashboard */
.shortcuts{display:flex;flex-wrap:wrap;gap:10px}
.shortcut{flex:1 1 170px;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:.06em;font-size:.8rem;text-transform:uppercase}
.shortcut span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:.82rem}
.shortcut:hover{border-color:var(--sage)}
.shortcut.lead{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.shortcut.lead span{color:var(--on-accent);opacity:.8}
.shortcut.off{opacity:.55;cursor:default}
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.stat{flex:1 1 150px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.stat .n.money{font-size:1.65rem}
.stat .n{font-family:var(--f-display);font-size:2.2rem;line-height:1.05;font-weight:500;font-variant-numeric:lining-nums tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.aitem:first-child{border-top:0}
.aitem:hover{background:var(--surface-2)}
.aitem .t{font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums}
.aitem .who{font-weight:600;color:var(--ink);font-size:.95rem}
.aitem .meta{font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.slot-chip{font-family:var(--f-mono);font-size:.82rem;border:1px dashed var(--sage);color:var(--deep);border-radius:7px;padding:3px 9px;background:transparent;cursor:pointer}
.pend{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.pend li{display:flex;gap:10px;align-items:baseline;font-size:.92rem}
.pend .n{font-family:var(--f-mono);font-weight:500;min-width:2ch;text-align:right;color:var(--gold)}

/* agenda */
.ag-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ag-title{font-family:var(--f-display);font-size:1.5rem;font-weight:500;min-width:0}
.ag-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tg{display:grid;min-width:780px}
.tg.day{min-width:0}
.tg-head{display:contents}
.tg-h{padding:10px 8px;border-bottom:1px solid var(--line);font-size:.82rem;text-align:center;color:var(--muted);position:sticky;top:0;background:var(--surface);z-index:2}
.tg-h b{display:block;font-family:var(--f-display);font-size:1.4rem;color:var(--ink);font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.tg-h.is-today b{color:var(--on-accent);background:var(--accent);border-radius:99px;display:inline-block;min-width:1.9em;padding:0 .3em}
.tg-times{position:relative;border-right:1px solid var(--line)}
.tg-times span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.day-col{position:relative;border-right:1px solid var(--line);cursor:copy;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hpx,52px))}
.day-col:last-child{border-right:0}
.day-col.is-today{background-color:var(--surface-2)}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:4px 7px;font-size:.78rem;line-height:1.25;overflow:hidden;text-align:left;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.ev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tm{font-family:var(--f-mono);font-size:.7rem;opacity:.85}
.ev.st-agendado{background:var(--sage-soft);color:var(--deep);border-color:var(--sage)}
.ev.st-confirmado{background:var(--accent);color:var(--on-accent)}
.ev.st-realizado{background:var(--ok-soft);color:var(--ok)}
.ev.st-cancelado{background:var(--surface-2);color:var(--muted);text-decoration:line-through;border-color:var(--line)}
.ev.st-ausencia{background:var(--warn-soft);color:var(--warn)}
.ev.online::after{content:"on-line";position:absolute;right:5px;top:4px;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.8}
.blk{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--gold-soft) 0 6px,transparent 6px 12px);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);color:var(--gold);font-size:.72rem;font-weight:600;padding:3px 7px;cursor:pointer}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--gold);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:640px}
.mcell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:transparent;text-align:left;border-top:0;border-left:0}
.mcell:nth-child(7n){border-right:0}
.mcell:hover{background:var(--surface-2)}
.mcell.out{opacity:.45}
.mcell .d{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mcell.is-today .d{color:var(--on-accent);background:var(--accent);border-radius:99px;padding:0 6px;align-self:flex-start}
.mchip{font-size:.72rem;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip.st-agendado{background:var(--sage-soft);color:var(--deep)}
.mchip.st-confirmado{background:var(--accent);color:var(--on-accent)}
.mchip.st-realizado{background:var(--ok-soft);color:var(--ok)}
.mchip.st-cancelado{color:var(--muted);text-decoration:line-through}
.mchip.st-ausencia{background:var(--warn-soft);color:var(--warn)}
.mhead{padding:8px;font-size:.76rem;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}

/* patients */
.pt-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.pt-list{display:flex;flex-direction:column;gap:10px;position:sticky;top:0}
.pt-items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.pt-item{display:flex;flex-direction:column;gap:2px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.pt-item:first-child{border-top:0}
.pt-item:hover{background:var(--surface-2)}
.pt-item[aria-current="true"]{background:var(--sage-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pt-item .nm{font-weight:600;display:flex;gap:8px;align-items:center}
.pt-item .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pt-item .meta{font-size:.8rem;color:var(--muted)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;width:100%}
.pt-head{display:flex;gap:14px 18px;flex-wrap:wrap;align-items:flex-start}
.pt-head .civil{color:var(--muted);font-size:.86rem}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}

/* emdr */
.emdr{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;height:100%}
.stage.immersive{position:fixed;inset:0;z-index:100;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.fs-hud{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:8px 10px;font-size:.85rem;opacity:0;transition:opacity .4s;max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
.fs-hud .mono{padding:0 6px}
.fs-hud button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.stage.is-fs .fs-hud{display:flex}
.stage.is-fs.hud-on .fs-hud{opacity:1}
.fs-stop{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:none;border:1px solid rgba(255,255,255,.4);background:rgba(160,40,40,.75);color:#fff;border-radius:99px;padding:8px 16px;font-weight:700;letter-spacing:.04em;cursor:pointer;font-size:.8rem}
.stage.is-fs .fs-stop{display:block}
.stage-idle{position:absolute;left:16px;top:14px;color:rgba(255,255,255,.55);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;pointer-events:none}
.stage.is-fs .stage-idle{display:none}
.transport{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.transport .btn{padding:11px 18px;font-size:.95rem}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.hud div{padding:10px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.hud div:last-child{border-right:0}
.hud .v{font-family:var(--f-mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.hud .l{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
.state{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.state.run{color:var(--ok)} .state.pause{color:var(--warn)}
.ctrl{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ctrl section{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.ctrl section:first-child{border-top:0;padding-top:0}
.range{display:flex;flex-direction:column;gap:4px}
.range .top{display:flex;justify-content:space-between;align-items:baseline;font-size:.84rem}
.range .top span:first-child{font-weight:600;color:var(--muted);font-size:.78rem}
.range .top .mono{font-size:.84rem}
input[type="range"]{width:100%;accent-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.sw-custom{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.sw-custom input{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface-2)}
.preset-row{display:flex;flex-wrap:wrap;gap:6px}
.preset{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 12px;font-size:.84rem;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.preset:hover{border-color:var(--sage)}
.preset .x{color:var(--muted);font-weight:400}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.setlog{display:flex;flex-direction:column;font-size:.86rem}
.setlog div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.setlog div:first-child{border-top:0}
.disclaim{font-size:.78rem;color:var(--muted);line-height:1.45;margin:0}
.kbd{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}

/* v3.1 — sala de teleconsulta própria (vídeo + estimulação + transcrição) */
.call-box{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.call-stage{position:relative;aspect-ratio:16/9;max-width:100%;background:#101410;border-radius:14px;overflow:hidden}
.call-stage video{background:#101410}
.call-stage #rtc-remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.call-stage #rtc-local{position:absolute;right:10px;bottom:10px;width:26%;max-width:180px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.6);transform:scaleX(-1)}
.call-wait{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.8);font-weight:600;padding:20px}
.invite{display:flex;flex-direction:column;gap:8px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px}
.invite .row{display:flex;gap:8px;flex-wrap:wrap}
.invite input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:.8rem}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.pill.rtc-on{background:var(--ok-soft);color:var(--ok)}
.pill.rtc-wait{background:var(--warn-soft);color:var(--warn)}
.pill.rtc-off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* tela do paciente */
.pt-mode .app,.pt-mode #inst,.pt-mode .inst-arrow{display:none!important}
.pt-room{position:fixed;inset:0;background:#141A11;color:#F3EFE3;display:flex;flex-direction:column;font-family:var(--f-body)}
.pt-head{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.pt-head img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px #D6BE82}
.pt-head b{font-family:var(--f-display);font-size:1.2rem;font-weight:500;display:block;line-height:1.1}
.pt-head small{color:#D6BE82;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase}
.pt-stage{position:relative;flex:1;min-height:0;background:#0C100A}
.pt-stage #pt-remote{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0C100A}
.pt-stage #pt-local{position:absolute;right:12px;top:12px;width:28%;max-width:160px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.55);transform:scaleX(-1)}
.pt-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.pt-msg h1{font-family:var(--f-display);font-weight:500;font-size:1.9rem;color:#F3EFE3;margin:0}
.pt-msg p{margin:0;color:#B9C0A8;max-width:34ch;line-height:1.45}
.pt-bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pt-bar .btn{border-radius:999px;padding:12px 18px}
.pt-bar .pill{font-size:.78rem}
.btn.dark{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.pt-stop{display:none;position:fixed;z-index:306;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));background:#B23A32;color:#fff;border:0;border-radius:999px;padding:16px 26px;font-size:1.05rem;font-weight:800;letter-spacing:.06em;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.pt-mode.pj-running .pt-stop{display:block}
/* v2.4 — baixar o app */
.inst{position:fixed;inset:0;z-index:200;background:rgba(14,20,10,.55);display:flex;align-items:flex-end;justify-content:center}
.inst-card{position:relative;width:min(460px,100%);background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:instUp .35s ease-out}
@media (min-width:640px){.inst{align-items:center}.inst-card{border-radius:22px}}
@keyframes instUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.inst-top{display:flex;gap:14px;align-items:center}
.inst-top img{width:64px;height:64px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.inst-top b{display:block;font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.1}
.inst-top span{font-size:.85rem;color:var(--muted)}
.inst-x{position:absolute;right:10px;top:10px}
.btn.huge{padding:15px 18px;font-size:1.05rem;border-radius:14px;width:100%}
.inst-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.inst-steps li{display:flex;gap:12px;align-items:center;font-size:1rem;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.inst-steps i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-style:normal;font-weight:700}
.inst-steps svg{width:22px;height:22px;vertical-align:-5px;color:var(--accent)}
.inst-arrow{position:fixed;z-index:201;width:56px;height:56px;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));animation:bob 1.1s ease-in-out infinite;pointer-events:none}
.inst-arrow.down{left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));margin-left:-28px}
.inst-arrow.up{right:14px;top:calc(4px + env(safe-area-inset-top,0px));transform:rotate(180deg)}
@keyframes bob{50%{translate:0 10px}}
.inst-arrow.up{animation-name:bobUp}@keyframes bobUp{50%{translate:0 -10px}}
@media (prefers-reduced-motion:reduce){.inst-card,.inst-arrow{animation:none}}
/* v2.2 — estimulação compartilhada na teleconsulta */
.proj{position:fixed;inset:0;z-index:300;background:#000}
.proj canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pj-wait{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-body);font-size:1.1rem;font-weight:500;letter-spacing:.04em;text-align:center;pointer-events:none;max-width:80%}
.pj-hud{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,.6);border-radius:12px;padding:8px;opacity:0;transition:opacity .3s;max-width:calc(100% - 32px)}
.proj.hud-on .pj-hud{opacity:1}
.pj-hud button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* v2.1 — quadros clicáveis, logo para o início, gravação e transcrição */
button.stat{border-top:0;border-left:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit}
button.stat:hover{background:var(--surface-2)}
button.stat[aria-expanded="true"]{background:var(--sage-soft)}
.stat .l .caret{opacity:.55}
.drill{position:fixed;z-index:40;width:min(370px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;max-height:min(70vh,520px);overflow:auto}
.drill-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 6px}
.drill-list{display:flex;flex-direction:column}
.drill-list button{display:flex;gap:10px;justify-content:space-between;align-items:center;border:0;background:transparent;text-align:left;padding:8px 6px;border-radius:8px;cursor:pointer;color:var(--ink);width:100%}
.drill-list button:hover:not(:disabled){background:var(--surface-2)}
.drill-list button:disabled{cursor:default;opacity:1}
.drill-list span{display:flex;flex-direction:column;min-width:0}
.drill-list b{font-weight:600}
.drill-list small{color:var(--muted);font-size:.78rem}
.drill-list em{font-style:normal;font-size:.8rem;color:var(--muted);white-space:nowrap;font-family:var(--f-mono)}
.drill .btn{align-self:flex-start}
.brand-home{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;min-width:0;border-radius:12px}
.brand-home:hover .brand-logo{box-shadow:0 0 0 3px var(--nav-gold)}
.recbox{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.rec-dot{color:var(--bad);font-weight:700;font-size:.85rem;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.rec-dot{animation:none}}
/* v2.0 — demonstração, teleconsulta, documentos, relatórios */
.pill.demo{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn);text-transform:uppercase;letter-spacing:.06em;font-size:.6rem;font-weight:700}
.demo-panel{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border:1.5px dashed var(--warn);background:var(--warn-soft);border-radius:14px;padding:16px 20px}
.demo-panel div{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.demo-panel p{margin:0;font-size:.9rem}
.btn.big{padding:12px 18px;font-size:.88rem;letter-spacing:.03em;white-space:normal;text-align:center}
.check.is-dis{opacity:.5}
.ev.is-demo{border-style:dashed!important;border-color:var(--warn)!important}
.ev.is-demo::before{content:"DEMO";position:absolute;right:5px;bottom:3px;font-size:.55rem;font-weight:700;letter-spacing:.06em;opacity:.85}
.tele-clock{font-size:1.7rem}
.tele-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.tele-bar span{display:block;height:100%;width:0;background:var(--accent);transition:width 1s linear}
.tele-bar span.over{background:var(--warn)}
.tele-live{border-color:var(--accent);box-shadow:0 0 0 3px var(--sage-soft)}
.tele-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.aitem.tele-row{cursor:default}
.aitem.tele-row:hover{background:transparent}
.doc-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.doc-scroll{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:64vh;overflow:auto}
.doc-page{background:#fff;color:#23291f;max-width:210mm;margin:0 auto;padding:12mm 14mm 9mm;box-shadow:0 2px 12px rgba(0,0,0,.14);font-family:Helvetica,Arial,sans-serif;font-size:10.5pt;line-height:1.45;color-scheme:light}
.doc-head{display:flex;gap:12px;align-items:center;border-bottom:1.5px solid #B08D45;padding-bottom:8px;margin-bottom:12px}
.doc-head img{width:50px;height:50px;border-radius:50%}
.doc-head b{display:block;font-family:"EB Garamond",Georgia,serif;font-size:15pt;color:#3D4E30;font-weight:600}
.doc-head span,.doc-head small{display:block;color:#666;font-size:8.5pt}
.doc-title{font-family:"EB Garamond",Georgia,serif;font-size:17pt;font-weight:600;margin:6px 0 2px;color:#23291f}
.doc-subt{margin:0 0 8px;color:#666}
.doc-h{font-family:Helvetica,Arial,sans-serif;font-size:9.5pt;letter-spacing:.06em;text-transform:uppercase;color:#3D4E30;border-bottom:1px solid #ddd8c4;padding-bottom:3px;margin:14px 0 6px;font-weight:700}
.doc-sh{font-family:Helvetica,Arial,sans-serif;font-size:10pt;margin:10px 0 2px;color:#23291f;font-weight:700}
.doc-kv{margin:0 0 4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.doc-kv dt{font-size:8pt;color:#777;font-weight:700}
.doc-kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.doc-p{margin:2px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.doc-t{width:100%;border-collapse:collapse;font-size:9pt;margin:6px 0}
.doc-t th{background:#f2efe4;color:#3D4E30;text-align:left;padding:4px 6px}
.doc-t td{border-bottom:1px solid #e3e0d2;padding:4px 6px}
.doc-sign{display:flex;flex-direction:column;align-items:center;margin:34px 0 8px}
.doc-sign span{width:70mm;max-width:80%;border-top:1px solid #333;margin-bottom:4px}
.doc-sign b{font-family:"EB Garamond",Georgia,serif;font-size:12pt}
.doc-sign small{color:#666}
.doc-demo{border:1px dashed #9A6A12;background:#F5EAD2;color:#9A6A12;font-weight:700;font-size:8.5pt;letter-spacing:.06em;text-align:center;padding:5px;border-radius:4px;margin-bottom:8px}
.doc-foot{margin-top:18px;border-top:1px solid #B08D45;padding-top:6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:8pt;color:#777}
.perm-t td:not(:first-child),.perm-t th:not(:first-child){text-align:center}
.perm-t .y{color:var(--ok);font-weight:700}
.perm-t .n{color:var(--muted)}
@media (max-width:560px){.doc-kv{grid-template-columns:minmax(0,1fr)}}
@media print{.app,#toast,#tour{display:none!important}body *{visibility:hidden!important}.print-area,.print-area *{visibility:visible!important}.print-area{position:absolute;left:0;top:0;width:100%}.modal{position:static;background:none;overflow:visible;padding:0}.doc-scroll{max-height:none;overflow:visible;border:0;padding:0;background:none}.doc-page{box-shadow:none;max-width:none;padding:0}@page{size:A4;margin:16mm}}
/* v1.2 — frase em destaque, financeiro, tutorial, personalizar */
.hero{display:flex;gap:14px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold)}
.hero-logo{width:42px;height:42px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--gold-soft)}
.hero-txt{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.hero-brand{display:none}
.hero blockquote{margin:0;display:contents}
.hero blockquote p{margin:0;font-family:var(--f-display);font-style:italic;font-size:1.12rem;line-height:1.35;color:var(--deep)}
.hero blockquote p::before{content:"“"}
.hero blockquote p::after{content:"”"}
.hero em{color:var(--gold)}
.hero cite{font-style:normal;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hero-tag{display:none}
.nav-tour{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--nav-gold);color:#1F2716;border:0;border-radius:10px;padding:10px 12px;font-weight:700;letter-spacing:.03em;cursor:pointer;font-size:.88rem;box-shadow:0 4px 16px rgba(214,190,130,.22)}
.nav-tour:hover{filter:brightness(1.06)}
.is-native .nav-install,.is-native .demo-bar .btn-web-only{display:none!important}
.nav-install{background:transparent;color:var(--nav-ink);box-shadow:inset 0 0 0 1.5px var(--nav-gold)}
.ios-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.ios-steps svg{width:18px;height:18px;vertical-align:-3px}
.nav-tour svg{width:16px;height:16px}
.tour-btn{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.side-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.tg.can-drag .ev{cursor:grab}
.tg.can-drag .ev.st-realizado{cursor:pointer}
.ev.dragging{opacity:.35}
.ev-ghost{z-index:6;box-shadow:var(--shadow);pointer-events:none;outline:2px solid var(--gold)}
.ev-ghost.bad{outline:2px dashed var(--bad)}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daychip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.86rem;cursor:pointer;background:var(--surface-2)}
.daychip input{accent-color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;min-width:660px;font-size:.9rem}
.tbl th{text-align:left;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .acts{text-align:right;white-space:nowrap}
.tbl .acts>*{vertical-align:middle;margin-left:4px}
.receipt pre{white-space:pre-wrap;font-family:var(--f-body);font-size:.95rem;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0;overflow-wrap:anywhere}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px;align-items:start}
.sw-row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.sw-txt{display:flex;flex-direction:column;min-width:0}
.sw-txt b{font-weight:600}
.sw-txt small{color:var(--muted);font-size:.8rem}
.sw-row.is-dis{opacity:.5;cursor:not-allowed}
.switch{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0;border:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.switch:disabled{cursor:not-allowed}
.sw-fixed{font-size:.8rem;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.tour{position:fixed;inset:0;z-index:90}
.tour-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 200vmax rgba(12,16,9,.6);transition:top .3s,left .3s,width .3s,height .3s;pointer-events:none;outline:2px solid var(--nav-gold);outline-offset:2px}
.tour-card{position:fixed;width:min(370px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:16px 18px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);transition:top .3s,left .3s}
.tour-card p{margin:0;font-size:.92rem}
.tour-step{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.tour-bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.tour-bar span{display:block;height:100%;background:var(--gold)}
.tour-actions{display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){.tour-hole,.tour-card{transition:none}}
/* menus suspensos, explicações, anotações, atualizações */
.dd{position:relative;display:inline-flex}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:260px;max-width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.dd-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;width:100%;color:var(--ink)}
.dd-menu button:hover,.dd-menu button:focus-visible{background:var(--surface-2)}
.dd-menu b{font-weight:600;font-size:.9rem}
.dd-menu small{color:var(--muted);font-size:.78rem;line-height:1.35;font-weight:400}
.dd-menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px;width:calc(100% - 12px)}
.dd-menu .danger b{color:var(--bad)}
.caret{font-size:.7rem;opacity:.75}
.howto{border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:.9rem}
.howto summary{cursor:pointer;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
.howto[open] summary::after{transform:rotate(180deg)}
.howto .body{padding:0 16px 14px 44px;display:flex;flex-direction:column;gap:8px;max-width:84ch}
.howto .body p{margin:0}
.howto ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.q,.info-btn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:.75rem;flex:none;border:0;padding:0;line-height:1}
.info-btn{cursor:pointer}
.info-btn[aria-expanded="true"]{background:var(--gold);color:var(--surface)}
.lab-row{display:flex;align-items:center;gap:6px}
.explain{margin:2px 0 0;font-size:.8rem;line-height:1.45;color:var(--ink);background:var(--gold-soft);border-radius:8px;padding:8px 10px;font-weight:400}
.nav-badge{margin-left:auto;font-size:.66rem;font-weight:700;background:var(--gold);color:#14261E;border-radius:99px;padding:1px 7px;letter-spacing:.03em}
.nav-prof{border:1px solid var(--nav-hover);background:transparent;color:var(--nav-ink);border-radius:8px;padding:7px 9px;text-align:left;cursor:pointer;font-size:.82rem;font-weight:600}
.nav-prof:hover{background:var(--nav-hover)}
.news{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border:1px solid var(--gold);background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:.9rem}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.note{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.note.pinned{border-color:var(--gold)}
.note-head{display:flex;gap:8px;align-items:flex-start}
.note-head h3{flex:1;min-width:0;overflow-wrap:anywhere}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.note-meta{font-size:.78rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;max-width:100%}
.filters .search{flex:1;min-width:180px;width:auto}
.cl{display:flex;flex-direction:column}
.cl-entry{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:18px 0;border-top:1px solid var(--line)}
.cl-entry:first-child{border-top:0;padding-top:4px}
.cl-ver{display:flex;flex-direction:column;gap:4px}
.cl-ver b{font-family:var(--f-mono);font-size:1.05rem;font-weight:500}
.cl-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.cl-items li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:baseline}
.cl-items li p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;text-align:center}
.tag.novo{background:var(--accent);color:var(--on-accent)}
.tag.melhoria{background:var(--sage-soft);color:var(--deep)}
.tag.correcao{background:var(--warn-soft);color:var(--warn)}
.tag.seguranca{background:var(--bad-soft);color:var(--bad)}
.road{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.road-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.road-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);font-size:.86rem;color:var(--muted)}
.road-item b{display:block;font-size:.92rem;color:var(--ink)}
@media (max-width:900px){.road,.cl-entry{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.cl-items li{grid-template-columns:minmax(0,1fr)}.cl-items .tag{justify-self:start}.howto .body{padding-left:16px}}

@media (max-width:1100px){
  .emdr{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .nav{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible}
  .brand-txt small,.brand-app{display:none}
  .brand-logo{width:40px;height:40px}
  .brand-txt b{font-size:1.25rem}
  .nav-links{flex-direction:row;overflow-x:auto;order:3;width:100%;gap:4px}
  .nav-links a{padding:7px 10px}
  .nav-sep,.nav-soon{display:none}
  .nav-foot{margin:0 0 0 auto;flex-direction:row;align-items:center;gap:8px}
  .nav-foot label,.who{display:none}
  .nav-tour{order:2;padding:7px 12px;font-size:.8rem}
  .dash-grid,.pt-wrap{grid-template-columns:minmax(0,1fr)}
  .pt-list{position:static}
  .pt-wrap.has-sel .pt-list{display:none}
  .pt-wrap:not(.has-sel) .pt-detail{display:none}
  .back-btn{display:inline-flex}
}
@media (max-width:560px){
  h1{font-size:1.6rem}
  .row2,.row3,.kv,.emdr-grid{grid-template-columns:minmax(0,1fr)}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hud div:nth-child(2){border-right:0}
  .hud div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .audit div{grid-template-columns:minmax(0,1fr)}
  .aitem{grid-template-columns:50px minmax(0,1fr)}
  .aitem .pill{grid-column:2;justify-self:start}
  .aitem.tele-row{grid-template-columns:50px minmax(0,1fr)}
  .tele-row .tele-acts{grid-column:1/-1;justify-content:flex-start;padding-left:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- conflitos e agenda ---------- */
function conflict(start,dur,ignore){
  const s=start.getTime(),e=s+dur*60000;
  for(const a of S.appts){if(a.id===ignore||a.status==='cancelado')continue;const as=P(a.start).getTime(),ae=as+a.dur*60000;if(s<ae&&e>as)return `Conflito com ${pname(getP(a.pid))} às ${fmtT(P(a.start))}.`}
  for(const b of S.blocks){if(b.id===ignore)continue;const bs=P(b.start).getTime(),be=bs+b.dur*60000;if(s<be&&e>bs)return `Horário bloqueado (${b.motivo}) das ${fmtT(P(b.start))} às ${fmtT(new Date(be))}.`}
  return null;
}
function freeSlots(day){const a=S.prefs.agenda;const now=new Date();const out=[];if(!a.days.includes(day.getDay()))return out;for(let m=a.start*60;m+a.dur<=a.end*60;m+=60){const s=new Date(day.getFullYear(),day.getMonth(),day.getDate(),Math.floor(m/60),m%60);if(s<now)continue;if(!conflict(s,a.dur))out.push(s)}return out}

function dd(label,items,cls='btn',noCaret){items=items.filter((it,i,a)=>!(it==='-'&&(i===0||a[i-1]==='-'||i===a.length-1)));const id='dd'+uid();return `<div class="dd"><button type="button" class="${cls}" data-act="menu" aria-haspopup="true" aria-expanded="false" aria-controls="${id}" ${noCaret?'aria-label="Mais opções"':''}>${label}${noCaret?'':' <span class="caret">▾</span>'}</button><div class="dd-menu" id="${id}" role="menu" hidden>${items.map(it=>it==='-'?'<hr>':`<button type="button" role="menuitem" class="${it.danger?'danger':''}" data-act="${it.act}" ${Object.entries(it.data||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}><b>${it.label}</b>${it.hint?`<small>${it.hint}</small>`:''}</button>`).join('')}</div></div>`}
function closeMenus(){const dr=document.getElementById('drill');if(dr&&!dr.hidden){dr.hidden=true;document.querySelectorAll('[data-act=drill][aria-expanded=true]').forEach(x=>x.setAttribute('aria-expanded','false'))}$$('.dd-menu').forEach(m=>{if(!m.hidden){m.hidden=true;const b=m.previousElementSibling;b&&b.setAttribute('aria-expanded','false')}})}
ACT.menu=(d,b)=>{const m=b.nextElementSibling;const open=m.hidden;closeMenus();if(open){m.hidden=false;b.setAttribute('aria-expanded','true');const r=b.getBoundingClientRect();m.style.position='fixed';m.style.right='auto';const mw=m.offsetWidth,mh=m.offsetHeight;m.style.left=Math.max(12,Math.min(r.right-mw,innerWidth-mw-12))+'px';m.style.top=(r.bottom+6+mh>innerHeight-8&&r.top-6-mh>8?r.top-6-mh:r.bottom+6)+'px';const f=m.querySelector('button');f&&f.focus({preventScroll:true})}};
$('#main').addEventListener('scroll',()=>{closeMenus();tourPlace()},{passive:true});window.addEventListener('resize',()=>{closeMenus();tourPlace()});
document.addEventListener('click',e=>{if(!e.target.closest('.dd,#drill,[data-act=drill]'))closeMenus()});
document.addEventListener('keydown',e=>{if(tour){if(e.key==='Escape'){e.preventDefault();tourEnd(false)}else if(e.key==='ArrowRight'){e.preventDefault();tourGo(tour.pos+1)}else if(e.key==='ArrowLeft'){e.preventDefault();tourGo(tour.pos-1)}return}if(e.key==='Escape')closeMenus()});
function howto(title,html){if(S&&S.prefs&&S.prefs.nav.guias===false)return'';return `<details class="howto"><summary><span class="q">?</span>${title}</summary><div class="body">${html}</div></details>`}
function info(forId,label,text){const t='t-'+forId;return `<div class="lab-row"><label for="${forId}">${label}</label><button type="button" class="info-btn" data-act="info" data-t="${t}" aria-expanded="false" aria-label="O que é ${esc(label)}?">?</button></div><p class="explain" id="${t}" hidden>${text}</p>`}
ACT.info=(d,b)=>{const p=document.getElementById(d.t);if(!p)return;p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))};

/* perfil profissional */
ACT.profile=()=>{if(role()!=='psi')return;const p=profile();
  modal('Perfil profissional',`<form id="f-prof" class="form">
   <div class="field"><label for="pr-name">Nome de exibição</label><input id="pr-name" value="${esc(p.name)}"></div>
   <div class="row2"><div class="field">${info('pr-crp','Número do CRP','Informe região e número de inscrição no Conselho Regional de Psicologia, por exemplo CRP 02/12345. Aparece no menu e na autoria de evoluções, registros EMDR e adendos.')}<input id="pr-crp" value="${esc(p.crp)}" placeholder="CRP 00/00000"></div>
   <div class="field"><label for="pr-esp">Especialidade ou abordagem</label><input id="pr-esp" value="${esc(p.esp||'')}"></div></div>
   <p class="hint">Registros já gravados mantêm o CRP vigente no momento em que foram feitos.</p>
   <p class="form-err" id="pr-err" hidden></p>
   <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar perfil</button></div></form>`);
  $('#f-prof').onsubmit=e=>{e.preventDefault();const err=$('#pr-err');const name=$('#pr-name').value.trim();let c=$('#pr-crp').value.trim();
    if(!name){err.textContent='Informe o nome de exibição.';err.hidden=false;return}
    if(c){const m=c.replace(/^crp[\s-]*/i,'').match(/^(\d{1,2})\s*[\/\-.]\s*(\d{2,7})$/);if(!m){err.textContent='Use o formato CRP 02/12345 (região/número).';err.hidden=false;return}c=`CRP ${m[1].padStart(2,'0')}/${m[2]}`}
    const old=S.profile.crp;S.profile={name,crp:c,esp:$('#pr-esp').value.trim()};audit(old!==c?`CRP atualizado para ${c||'(vazio)'}`:'Perfil profissional atualizado');save();closeModal();route();toast('Perfil salvo')}};

ACT.reset=(d,b)=>{if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Confirmar restauração';setTimeout(()=>{delete b.dataset.arm;b.textContent='Restaurar dados de exemplo'},3500);return}
  emdrTeardown();const keep={profile:S.profile,seenUpd:S.seenUpd,feedback:S.feedback,prefs:S.prefs};S=seed();Object.assign(S,keep);migrate();ui.pid=null;closeModal();delete b.dataset.arm;b.textContent='Restaurar dados de exemplo';current=null;route();toast('Dados de exemplo restaurados')};

    <div><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="20" cy="20" r="18.5" opacity=".35"/><path d="M16 25h8M17 28h6M20 11a6 6 0 0 0-3.5 10.9V25h7v-3.1A6 6 0 0 0 20 11z"/></svg><b>Propósito</b><span>que transforma</span></div>
  </div>`;
function heroHtml(){const p=profile();const t=(p.slogan||'').trim();const m=t.match(/^([\s\S]*\s)?(\S+?)([.!?…]*)$/);
  const q=m?`${esc(m[1]||'')}<em>${esc(m[2])}</em>${esc(m[3]||'')}`:esc(t);const logo=($('.brand-logo')||{}).src||'';

function renderPainel(){
  syncCharges();
  const pz=S.prefs.painel,show=k=>pz[k]!==false,ag=on('agenda'),fon=on('financeiro');
  const now=new Date(),tk=dkey(now),mk=tk.slice(0,7);
  const today=S.appts.filter(a=>a.start.slice(0,10)===tk).sort(byStart);
  const nToday=today.filter(a=>a.status!=='cancelado').length;
  const up=S.appts.filter(a=>P(a.start)>now&&a.start.slice(0,10)!==tk&&a.status!=='cancelado').sort(byStart).slice(0,5);
  const mon=S.appts.filter(a=>a.start.slice(0,7)===mk);const cnt=s=>mon.filter(a=>a.status===s).length;
  const ativos=S.patients.filter(p=>p.sit==='ativo').length;
  const free=freeSlots(now);
  const semBaixa=S.appts.filter(a=>addMin(P(a.start),a.dur)<now&&(a.status==='agendado'||a.status==='confirmado')).length;
  const naoConf=S.appts.filter(a=>{const s=P(a.start);return s>now&&s<addDays(now,2)&&a.status==='agendado'}).length;
  const docsPend=S.patients.filter(p=>p.sit==='ativo'&&(!p.docs?.tcle||!p.docs?.lgpd)).length;
  const drafts=S.evol.filter(e=>e.status==='rascunho').length+S.emdr.filter(e=>e.status==='rascunho').length;
  const fin=fon?finMonth(mk):null;
  const h=now.getHours();const greet=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const first=me().name.split(' ').slice(0,2).join(' ');
  const sc=[];
  if(on('emdr')&&canClinical())sc.push(`<a class="shortcut lead" href="#emdr">Iniciar EMDR<span>Estimulação bilateral</span></a>`);
  if(ag)sc.push(`<a class="shortcut" href="#agenda">Agenda<span>${nToday} consultas hoje</span></a>`);
  if(on('teleconsulta'))sc.push(`<a class="shortcut" href="#teleconsulta">Teleconsulta<span>${S.appts.filter(a=>a.mod==='online'&&['agendado','confirmado'].includes(a.status)&&P(a.start)>now).length} agendadas</span></a>`);
  sc.push(`<a class="shortcut" href="#pacientes" data-act="toPatients">Pacientes<span>${ativos} em acompanhamento</span></a>`);
  if(canClinical())sc.push(`<a class="shortcut" href="#pacientes" data-act="toRecords">Prontuários<span>${drafts} rascunhos</span></a>`);
  if(fon)sc.push(`<a class="shortcut" href="#financeiro">Financeiro<span>${brl(fin.recebido)} recebidos no mês</span></a>`);
  if(on('relatorios'))sc.push(`<a class="shortcut" href="#relatorios">Relatórios<span>Excel e PDF</span></a>`);
  if(on('anotacoes'))sc.push(`<a class="shortcut" href="#anotacoes">Anotações<span>${visibleNotes().length} notas</span></a>`);
  const st=[];
  if(ag)st.push([nToday,'Consultas hoje',0,'hoje'],[cnt('realizado'),'Realizadas no mês',0,'realizado'],[cnt('cancelado'),'Cancelamentos no mês',0,'cancelado'],[cnt('ausencia'),'Ausências no mês',0,'ausencia']);
  st.push([ativos,'Pacientes ativos',0,'ativos']);
  if(ag)st.push([S.waitlist.length,'Na lista de espera',0,'espera']);
  if(fon)st.push([brl(fin.recebido),'Recebido no mês',1,'recebido'],[brl(fin.atraso),'Em atraso',1,'atraso']);
  const pend=[];
  if(ag)pend.push([semBaixa,'consultas passadas sem baixa de comparecimento'],[naoConf,'consultas das próximas 48 h ainda não confirmadas']);
  pend.push([docsPend,'pacientes ativos com termos pendentes']);
  if(canClinical())pend.push([drafts,'registros clínicos em rascunho']);
  if(fon)pend.push([fin.nAtraso,'cobranças em atraso']);
  if(ag)pend.push([S.waitlist.length,'pessoas na lista de espera']);
  const main=ag&&show('hoje')?`<section class="panel"><div class="panel-head"><h2>Hoje</h2><span class="sp"></span><button class="btn sm" data-act="newAppt">Nova consulta</button></div><div class="alist">${today.length?today.map(a=>apptRow(a)).join(''):'<p class="empty">Nenhuma consulta para hoje.</p>'}</div></section>`:'';
  const side=[];
  if(show('pendencias'))side.push(`<section class="panel" id="pend"><h2>Pendências</h2><ul class="pend">${pend.map(([n,l])=>`<li><span class="n">${n}</span><span>${l}</span></li>`).join('')}</ul></section>`);
  if(ag&&show('livres'))side.push(`<section class="panel"><h2>Horários livres hoje</h2>${free.length?`<div class="chips">${free.map(s=>`<button class="slot-chip" data-act="newAppt" data-day="${dkey(s)}" data-time="${fmtT(s)}">${fmtT(s)}</button>`).join('')}</div><p class="hint">Blocos de ${S.prefs.agenda.dur} min sem conflito, dentro do seu expediente.</p>`:'<p class="empty">Sem horários livres no restante do dia.</p>'}</section>`);
  if(ag&&show('proximos'))side.push(`<section class="panel"><h2>Próximos atendimentos</h2><div class="alist">${up.length?up.map(a=>apptRow(a,true)).join(''):'<p class="empty">Nada agendado.</p>'}</div></section>`);
  if(fon&&show('financeiro'))side.push(`<section class="panel"><div class="panel-head"><h2>Resumo financeiro</h2><span class="sp"></span><a class="btn sm" href="#financeiro">Abrir financeiro</a></div><dl class="kv"><div><dt>Recebido no mês</dt><dd class="mono">${brl(fin.recebido)}</dd></div><div><dt>A receber</dt><dd class="mono">${brl(fin.aReceber)}</dd></div><div><dt>Em atraso</dt><dd class="mono" style="color:${fin.atraso?'var(--bad)':'inherit'}">${brl(fin.atraso)}</dd></div><div><dt>Resultado do mês</dt><dd class="mono">${brl(fin.resultado)}</dd></div></dl></section>`);
  let body='';
  if(main&&side.length)body=`<div class="dash-grid">${main}<div class="stack">${side.join('')}</div></div>`;
  else if(main)body=main;else if(side.length)body=`<div class="side-grid">${side.join('')}</div>`;
  $('#view').innerHTML=`<div class="view-in">
  ${show('slogan')?heroHtml():''}
  <div class="page-head"><div><div class="eyebrow">${now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>${greet}, <em>${esc(first)}</em></h1><div class="sub">${ag?`${nToday} atendimentos hoje · ${free.length} horários livres`:`${ativos} pacientes em acompanhamento`}</div></div><span class="sp"></span><button class="btn tour-btn" data-act="tour">▶ Fazer o tutorial</button></div>
  ${hasDemo()?`<section class="demo-panel"><div><span class="pill demo">Dados de demonstração</span><h2>Este sistema contém exemplos fictícios</h2><p>${demoSummary()} Explore à vontade e, quando estiver pronta, remova todos de uma vez. Pacientes reais, configurações e logotipo não são afetados.</p></div>${canAdmin()?'<button class="btn danger solid big" data-act="demoPurge">EXCLUIR TODOS OS DADOS DE DEMONSTRAÇÃO</button>':''}</section>`:''}
  ${on('atualizacoes')&&S.seenUpd!==APP_VERSION?`<div class="news"><span class="tag novo">Versão ${APP_VERSION}</span><span>Teleconsulta, documentos em PDF, relatórios em Excel, perfis de acesso e exemplos que se apagam com um clique.</span><span class="sp"></span><a class="btn sm" href="#atualizacoes">Ver novidades</a></div>`:''}
  ${howto('Como usar o painel',`<ul><li><b>Pendências</b> mostra o que precisa de ação: baixas de comparecimento, confirmações, termos, rascunhos e cobranças em atraso.</li><li><b>Horários livres</b>: toque num horário para agendar direto nele.</li><li>Em <b>Personalizar</b> você escolhe quais blocos aparecem aqui; o restante se reorganiza sozinho.</li></ul>`)}
  ${show('atalhos')?`<div class="shortcuts">${sc.join('')}</div>`:''}
  ${show('indicadores')?`<div class="stats">${st.map(([n,l,m,k])=>`<button type="button" class="stat" data-act="drill" data-k="${k}" aria-haspopup="true" aria-expanded="false"><span class="n ${m?'money':''}">${n}</span><span class="l">${l} <span class="caret">▾</span></span></button>`).join('')}</div>`:''}
  ${body}
  ${show('pilares')?PILLARS:''}
  </div>`;
}

   AGENDA
