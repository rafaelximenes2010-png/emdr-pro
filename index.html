let H0=8,H1=20,PX=54;let justDragged=0;
function agCfg(){const a=S.prefs.agenda;H0=a.start;H1=a.end;PX=a.density==='compacta'?40:a.density==='ampla'?74:54}
const weekDays=d=>Array.from({length:7},(_,i)=>addDays(sow(d),i)).filter(x=>S.prefs.agenda.days.includes(x.getDay()));
function renderAgenda(){
  agCfg();const d=ui.agDate,v=ui.agView;let title='';
  if(v==='dia')title=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  else if(v==='semana'){const wd=weekDays(d),a=wd[0],b=wd[wd.length-1];title=`${a.getDate()} ${a.getMonth()!==b.getMonth()?MES[a.getMonth()].slice(0,3)+' ':''}– ${b.getDate()} de ${MES[b.getMonth()]} ${b.getFullYear()}`}
  else title=`${MES[d.getMonth()]} de ${d.getFullYear()}`;
  let body='';
  if(v==='mes')body=monthGrid(d);else body=timeGrid(v==='dia'?[new Date(d)]:weekDays(d));
  $('#view').innerHTML=`<div class="view-in">
   <div class="page-head"><div><div class="eyebrow">Agenda clínica</div><h1>Agenda</h1></div><span class="sp"></span>
     <button class="btn" data-act="waitlist">Lista de espera (${S.waitlist.length})</button>
     ${dd('Novo',[{label:'Consulta',hint:'Agenda um atendimento presencial ou on-line, com checagem de conflitos',act:'newAppt'},{label:'Bloqueio de horário',hint:'Reserva um período sem atendimentos, como supervisão ou almoço',act:'newBlock'},'-',{label:'Pessoa na lista de espera',hint:'Registra quem aguarda vaga, com a preferência de horário',act:'waitlist'},'-',{label:'Ajustes da agenda',hint:'Expediente, dias exibidos, intervalo da grade, duração padrão e arraste',act:'agSettings'}],'btn primary')}</div>
   ${howto('Como funciona a agenda',`<ul><li>Clique num espaço vazio da grade para agendar naquele horário, ou use <b>Novo</b>.</li><li>Para reagendar, arraste a consulta com o mouse para outro dia ou horário, ou abra a consulta e mude a data ou a hora. O sistema impede sobreposição com outras consultas e com bloqueios.</li><li><b>Status</b>: Agendado (marcado), Confirmado (paciente confirmou), Realizado, Cancelado (libera o horário) e Ausência (não compareceu).</li><li>O paciente só recebe informações administrativas. Não escreva conteúdo clínico na observação da consulta.</li></ul>`)}
   <div class="ag-bar">
     <div class="seg" role="group" aria-label="Visualização">${['dia','semana','mes'].map(x=>`<button data-act="agView" data-v="${x}" aria-pressed="${v===x}">${x==='mes'?'Mês':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
     <div class="seg"><button data-act="agNav" data-n="-1" aria-label="Anterior">‹</button><button data-act="agNav" data-n="0">Hoje</button><button data-act="agNav" data-n="1" aria-label="Próximo">›</button></div>
     <span class="ag-title">${title}</span>
   </div>
   <div class="ag-scroll">${body}</div>
   <div class="legend">${Object.keys(STATUS).map(s=>`<span class="pill st-${s}">${STATUS[s]}</span>`).join('')}<span>· Clique num espaço vazio para agendar${S.prefs.agenda.drag?'; arraste uma consulta com o mouse para reagendar':''}.</span></div>
  </div>`;
  bindDrag();
}
function timeGrid(days){
  const tk=dkey(new Date());const n=days.length;const hgt=(H1-H0)*PX;
  let html=`<div class="tg ${n===1?'day':''} ${S.prefs.agenda.drag?'can-drag':''}" style="grid-template-columns:56px repeat(${n},minmax(0,1fr));--hpx:${PX}px"><div class="tg-h"></div>`;
  days.forEach((d,i)=>{const k=dkey(d);html+=`<div class="tg-h ${k===tk?'is-today':''}">${DOW[(d.getDay()+6)%7]}<b>${d.getDate()}</b></div>`});
  html+=`<div class="tg-times" style="height:${hgt}px">${Array.from({length:H1-H0},(_,i)=>i?`<span style="top:${i*PX}px">${pad(H0+i)}:00</span>`:'').join('')}</div>`;
  days.forEach(d=>{
    const k=dkey(d);
    const evs=S.appts.filter(a=>a.start.slice(0,10)===k).sort(byStart);
    const bl=S.blocks.filter(b=>b.start.slice(0,10)===k);
    let inner='';
    bl.forEach(b=>{const s=P(b.start);const m=s.getHours()*60+s.getMinutes()-H0*60;inner+=`<div class="blk" data-act="editBlock" data-id="${b.id}" style="top:${m/60*PX}px;height:${b.dur/60*PX}px">${esc(b.motivo)}</div>`});
    evs.forEach(a=>{const s=P(a.start);const m=s.getHours()*60+s.getMinutes()-H0*60;if(m<0||m>(H1-H0)*60)return;
      inner+=`<button class="ev st-${a.status} ${a.mod==='online'?'online':''} ${a.demo?'is-demo':''}" data-act="appt" data-id="${a.id}" style="top:${m/60*PX+1}px;height:${Math.max(a.dur/60*PX-3,22)}px"><span class="tm">${fmtT(s)}–${fmtT(addMin(s,a.dur))}</span><b>${esc(pname(getP(a.pid)))}</b></button>`});
    if(k===tk){const n=new Date();const m=n.getHours()*60+n.getMinutes()-H0*60;if(m>0&&m<(H1-H0)*60)inner+=`<div class="nowline" style="top:${m/60*PX}px"></div>`}
    html+=`<div class="day-col ${k===tk?'is-today':''}" data-act="slot" data-day="${k}" style="height:${hgt}px">${inner}</div>`;
  });
  return html+'</div>';
}
function monthGrid(d){
  const first=new Date(d.getFullYear(),d.getMonth(),1);const start=sow(first);const tk=dkey(new Date());
  let html=`<div class="mgrid">${DOW.map(x=>`<div class="mhead">${x}</div>`).join('')}`;
  const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const cells=Math.ceil((((first.getDay()+6)%7)+dim)/7)*7;
  for(let i=0;i<cells;i++){const c=addDays(start,i);const k=dkey(c);
    const evs=S.appts.filter(a=>a.start.slice(0,10)===k).sort(byStart);
    html+=`<button class="mcell ${c.getMonth()!==d.getMonth()?'out':''} ${k===tk?'is-today':''}" data-act="gotoDay" data-day="${k}"><span class="d">${c.getDate()}</span>${evs.slice(0,3).map(a=>`<span class="mchip st-${a.status}">${fmtT(P(a.start))} ${esc(pname(getP(a.pid)).split(' ')[0])}</span>`).join('')}${evs.length>3?`<span class="mchip muted">+${evs.length-3}</span>`:''}</button>`}
  return html+'</div>';
}
ACT.agView=d=>{ui.agView=d.v;renderAgenda()};
ACT.agNav=d=>{const n=+d.n;if(!n)ui.agDate=new Date();else{const x=new Date(ui.agDate);if(ui.agView==='dia')x.setDate(x.getDate()+n);else if(ui.agView==='semana')x.setDate(x.getDate()+7*n);else{x.setDate(1);x.setMonth(x.getMonth()+n)}ui.agDate=x}renderAgenda()};
ACT.gotoDay=d=>{ui.agDate=P(d.day+'T00:00');ui.agView='dia';renderAgenda()};
ACT.slot=(d,el,e)=>{if(Date.now()-justDragged<400)return;const r=el.getBoundingClientRect();const y=e.clientY-r.top;const stp=S.prefs.agenda.step;let m=H0*60+Math.floor(y/PX*60/stp)*stp;m=Math.min(m,H1*60-stp);openAppt(null,{day:d.day,time:`${pad(Math.floor(m/60))}:${pad(m%60)}`})};
ACT.newAppt=d=>openAppt(null,{day:d.day,time:d.time,pid:d.pid});
ACT.appt=d=>{if(Date.now()-justDragged<400)return;openAppt(d.id)};

function openAppt(id,pre={}){
  const a=id?S.appts.find(x=>x.id===id):null;
  const st=a?P(a.start):null;
  const day=a?dkey(st):pre.day||dkey(new Date());const time=a?fmtT(st):pre.time||'09:00';
  const list=S.patients.filter(p=>p.sit!=='encerrado'||(a&&a.pid===p.id)).sort((x,y)=>pname(x).localeCompare(pname(y)));
  const sel=a?a.pid:pre.pid||'';
  const p=a?getP(a.pid):null;
  modal(a?'Consulta':'Nova consulta',`<form id="f-appt" class="form" novalidate>
    <div class="field"><label for="a-pid">Paciente</label><select id="a-pid" required><option value="">Selecione…</option>${list.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(pname(p))}</option>`).join('')}</select></div>
    <div class="row3"><div class="field"><label for="a-day">Data</label><input id="a-day" type="date" value="${day}" required></div>
      <div class="field"><label for="a-time">Início</label><input id="a-time" type="time" value="${time}" step="300" required></div>
      <div class="field"><label for="a-dur">Duração (min)</label><input id="a-dur" type="number" min="10" max="240" step="5" value="${a?a.dur:S.prefs.agenda.dur}"></div></div>
    <div class="row2"><div class="field"><label for="a-mod">Modalidade</label><select id="a-mod"><option value="presencial">Presencial</option><option value="online" ${(a?a.mod:pre.mod)==='online'?'selected':''}>Teleconsulta (on-line)</option></select></div>
      <div class="field"><label for="a-st">Status</label><select id="a-st">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${(a?a.status:'agendado')===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
    <div class="field"><label for="a-note">Observação administrativa</label><input id="a-note" value="${esc(a?.note||'')}" placeholder="Não registre conteúdo clínico aqui"></div>
    ${p?`<p class="hint">Comparecimento de ${esc(pname(p))}: ${attendance(p.id)}</p>`:''}
    ${a&&a.mod==='online'&&on('teleconsulta')?inviteHtml(a):''}
    <p class="form-err" id="a-err" hidden></p>
    <div class="form-actions">${a&&a.demo&&canAdmin()?`<button type="button" class="btn danger" data-act="demoDel" data-k="appt" data-id="${a.id}">Excluir exemplo</button>`:''}${a&&canClinical()&&on('emdr')&&a.status!=='cancelado'?`<button type="button" class="btn ghost" data-act="emdrFor" data-pid="${a.pid}">Iniciar EMDR</button>`:''}${a?`<button type="button" class="btn ghost" data-act="openPatient" data-pid="${a.pid}">Abrir cadastro</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary" type="submit">Salvar</button></div>
  </form>`);
  $('#f-appt').onsubmit=e=>{e.preventDefault();
    const pid=$('#a-pid').value,dd=$('#a-day').value,tt=$('#a-time').value,dur=Math.max(10,+$('#a-dur').value||50),status=$('#a-st').value;
    const err=$('#a-err');const fail=m=>{err.textContent=m;err.hidden=false};
    if(!pid)return fail('Selecione o paciente.');if(!dd||!tt)return fail('Informe data e horário.');
    const s=P(dd+'T'+tt);
    if(status!=='cancelado'){const c=conflict(s,dur,a?.id);if(c)return fail(c+' Escolha outro horário.')}
    const rec={pid,start:isoL(s),dur,mod:$('#a-mod').value,status,note:$('#a-note').value.trim()};
    if(a){const moved=a.start!==rec.start;const stCh=a.status!==rec.status;Object.assign(a,rec);audit(moved?`Reagendamento para ${fmtD(s)} ${fmtT(s)}`:stCh?`Status da consulta: ${STATUS[status]}`:'Consulta atualizada',pid);toast(moved?'Consulta reagendada':'Consulta atualizada')}
    else{S.appts.push({id:uid(),...rec});audit(`Consulta agendada para ${fmtD(s)} ${fmtT(s)}`,pid);toast('Consulta agendada')}
    save();closeModal();route();
  };
}
function attendance(pid){const l=S.appts.filter(a=>a.pid===pid&&P(a.start)<new Date());const r=l.filter(a=>a.status==='realizado').length,c=l.filter(a=>a.status==='cancelado').length,f=l.filter(a=>a.status==='ausencia').length;return `${r} realizadas, ${c} canceladas, ${f} ausências`}

ACT.newBlock=()=>openBlock();ACT.editBlock=d=>openBlock(d.id);
function openBlock(id){const b=id?S.blocks.find(x=>x.id===id):null;const s=b?P(b.start):null;
  modal(b?'Horário bloqueado':'Bloquear horário',`<form id="f-blk" class="form">
   <div class="row3"><div class="field"><label for="b-day">Data</label><input id="b-day" type="date" value="${b?dkey(s):dkey(ui.agDate)}"></div>
   <div class="field"><label for="b-s">Início</label><input id="b-s" type="time" value="${b?fmtT(s):'12:00'}"></div>
   <div class="field"><label for="b-e">Fim</label><input id="b-e" type="time" value="${b?fmtT(addMin(s,b.dur)):'13:00'}"></div></div>
   <div class="field"><label for="b-m">Motivo</label><input id="b-m" value="${esc(b?.motivo||'')}" placeholder="Ex.: supervisão, almoço, curso"></div>
   <p class="form-err" id="b-err" hidden></p>
   <div class="form-actions">${b?`<button type="button" class="btn danger" data-act="delBlock" data-id="${b.id}">Remover bloqueio</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`);
  $('#f-blk').onsubmit=e=>{e.preventDefault();const st=P($('#b-day').value+'T'+$('#b-s').value),en=P($('#b-day').value+'T'+$('#b-e').value);const dur=Math.round((en-st)/60000);
    if(!(dur>0)){$('#b-err').textContent='O fim precisa ser depois do início.';$('#b-err').hidden=false;return}
    const clash=S.appts.find(a=>a.status!=='cancelado'&&P(a.start)<en&&addMin(P(a.start),a.dur)>st);
    if(clash){$('#b-err').textContent=`Já existe consulta de ${pname(getP(clash.pid))} às ${fmtT(P(clash.start))}. Reagende antes de bloquear.`;$('#b-err').hidden=false;return}
    const rec={start:isoL(st),dur,motivo:$('#b-m').value.trim()||'Indisponível'};if(b)Object.assign(b,rec);else S.blocks.push({id:uid(),...rec});save();closeModal();route();toast('Bloqueio salvo')}}
ACT.delBlock=d=>{S.blocks=S.blocks.filter(b=>b.id!==d.id);save();closeModal();route();toast('Bloqueio removido')};

ACT.waitlist=()=>{
  const list=S.waitlist.map(w=>`<div class="docrow"><div style="flex:1;min-width:0"><b>${esc(w.nome)}</b><br><span class="muted" style="font-size:.84rem">${esc(w.tel)} · ${esc(w.pref||'sem preferência')} · desde ${fmtD(new Date(w.created))}</span></div><button class="btn sm" data-act="wlConvert" data-id="${w.id}">Cadastrar paciente</button><button class="btn sm ghost" data-act="wlDel" data-id="${w.id}">Remover</button></div>`).join('')||'<p class="empty">Lista vazia.</p>';
  modal('Lista de espera',`<div class="doclist">${list}</div>
   <form id="f-wl" class="form" style="margin-top:18px"><div class="eyebrow">Adicionar</div><div class="row3"><div class="field"><label for="w-n">Nome</label><input id="w-n" required></div><div class="field"><label for="w-t">Telefone</label><input id="w-t"></div><div class="field"><label for="w-p">Preferência de horário</label><input id="w-p"></div></div>
   <div class="form-actions"><span class="sp"></span><button class="btn primary">Adicionar à lista</button></div></form>`,true);
  $('#f-wl').onsubmit=e=>{e.preventDefault();const n=$('#w-n').value.trim();if(!n)return;S.waitlist.push({id:uid(),nome:n,tel:$('#w-t').value.trim(),pref:$('#w-p').value.trim(),created:Date.now()});save();ACT.waitlist();route()}};
ACT.wlDel=d=>{S.waitlist=S.waitlist.filter(w=>w.id!==d.id);save();ACT.waitlist();route()};
ACT.wlConvert=d=>{const w=S.waitlist.find(x=>x.id===d.id);closeModal();openPatientForm(null,{nome:w.nome.replace(/\s*\(fictício\)/,''),tel:w.tel,sit:'espera'},()=>{S.waitlist=S.waitlist.filter(x=>x.id!==d.id);save()})};

/* =========================================================
   PACIENTES E PRONTUÁRIO
   ========================================================= */
function renderPacientes(){
  const q=ui.q.trim().toLowerCase();
  const ord={ativo:0,espera:1,encerrado:2};
  const list=S.patients.filter(p=>(ui.sitF==='todos'||p.sit===ui.sitF)&&(!q||(p.nome+' '+p.social).toLowerCase().includes(q))).sort((a,b)=>ord[a.sit]-ord[b.sit]||pname(a).localeCompare(pname(b)));
  const p=ui.pid?getP(ui.pid):null;
  $('#view').innerHTML=`<div class="view-in">
  <div class="page-head"><div><div class="eyebrow">Cadastro e prontuário eletrônico</div><h1>Pacientes</h1></div><span class="sp"></span><button class="btn primary" data-act="newPatient">Novo paciente</button></div>
  ${howto('Como funciona o prontuário',`<ul><li><b>Cadastro</b>: contatos, responsável legal e termos. Visível também para a recepção.</li><li><b>Registro clínico</b>: anamnese, queixa, objetivos e plano. Cada gravação guarda a versão anterior.</li><li><b>Evoluções</b> e <b>EMDR</b>: rascunhos podem ser editados; registros finalizados só recebem adendos, e o original fica preservado.</li><li><b>Auditoria</b>: quem abriu ou alterou o prontuário, e quando.</li><li>Use o menu <b>Ações</b> do paciente para criar registros sem trocar de aba.</li></ul>`)}
  <div class="pt-wrap ${p?'has-sel':''}">
    <div class="pt-list">
      <input class="search" id="pt-q" type="search" placeholder="Buscar por nome ou nome social" value="${esc(ui.q)}" aria-label="Buscar paciente">
      <div class="seg" role="group" aria-label="Filtrar por situação" style="align-self:flex-start">${[['todos','Todos'],['ativo','Ativos'],['espera','Espera'],['encerrado','Encerrados']].map(([k,l])=>`<button data-act="sitF" data-v="${k}" aria-pressed="${ui.sitF===k}">${l}</button>`).join('')}</div>
      <div class="pt-items">${list.map(x=>`<button class="pt-item" data-act="openPatient" data-pid="${x.id}" aria-current="${x.id===ui.pid}"><span class="nm"><span>${esc(pname(x))}</span><span class="pill ${x.sit}">${x.sit==='ativo'?'Ativo':x.sit==='espera'?'Espera':'Encerrado'}</span>${x.demo?DEMOS:''}</span><span class="meta">${age(x.nasc)} anos${x.social?' · nome social':''}${x.resp?' · com responsável':''}</span></button>`).join('')||'<p class="empty" style="padding:14px">Nenhum paciente encontrado.</p>'}</div>
    </div>
    <div class="pt-detail">${p?patientDetail(p):`<div class="locked"><h2>Selecione um paciente</h2><p class="muted" style="margin:0">O prontuário abre aqui, com cadastro, registro clínico, evoluções e registros de EMDR.</p></div>`}</div>
  </div></div>`;
  const qi=$('#pt-q');qi.oninput=()=>{ui.q=qi.value;const pos=qi.selectionStart;renderPacientes();const n=$('#pt-q');n.focus();n.setSelectionRange(pos,pos)};
}
ACT.sitF=d=>{ui.sitF=d.v;renderPacientes()};
ACT.openPatient=d=>{ui.pid=d.pid;ui.ptab='cadastro';closeModal();audit('Abertura do cadastro',d.pid);if(current!=='pacientes')go('pacientes');else renderPacientes()};
ACT.backList=()=>{ui.pid=null;renderPacientes()};
ACT.ptab=d=>{ui.ptab=d.t;if(['clinico','evol','emdr','rel','audit'].includes(d.t)){if(canClinical())audit(`Acesso ao prontuário: ${({clinico:'registro clínico',evol:'evoluções',emdr:'registros EMDR',rel:'relatórios psicológicos',audit:'auditoria'})[d.t]}`,ui.pid);else audit('Tentativa de acesso ao prontuário clínico (negada)',ui.pid,true)}renderPacientes()};

function patientDetail(p){
  const tabs=[['cadastro','Cadastro',false],['clinico','Registro clínico',true],['evol','Evoluções',true],['emdr','EMDR',true],['rel','Relatórios',true],['audit','Auditoria',true]];
  let body='';
  const t=ui.ptab;
  if(tabs.find(x=>x[0]===t)[2]&&!canClinical())body=`<div class="locked"><span class="eyebrow">Acesso restrito</span><h2>Conteúdo clínico protegido</h2><p class="muted" style="margin:0;max-width:52ch">Os perfis Recepção e Administrador acessam agenda, cadastro e dados administrativos. Registros clínicos são exclusivos da psicóloga responsável. Esta tentativa ficou registrada na auditoria.</p></div>`;
  else body=({cadastro:tabCadastro,clinico:tabClinico,evol:tabEvol,emdr:tabEmdr,rel:tabRel,audit:tabAudit})[t](p);
  return `<div class="stack">
    <div class="pt-head"><button class="btn sm ghost back-btn" data-act="backList">‹ Lista</button>
      <div style="flex:1;min-width:0"><h1 style="font-size:1.7rem">${esc(pname(p))}</h1><div class="civil">${p.social?`Nome civil: ${esc(p.nome)} · `:''}${age(p.nasc)} anos · desde ${fmtD(new Date(p.created))} · <span class="pill ${p.sit}">${SIT[p.sit]}</span>${p.demo?' '+DEMOP:''}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${p.demo&&canAdmin()?`<button class="btn danger" data-act="demoDel" data-k="patient" data-id="${p.id}">Excluir exemplo</button>`:''}${canClinical()&&on('emdr')&&p.sit!=='encerrado'?`<button class="btn primary" data-act="emdrFor" data-pid="${p.id}">Iniciar EMDR</button>`:''}${canClinical()?dd('Documentos',Object.entries(DOCS_CLIN).map(([k,v])=>({label:v.label,hint:v.hint,act:'docOpen',data:{k,pid:p.id}}))):''}${dd('Ações',patientMenu(p))}</div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l,c])=>`<button role="tab" aria-selected="${t===k}" data-act="ptab" data-t="${k}">${l}${c&&!canClinical()?' <span class="lock" aria-label="restrito">🔒</span>':''}</button>`).join('')}</div>
    ${body}</div>`;
}
function patientMenu(p){const m=on('agenda')?[{label:'Agendar consulta',hint:'Abre uma nova consulta com este paciente já selecionado',act:'newAppt',data:{pid:p.id}}]:[];
  if(canClinical())m.push('-',{label:'Nova evolução',hint:'Registro da sessão, salvo como rascunho ou finalizado',act:'pNew',data:{k:'evol'}},{label:'Novo registro EMDR',hint:'Fase, alvo, cognições, VOC e SUD',act:'pNew',data:{k:'emdr'}});
  if(canClinical()&&on('anotacoes'))m.push({label:'Nova anotação',hint:'Nota livre vinculada a este paciente, fora do prontuário',act:'pNew',data:{k:'note'}});
  m.push('-',{label:'Editar cadastro',hint:'Contatos, responsável legal e situação do acompanhamento',act:'editPatient',data:{pid:p.id}});return m}
ACT.pNew=d=>{if(d.k==='note'){openNote(null,{pid:ui.pid,cat:'Sessão'});return}ui.ptab=d.k;renderPacientes();d.k==='evol'?openEvol():openEmdrRec()};
function tabCadastro(p){
  const past=S.appts.filter(a=>a.pid===p.id).sort((a,b)=>b.start.localeCompare(a.start)).slice(0,8);
  const minor=age(p.nasc)<18;
  return `<section class="panel"><div class="panel-head"><h2>Dados cadastrais</h2><span class="sp"></span><button class="btn sm" data-act="editPatient" data-pid="${p.id}">Editar</button></div>
   <dl class="kv">
    <div><dt>Nome completo</dt><dd>${esc(p.nome)}</dd></div><div><dt>Nome social</dt><dd>${esc(p.social)||'—'}</dd></div>
    <div><dt>Data de nascimento</dt><dd>${fmtD(P(p.nasc+'T00:00'))} (${age(p.nasc)} anos)</dd></div><div><dt>Situação</dt><dd>${SIT[p.sit]}</dd></div>
    <div><dt>Telefone</dt><dd>${esc(p.tel)||'—'}</dd></div><div><dt>E-mail</dt><dd>${esc(p.email)||'—'}</dd></div>
    <div><dt>Contato de emergência</dt><dd>${esc(p.emerg)||'—'}</dd></div><div><dt>Responsável legal</dt><dd>${esc(p.resp)||(minor?'<span style="color:var(--bad)">Obrigatório para menor de idade</span>':'Não se aplica')}</dd></div>
   </dl></section>
  <section class="panel"><h2>Documentos e consentimentos</h2><div class="doclist">${DOCS.filter(([k])=>k!=='resp'||minor||p.resp).map(([k,l])=>{const v=p.docs?.[k];return `<div class="docrow"><span style="flex:1;min-width:0">${l}</span>${v?`<span class="pill finalizado">Assinado em ${fmtD(new Date(v))}</span><button class="btn sm ghost" data-act="docToggle" data-k="${k}">Desfazer</button>`:`<span class="pill rascunho">Pendente</span><button class="btn sm" data-act="docToggle" data-k="${k}">Registrar assinatura</button>`}</div>`}).join('')}</div>
   <p class="hint">Na fase 2, o paciente assina pelo portal. Aqui a psicóloga registra assinaturas colhidas presencialmente.</p></section>
  <section class="panel"><h2>Histórico de atendimentos</h2><p class="hint">${attendance(p.id)}</p><div class="alist">${past.length?past.map(a=>apptRow(a,true)).join(''):'<p class="empty">Sem consultas.</p>'}</div></section>`;
}
ACT.docToggle=d=>{const p=getP(ui.pid);p.docs=p.docs||{};const on=!p.docs[d.k];p.docs[d.k]=on?Date.now():null;audit(`${on?'Registro':'Remoção'} de assinatura: ${DOCS.find(x=>x[0]===d.k)[1]}`,p.id);save();renderPacientes()};

ACT.newPatient=()=>openPatientForm();
ACT.editPatient=d=>openPatientForm(d.pid);
function openPatientForm(id,pre={},after){
  const p=id?getP(id):{nome:'',social:'',nasc:'',tel:'',email:'',emerg:'',resp:'',sit:'ativo',...pre};
  modal(id?'Editar cadastro':'Novo paciente',`<form id="f-pt" class="form" novalidate>
   <div class="row2"><div class="field"><label for="pf-nome">Nome completo</label><input id="pf-nome" value="${esc(p.nome)}" required></div><div class="field"><label for="pf-social">Nome social</label><input id="pf-social" value="${esc(p.social)}" placeholder="Usado em toda a interface"></div></div>
   <div class="row3"><div class="field"><label for="pf-nasc">Nascimento</label><input id="pf-nasc" type="date" value="${p.nasc}"></div><div class="field"><label for="pf-tel">Telefone</label><input id="pf-tel" value="${esc(p.tel)}"></div><div class="field"><label for="pf-sit">Situação</label><select id="pf-sit">${Object.entries(SIT).map(([k,v])=>`<option value="${k}" ${p.sit===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
   <div class="field"><label for="pf-email">E-mail</label><input id="pf-email" type="email" value="${esc(p.email)}"></div>
   <div class="field"><label for="pf-emerg">Contato de emergência</label><input id="pf-emerg" value="${esc(p.emerg)}" placeholder="Nome, vínculo e telefone"></div>
   <div class="field"><label for="pf-resp">Responsável legal</label><input id="pf-resp" value="${esc(p.resp)}" placeholder="Obrigatório para menores de 18 anos"></div>
   <p class="hint">Use apenas dados fictícios nesta demonstração.</p>
   <p class="form-err" id="pf-err" hidden></p>
   <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`,true);
  $('#f-pt').onsubmit=e=>{e.preventDefault();const v=k=>$('#pf-'+k).value.trim();const err=$('#pf-err');
    if(!v('nome')){err.textContent='Informe o nome completo.';err.hidden=false;return}
    if(!v('nasc')){err.textContent='Informe a data de nascimento.';err.hidden=false;return}
    if(age(v('nasc'))<18&&!v('resp')){err.textContent='Paciente menor de idade: informe o responsável legal.';err.hidden=false;return}
    const rec={nome:v('nome'),social:v('social'),nasc:v('nasc'),tel:v('tel'),email:v('email'),emerg:v('emerg'),resp:v('resp'),sit:$('#pf-sit').value};
    if(id){Object.assign(getP(id),rec);audit('Cadastro atualizado',id)}
    else{const np={id:uid(),...rec,created:Date.now(),docs:{}};S.patients.push(np);ui.pid=np.id;ui.ptab='cadastro';audit('Paciente cadastrado',np.id)}
    save();after&&after();closeModal();toast('Cadastro salvo');if(current!=='pacientes')go('pacientes');else renderPacientes()};
}

function tabClinico(p){
  const c=S.clinical[p.id]||{fields:{},history:[]};
  return `<section class="panel"><div class="panel-head"><h2>Registro clínico</h2><span class="sp"></span><span class="hint">${c.updated?`Última alteração ${fmtDT(c.updated)} · ${esc(c.by)}`:'Ainda não preenchido'}</span></div>

function sudChart(recs){
  const pts=recs.filter(r=>r.sudi!==''||r.sudf!=='').sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
  if(pts.length<2)return'';
  const W=520,H=150,l=34,rgt=14,t=12,b=30;const n=pts.length;const x=i=>l+(n===1?0:i*(W-l-rgt)/(n-1));const y=v=>t+(10-v)*(H-t-b)/10;
  const line=(k,cls)=>{const a=pts.map((r,i)=>r[k]===''?null:[x(i),y(+r[k])]).filter(Boolean);if(!a.length)return'';return `<polyline points="${a.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${cls}" stroke-width="2" ${k==='sudi'?'stroke-dasharray="4 4"':''}/>${a.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===a.length-1?4.5:3}" fill="${cls}"/>`).join('')}`};
  return `<section class="panel"><div class="panel-head"><h2>Escala SUD ao longo das sessões</h2><span class="sp"></span><span class="legend"><span style="color:var(--sage)">- - SUD inicial</span><span style="color:var(--accent)">— SUD final</span></span></div>
  <div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="SUD inicial e final por sessão">
   ${[0,2,4,6,8,10].map(v=>`<line x1="${l}" x2="${W-rgt}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`).join('')}
   ${pts.map((r,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${r.date.slice(8,10)}/${r.date.slice(5,7)}</text>`).join('')}
   ${line('sudi','var(--sage)')}${line('sudf','var(--accent)')}
  </svg></div><p class="hint">Apenas os valores registrados pela psicóloga. O sistema não interpreta nem sugere condutas.</p></section>`;
}

   <div class="field">${info('e-fase','Fase','As oito fases do modelo EMDR: 1 história clínica e planejamento, 2 preparação, 3 avaliação, 4 dessensibilização, 5 instalação, 6 escaneamento corporal, 7 fechamento, 8 reavaliação. Selecione a fase trabalhada nesta sessão.')}<select id="e-fase"><option value="">Selecione…</option>${FASES.map((f,i)=>`<option value="${i+1}" ${r&&+r.fase===i+1?'selected':''}>${i+1}. ${f}</option>`).join('')}</select></div></div>
   <div class="field">${info('e-alvo','Alvo terapêutico','A memória ou situação escolhida para processamento, descrita como a profissional julgar adequado.')}<textarea id="e-alvo" rows="2">${o('alvo')}</textarea></div>
   <div class="row2"><div class="field">${info('e-cn','Cognição negativa','Crença negativa sobre si associada ao alvo, nas palavras do paciente.')}<input id="e-cn" value="${o('cn')}"></div><div class="field">${info('e-cp','Cognição positiva','Crença positiva desejada sobre si, nas palavras do paciente.')}<input id="e-cp" value="${o('cp')}"></div></div>

   <div class="row2"><div class="field"><label for="e-emo">Emoções associadas</label><input id="e-emo" value="${o('emo')}"></div><div class="field"><label for="e-sens">Sensações corporais</label><input id="e-sens" value="${o('sens')}"></div></div>
   <div class="field"><label for="e-obs">Observações sobre o processamento</label><textarea id="e-obs" rows="3">${o('obs',preObs||'')}</textarea></div>

  const store=fin=>{const g=k=>$('#e-'+k).value.trim();
    if(fin&&!g('fase')){toast('Informe a fase antes de finalizar');return}

    rec.history.push({ts:Date.now(),who:me().name,action:fin?'Finalizado':'Rascunho salvo'});

  $('#e-draft').onclick=()=>store(false);$('#f-er').onsubmit=e=>{e.preventDefault();store(true)};

        <div class="field" id="w-limit" ${c.mode!=='passagens'?'hidden':''}><label for="c-limit">Passagens por set</label><input id="c-limit" type="number" min="2" max="400" step="2" value="${c.limit}"></div>
        <div class="field" id="w-secs" ${c.mode!=='tempo'?'hidden':''}><label for="c-secs">Segundos por set</label><input id="c-secs" type="number" min="5" max="600" step="5" value="${c.secs}"></div>

        <p class="hint">Use fones de ouvido para perceber a alternância. Estimulação tátil depende de dispositivo externo e fica para integração futura.</p>

  emdrMount();
}
function rangeH(id,label,min,max,step,val,unit,tip){const t='t-'+id;return `<div class="range"><div class="top"><span class="lab-row"><label for="${id}">${label}</label>${tip?`<button type="button" class="info-btn" data-act="info" data-t="${t}" aria-expanded="false" aria-label="O que é ${label}?">?</button>`:''}</span><span class="mono" id="${id}-v">${val} ${unit}</span></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}">${tip?`<p class="explain" id="${t}" hidden>${tip}</p>`:''}</div>`}

function emdrMount(){
  E.stage=$('#stage');E.cv=$('#cv');E.g=E.cv.getContext('2d');
  const fit=()=>{E.dpr=Math.min(window.devicePixelRatio||1,2);E.cv.width=Math.round(E.stage.clientWidth*E.dpr);E.cv.height=Math.round(E.stage.clientHeight*E.dpr)};
  fit();E.ro=new ResizeObserver(fit);E.ro.observe(E.stage);
  $('#ctrl').addEventListener('input',readCfg);$('#ctrl').addEventListener('change',readCfg);
  $('#c-pid').addEventListener('change',e=>{ui.emdrPid=e.target.value});
  $('#c-notes').addEventListener('input',e=>{S.sessNotes=e.target.value;clearTimeout(E.nt);E.nt=setTimeout(save,400)});
  E.stage.addEventListener('pointermove',showHud);E.stage.addEventListener('pointerdown',showHud);
  E.fsH=()=>{const on=document.fullscreenElement===E.stage||E.stage.classList.contains('immersive');E.stage.classList.toggle('is-fs',on);if(on)showHud()};
  document.addEventListener('fullscreenchange',E.fsH);
  E.keyH=e=>{if(current!=='emdr'||!$('#modal').hidden)return;const tag=(e.target.tagName||'').toLowerCase();
    if(e.code==='Space'){if(['input','select','textarea','button'].includes(tag))return;e.preventDefault();eToggle()}
    if(e.key==='Escape'){if(E.stage.classList.contains('immersive')){exitFs()}else if(E.running)emdrStop('interrompido')}};
  document.addEventListener('keydown',E.keyH);
  renderPresets();renderSetLog();updateCfgLabels();updateTransport();
  E.lastTs=0;cancelAnimationFrame(E.raf);E.raf=requestAnimationFrame(frame);
}
function emdrTeardown(){
  if(E.running)finishSet('interrompido',true);
  cancelAnimationFrame(E.raf);E.raf=0;E.ro&&E.ro.disconnect();E.ro=null;
  if(E.keyH)document.removeEventListener('keydown',E.keyH);if(E.fsH)document.removeEventListener('fullscreenchange',E.fsH);
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  E.stage=null;E.cv=null;releaseWake();
}
function readCfg(e){
  const c=S.cfg;const n=id=>+$('#'+id).value;
  c.ppm=n('c-ppm');c.amp=n('c-amp');c.size=n('c-size');c.motion=$('#c-motion').value;if($('#c-shape'))c.shape=$('#c-shape').value;c.mode=$('#c-mode').value;
  c.limit=Math.max(2,n('c-limit')||30);c.secs=Math.max(5,n('c-secs')||30);c.audio=$('#c-audio').checked;c.vol=n('c-vol');c.tone=n('c-tone');
  if(e&&e.target.id==='c-dot'){c.dot=e.target.value;markSw()}
  if(e&&e.target.id==='c-bg'){c.bg=e.target.value;markSw()}
  $('#w-limit').hidden=c.mode!=='passagens';$('#w-secs').hidden=c.mode!=='tempo';
  if(e&&e.target.id==='c-audio'&&c.audio)ensureAudio();
  updateCfgLabels();clearTimeout(readCfg._t);readCfg._t=setTimeout(save,300);
}
function updateCfgLabels(){
  $$('#ctrl input[type=range]').forEach(r=>{$('#'+r.id+'-v').textContent=`${r.value} ${r.dataset.unit}`});
  const s=60/S.cfg.ppm;$('#c-ppm-h').textContent=`Uma passagem a cada ${s.toFixed(2).replace('.',',')} s · ${(S.cfg.ppm/2).toFixed(0)} ciclos por minuto`;
}
function markSw(){$$('[data-act=eDot]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c.toUpperCase()===S.cfg.dot.toUpperCase()));$$('[data-act=eBg]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c.toUpperCase()===S.cfg.bg.toUpperCase()));$('#c-dot').value=S.cfg.dot;$('#c-bg').value=S.cfg.bg}
ACT.eDot=d=>{S.cfg.dot=d.c;markSw();save()};
ACT.eBg=d=>{S.cfg.bg=d.c;markSw();save()};
function applyCfgToControls(){const c=S.cfg;['ppm','amp','size','limit','secs','vol','tone'].forEach(k=>$('#c-'+k).value=c[k]);$('#c-motion').value=c.motion;$('#c-mode').value=c.mode;$('#c-audio').checked=c.audio;markSw();readCfg()}
ACT.ePreset=d=>{const p=BUILTIN.find(x=>x.id===d.id)||S.presets.find(x=>x.id===d.id);if(!p)return;const {id,name,...rest}=p;Object.assign(S.cfg,rest);applyCfgToControls();save();toast(`Configuração “${p.name}” aplicada`)};

ACT.eDelPreset=(d,b,e)=>{e.stopPropagation();S.presets=S.presets.filter(x=>x.id!==d.id);save();renderPresets()};
function renderPresets(){const el=$('#mypresets');if(!el)return;el.innerHTML=S.presets.length?S.presets.map(p=>`<span class="preset"><span data-act="ePreset" data-id="${p.id}" role="button" tabindex="0">${esc(p.name)}</span><span class="x" data-act="eDelPreset" data-id="${p.id}" role="button" aria-label="Excluir ${esc(p.name)}" tabindex="0">×</span></span>`).join(''):'<span class="hint">Nenhuma salva ainda.</span>'}

function eToggle(){
  if(!E.running){E.running=true;E.paused=false;E.phase=0;E.passes=0;E.setMs=0;E.ending=false;if(!E.sessionStart)E.sessionStart=Date.now();if(S.cfg.audio){ensureAudio();beep(-1)}requestWake()}
  else E.paused=!E.paused;
  updateTransport();
}
ACT.eToggle=()=>eToggle();
ACT.eStop=()=>emdrStop('interrompido');
function emdrStop(reason){if(E.running)finishSet(reason)}
function finishSet(reason,silent){
  E.sets.push({ts:Date.now(),durMs:Math.round(E.setMs),passes:E.passes,ppm:S.cfg.ppm,motion:S.cfg.motion,reason});
  E.running=false;E.paused=false;E.ending=false;releaseWake();
  if(!silent){updateTransport();renderSetLog()}
}
function updateTransport(){
  const t=$('#b-toggle');if(!t)return;
  const lab=!E.running?'Iniciar set':E.paused?'Retomar':'Pausar';t.textContent=lab;$('#fh-toggle').textContent=!E.running?'Iniciar':E.paused?'Retomar':'Pausar';
  $('#b-stop').disabled=!E.running;
  const st=$('#h-state');st.className='state '+(E.running?(E.paused?'pause':'run'):'');st.textContent=E.running?(E.paused?'Pausado':'Em estimulação'):(E.sets.length?'Set encerrado':'Pronto');
  $('#st-idle').hidden=E.running;
}
function renderSetLog(){const el=$('#setlog');if(!el)return;
  el.innerHTML=E.sets.length?`<div class="setlog">${E.sets.map((s,i)=>`<div><span class="mono muted">${i+1}</span><span>${s.passes} passagens · ${fmtDur(s.durMs)} · ${s.ppm}/min</span><span class="pill ${s.reason==='concluído'?'finalizado':'rascunho'}">${s.reason}</span></div>`).join('')}</div>`:'<p class="empty">Nenhum set realizado. Os sets aparecem aqui e podem ser anexados a um registro EMDR em rascunho.</p>';
  const a=$('#b-attach');if(a)a.disabled=!E.sets.length;
}
ACT.eNewSession=(d,b)=>{if(E.running)return toast('Interrompa o set atual primeiro');
  if(E.sets.length&&!b.dataset.arm){b.dataset.arm=1;b.textContent='Descartar sets e reiniciar?';setTimeout(()=>{delete b.dataset.arm;b.textContent='Nova sessão'},3500);return}
  delete b.dataset.arm;b.textContent='Nova sessão';S.sessNotes='';$('#c-notes').value='';save();E.sets=[];E.sessionStart=null;E.setMs=0;E.passes=0;E.phase=0;renderSetLog();updateTransport();toast('Sessão reiniciada')};
ACT.eAttach=()=>{if(E.running)return toast('Interrompa o set atual primeiro');const pid=$('#c-pid').value;if(!pid){toast('Selecione o paciente para anexar');$('#c-pid').focus();return}
  if(!E.sets.length)return;const sets=E.sets.slice();const notes=S.sessNotes||'';S.sessNotes='';E.sets=[];E.sessionStart=null;save();
  ui.pid=pid;ui.ptab='emdr';audit('Sets de estimulação anexados a novo registro EMDR',pid);go('pacientes');setTimeout(()=>openEmdrRec(null,sets,notes),60)};

ACT.eFs=()=>enterFs();ACT.eExitFs=()=>exitFs();
async function enterFs(){const st=E.stage;try{if(st.requestFullscreen){await st.requestFullscreen();return}if(st.webkitRequestFullscreen){st.webkitRequestFullscreen();return}throw 0}catch(e){st.classList.add('immersive');E.fsH()}}
function exitFs(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(E.stage){E.stage.classList.remove('immersive');E.fsH()}}
function showHud(){if(!E.stage)return;E.stage.classList.add('hud-on');clearTimeout(E.hudTimer);E.hudTimer=setTimeout(()=>E.stage&&E.stage.classList.remove('hud-on'),2600)}
async function requestWake(){try{if(navigator.wakeLock)E.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{E.wl&&E.wl.release()}catch(e){}E.wl=null}
function ensureAudio(){try{if(!E.actx)E.actx=new(window.AudioContext||window.webkitAudioContext)();if(E.actx.state==='suspended')E.actx.resume()}catch(e){}}
function beep(side){const c=S.cfg;if(!c.audio||!E.actx||c.vol<=0)return;try{const a=E.actx,t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=c.tone;const v=Math.max(0.0002,c.vol/100*0.5);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);o.connect(g);
  if(a.createStereoPanner){const p=a.createStereoPanner();p.pan.value=side;g.connect(p);p.connect(a.destination)}else g.connect(a.destination);o.start(t);o.stop(t+0.2)}catch(e){}}
ACT.eTestAudio=()=>{ensureAudio();const was=S.cfg.audio;S.cfg.audio=true;beep(-1);setTimeout(()=>{beep(1);S.cfg.audio=was},450)};

function frame(ts){
  const dt=E.lastTs?Math.min(ts-E.lastTs,100):0;E.lastTs=ts;const c=S.cfg;
  if(E.running&&!E.paused){
    const prev=E.phase;E.phase+=dt/(60000/c.ppm);E.setMs+=dt;
    const n=Math.floor(E.phase)-Math.floor(prev);
    for(let i=0;i<n;i++){E.passes++;beep(E.passes%2?1:-1)}
    if(c.mode==='tempo'&&E.setMs>=c.secs*1000)E.ending=true;
    if((c.mode==='passagens'&&E.passes>=c.limit)||(E.ending&&n>0)){E.phase=E.passes;finishSet('concluído')}
  }
  draw();
  if(ts-E.hudT>90){E.hudT=ts;hud()}
  if(E.cv)E.raf=requestAnimationFrame(frame);
}
function draw(){
  const cv=E.cv;if(!cv||!cv.width)return;const g=E.g,W=cv.width,H=cv.height,d=E.dpr,c=S.cfg;
  g.fillStyle=c.bg;g.fillRect(0,0,W,H);
  const p=E.phase;let pos;
  if(c.motion==='linear'){const f=((p%2)+2)%2;pos=f<1?-1+2*f:3-2*f}else pos=-Math.cos(Math.PI*p);
  const r=c.size/2*d;const span=Math.max(0,(W/2-r-14*d))*(c.amp/100);
  const x=W/2+pos*span,y=H/2;
  drawDot(g,c,x,y,r);
}
function hud(){
  if(!$('#h-set'))return;const set=fmtDur(E.setMs);
  $('#h-set').textContent=set;$('#h-pass').textContent=E.passes;$('#h-cyc').textContent=Math.floor(E.passes/2);
  $('#h-sess').textContent=E.sessionStart?fmtDur(Date.now()-E.sessionStart):'00:00';
  $('#fh-set').textContent=set;$('#fh-pass').textContent=`${E.passes} passagens`;
  if(!E.running&&$('#b-stop')&&!$('#b-stop').disabled)updateTransport();
}

function bindDrag(){if(!S.prefs.agenda.drag)return;$$('.tg .ev[data-id]').forEach(el=>el.addEventListener('pointerdown',e=>startDrag(e,el)))}
function startDrag(e,el){
  if(e.pointerType==='touch'||e.button!==0)return;
  const a=S.appts.find(x=>x.id===el.dataset.id);if(!a)return;
  const r=el.getBoundingClientRect();const D={x0:e.clientX,y0:e.clientY,off:e.clientY-r.top,moved:false,ghost:null,target:null};
  const move=ev=>{
    if(!D.moved){if(Math.hypot(ev.clientX-D.x0,ev.clientY-D.y0)<6)return;D.moved=true;el.classList.add('dragging');D.ghost=el.cloneNode(true);D.ghost.classList.remove('dragging');D.ghost.classList.add('ev-ghost');D.ghost.removeAttribute('data-act');D.ghost.removeAttribute('data-id')}
    const col=$$('.tg .day-col').find(c=>{const cr=c.getBoundingClientRect();return ev.clientX>=cr.left&&ev.clientX<cr.right});if(!col)return;
    const cr=col.getBoundingClientRect();const stp=S.prefs.agenda.step;
    let m=H0*60+Math.round(((ev.clientY-D.off-cr.top)/PX*60)/stp)*stp;m=Math.max(H0*60,Math.min(m,H1*60-stp));
    if(D.ghost.parentNode!==col)col.appendChild(D.ghost);D.ghost.style.top=((m-H0*60)/60*PX+1)+'px';
    const s=P(`${col.dataset.day}T${pad(Math.floor(m/60))}:${pad(m%60)}`);D.target=s;
    const c=a.status==='cancelado'?null:conflict(s,a.dur,a.id);D.ghost.classList.toggle('bad',!!c);
    const tm=D.ghost.querySelector('.tm');if(tm)tm.textContent=`${fmtT(s)}–${fmtT(addMin(s,a.dur))}`};
  const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
    if(!D.moved)return;justDragged=Date.now();const s=D.target;
    if(!s||isoL(s)===a.start){renderAgenda();return}
    if(a.status==='realizado'){toast('Consultas realizadas não podem ser movidas.');renderAgenda();return}
    const c=a.status==='cancelado'?null:conflict(s,a.dur,a.id);if(c){toast(c);renderAgenda();return}
    a.start=isoL(s);audit(`Reagendamento (arrastar) para ${fmtD(s)} ${fmtT(s)}`,a.pid);save();renderAgenda();toast(`Reagendada para ${fmtD(s)} às ${fmtT(s)}`)};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);e.preventDefault();
}

function ocupacao(mk){const[y,m]=mk.split('-').map(Number);const a=S.prefs.agenda;const dim=new Date(y,m,0).getDate();let avail=0;
  for(let d=1;d<=dim;d++){const dt=new Date(y,m-1,d);if(!a.days.includes(dt.getDay()))continue;avail+=(a.end-a.start)*60;const k=dkey(dt);S.blocks.filter(b=>b.start.slice(0,10)===k).forEach(b=>avail-=b.dur)}
  const used=S.appts.filter(x=>x.start.slice(0,7)===mk&&x.status!=='cancelado').reduce((s,x)=>s+x.dur,0);return avail>0?Math.round(used/avail*100):0}
function finMonth(mk){const F=S.fin;const paid=F.charges.filter(c=>c.status==='pago'&&(c.paidAt||'').slice(0,7)===mk);
  const pend=F.charges.filter(c=>c.status==='pendente');const late=pend.filter(isLate);const exp=F.expenses.filter(e=>e.date.slice(0,7)===mk);
  const fat=F.charges.filter(c=>c.date.slice(0,7)===mk&&c.status!=='isento');
  return{recebido:fsum(paid),aReceber:fsum(pend)-fsum(late),atraso:fsum(late),nAtraso:late.length,despesas:fsum(exp),faturado:fsum(fat),resultado:fsum(paid)-fsum(exp),ocup:ocupacao(mk),nSess:fat.length}}
function extenso(v){const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],ce=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const t3=n=>{if(!n)return'';if(n===100)return'cem';const p=[];const C=Math.floor(n/100),r=n%100;if(C)p.push(ce[C]);if(r){if(r<20)p.push(u[r]);else{const D=Math.floor(r/10),U=r%10;p.push(U?dz[D]+' e '+u[U]:dz[D])}}return p.join(' e ')};
  const re=Math.floor(v+1e-9),ct=Math.round((v-re)*100);const parts=[];
  if(re){const mil=Math.floor(re/1000),r=re%1000;let s=mil?(mil===1?'mil':t3(mil)+' mil'):'';if(r)s+=(s?((r<100||r%100===0)?' e ':' '):'')+t3(r);parts.push(s+(re===1?' real':' reais'))}
  if(ct)parts.push(t3(ct)+(ct===1?' centavo':' centavos'));return parts.join(' e ')||'zero reais'}
const niceStep=x=>{const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p};
const kfmt=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v));
function finChart(){const[y,m]=fm.split('-').map(Number);const ms=[];for(let i=3;i>=0;i--)ms.push(dkey(new Date(y,m-1-i,1)).slice(0,7));
  const data=ms.map(k=>{const f=finMonth(k);return{k,r:f.recebido,e:f.despesas}});const max=Math.max(100,...data.flatMap(x=>[x.r,x.e]));const stp=niceStep(max/4);const top=Math.ceil(max/stp)*stp;
  const W=560,H=210,l=56,rr=10,t=12,b=30;const cw=(W-l-rr)/data.length;const bw=Math.min(34,cw*.28);const yv=v=>t+(1-v/top)*(H-t-b);
  let g='';for(let v=0;v<=top+1e-6;v+=stp)g+=`<line x1="${l}" x2="${W-rr}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)"/><text x="${l-8}" y="${yv(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${kfmt(v)}</text>`;
  data.forEach((d,i)=>{const x=l+i*cw+cw/2;const cur=d.k===fm;const mm=+d.k.slice(5,7);
    g+=`<rect x="${x-bw-2}" y="${yv(d.r)}" width="${bw}" height="${Math.max(0,yv(0)-yv(d.r))}" rx="3" fill="var(--accent)" opacity="${cur?1:.6}"><title>Recebido: ${brl(d.r)}</title></rect><rect x="${x+2}" y="${yv(d.e)}" width="${bw}" height="${Math.max(0,yv(0)-yv(d.e))}" rx="3" fill="var(--gold)" opacity="${cur?1:.6}"><title>Despesas: ${brl(d.e)}</title></rect><text x="${x}" y="${H-10}" text-anchor="middle" font-size="12" fill="${cur?'var(--ink)':'var(--muted)'}" font-weight="${cur?700:400}">${MES[mm-1].slice(0,3)}/${d.k.slice(2,4)}</text>`});
  return `<section class="panel"><div class="panel-head"><h2>Recebido e despesas</h2><span class="sp"></span><span class="legend"><span><i class="legend-dot" style="background:var(--accent)"></i>Recebido</span><span><i class="legend-dot" style="background:var(--gold)"></i>Despesas</span></span></div><div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recebido e despesas nos últimos quatro meses, em reais">${g}</svg></div><p class="hint">Valores em reais, pelo mês do pagamento ou da despesa.</p></section>`}

let fm=null,ftab='cobrancas',ff='todas';
function renderFinanceiro(){
  syncCharges();if(!fm)fm=todayKey().slice(0,7);const k=finMonth(fm);const[y,m]=fm.split('-').map(Number);
  let body='';
  if(ftab==='cobrancas'){
    const list=S.fin.charges.filter(c=>ff==='atraso'?isLate(c):c.date.slice(0,7)===fm&&(ff==='todas'||(ff==='pendentes'&&c.status==='pendente')||(ff==='pagas'&&c.status==='pago'))).sort((a,b)=>b.date.localeCompare(a.date));
    body=`<div class="panel-head"><div class="seg" role="group" aria-label="Filtrar cobranças">${[['todas','Todas'],['pendentes','A receber'],['atraso','Em atraso (todas)'],['pagas','Pagas']].map(([v,l])=>`<button data-act="ff" data-v="${v}" aria-pressed="${ff===v}">${l}</button>`).join('')}</div><span class="sp"></span><span class="hint">${list.length} cobranças · ${brl(fsum(list.filter(c=>c.status!=='isento')))}</span></div>
    ${list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Paciente</th><th>Descrição</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>${list.map(chargeRow).join('')}</tbody></table></div>`:'<p class="empty">Nenhuma cobrança neste filtro.</p>'}`;
  }else if(ftab==='despesas'){
    const list=S.fin.expenses.filter(e=>e.date.slice(0,7)===fm).sort((a,b)=>b.date.localeCompare(a.date));const byCat={};list.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+(+e.amount));
    body=`<div class="panel-head"><div class="chips">${Object.entries(byCat).map(([c,v])=>`<span class="pill encerrado">${esc(c)} · ${brl(v)}</span>`).join('')}</div><span class="sp"></span><button class="btn sm primary" data-act="fExp">Nova despesa</button></div>
    ${list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th><th></th></tr></thead><tbody>${list.map(e=>`<tr><td class="mono">${fmtShort(e.date)}</td><td>${esc(e.desc)}</td><td>${esc(e.cat)}</td><td class="num mono">${brl(e.amount)}</td><td class="acts">${dd('⋯',[{label:'Editar',hint:'Data, descrição, categoria ou valor',act:'fExp',data:{id:e.id}},'-',{label:'Excluir',hint:'Remove a despesa, após confirmação',act:'fExpDel',data:{id:e.id},danger:true}],'icon-btn',true)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total do mês</td><td class="num mono">${brl(fsum(list))}</td><td></td></tr></tfoot></table></div>`:'<p class="empty">Nenhuma despesa lançada neste mês.</p>'}`;
  }else{
    const pts=S.patients.filter(p=>p.sit!=='encerrado'||S.fin.charges.some(c=>c.pid===p.id&&c.status==='pendente')).sort((a,b)=>pname(a).localeCompare(pname(b)));
    body=`<p class="hint" style="margin:0">O valor da sessão vale para as próximas cobranças. Cobranças já geradas mantêm o valor original e podem ser editadas uma a uma.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Paciente</th><th class="num">Valor da sessão</th><th class="num">Sessões no mês</th><th class="num">Recebido no mês</th><th class="num">Em aberto</th><th></th></tr></thead><tbody>${pts.map(p=>{const ch=S.fin.charges.filter(c=>c.pid===p.id);const sm=ch.filter(c=>c.date.slice(0,7)===fm&&c.status!=='isento').length;const rec=fsum(ch.filter(c=>c.status==='pago'&&(c.paidAt||'').slice(0,7)===fm));const ab=ch.filter(c=>c.status==='pendente');const late=ab.some(isLate);
      return `<tr><td>${esc(pname(p))}</td><td class="num mono">${brl(priceFor(p.id))}${S.fin.prices[p.id]==null?' <span class="pill encerrado">padrão</span>':''}</td><td class="num mono">${sm}</td><td class="num mono">${brl(rec)}</td><td class="num mono" style="color:${late?'var(--bad)':'inherit'}">${brl(fsum(ab))}</td><td class="acts"><button class="btn sm" data-act="fPrice" data-pid="${p.id}">Alterar valor</button></td></tr>`}).join('')}</tbody></table></div>`;
  }
  $('#view').innerHTML=`<div class="view-in">
  <div class="page-head"><div><div class="eyebrow">Gestão financeira</div><h1>Financeiro</h1><div class="sub">${MES[m-1][0].toUpperCase()+MES[m-1].slice(1)} de ${y} · separado do prontuário clínico</div></div><span class="sp"></span>
    <div class="seg"><button data-act="fMonth" data-n="-1" aria-label="Mês anterior">‹</button><button data-act="fMonth" data-n="0">Mês atual</button><button data-act="fMonth" data-n="1" aria-label="Próximo mês">›</button></div>
    ${dd('Lançar',[{label:'Cobrança avulsa',hint:'Valor fora de uma sessão agendada, como relatório ou devolutiva',act:'fCharge'},{label:'Despesa',hint:'Aluguel, supervisão, materiais e outros custos do consultório',act:'fExp'},'-',{label:'Valores e prazos',hint:'Valor padrão da sessão, prazo de pagamento, cobrança de ausências e cidade do recibo',act:'finSettings'}],'btn primary')}</div>
  ${howto('Como funciona o financeiro',`<ul><li>Quando uma consulta é marcada como <b>Realizada</b> na agenda, uma cobrança é criada com o valor da sessão do paciente e o prazo definido em Valores e prazos.</li><li><b>Receber</b> registra data, forma e valor do pagamento e numera o recibo. <b>Recibo</b> mostra o texto pronto, com valor por extenso, para copiar.</li><li>Cobrança vencida e não paga aparece como <b>Em atraso</b> e entra nas pendências do painel.</li><li>A recepção também acessa este módulo; nada do prontuário clínico aparece aqui.</li></ul>`)}
  <div class="stats kpis">
    <button type="button" class="stat" data-act="drill" data-k="recebido" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money">${brl(k.recebido)}</span><span class="l">Recebido no mês <span class="caret">▾</span></span></button>
    <button type="button" class="stat" data-act="drill" data-k="areceber" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money">${brl(k.aReceber)}</span><span class="l">A receber (no prazo) <span class="caret">▾</span></span></button>
    <button type="button" class="stat" data-act="drill" data-k="atraso" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money" style="color:${k.atraso?'var(--bad)':'inherit'}">${brl(k.atraso)}</span><span class="l">Em atraso · ${k.nAtraso} cobranças <span class="caret">▾</span></span></button>
    <button type="button" class="stat" data-act="drill" data-k="despesas" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money">${brl(k.despesas)}</span><span class="l">Despesas do mês <span class="caret">▾</span></span></button>
    <button type="button" class="stat" data-act="drill" data-k="resultado" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n money">${brl(k.resultado)}</span><span class="l">Resultado do mês <span class="caret">▾</span></span></button>
    ${on('agenda')?`<button type="button" class="stat" data-act="drill" data-k="ocupacao" data-m="${fm}" aria-haspopup="true" aria-expanded="false"><span class="n">${k.ocup}%</span><span class="l">Ocupação da agenda <span class="caret">▾</span></span></button>`:''}
  </div>
  ${finChart()}
  <section class="panel"><div class="tabs" role="tablist">${[['cobrancas','Cobranças'],['despesas','Despesas'],['pacientes','Por paciente']].map(([t,l])=>`<button role="tab" aria-selected="${ftab===t}" data-act="ftab" data-t="${t}">${l}</button>`).join('')}</div>${body}</section>
  </div>`;
}
function chargeRow(c){const p=getP(c.pid);const late=isLate(c);
  const sit=c.status==='pago'?`<span class="pill finalizado">Pago ${fmtShort(c.paidAt)} · ${esc(c.method)}</span>`:c.status==='isento'?'<span class="pill encerrado">Isento</span>':late?`<span class="pill st-cancelado">Em atraso · venceu ${fmtShort(c.due)}</span>`:`<span class="pill rascunho">A receber · vence ${fmtShort(c.due)}</span>`;
  const acts=c.status==='pendente'?`<button class="btn sm primary" data-act="fPay" data-id="${c.id}">Receber</button>${dd('⋯',[{label:'Editar valor',hint:'Ajusta o valor só desta cobrança',act:'fEdit',data:{id:c.id}},{label:'Isentar',hint:'Marca como sem cobrança, por exemplo sessão social',act:'fExempt',data:{id:c.id}}],'icon-btn',true)}`
    :c.status==='pago'?`<button class="btn sm" data-act="fReceipt" data-id="${c.id}">Recibo</button>${dd('⋯',[{label:'Estornar pagamento',hint:'Volta a cobrança para “a receber”',act:'fUnpay',data:{id:c.id}}],'icon-btn',true)}`
    :dd('⋯',[{label:'Reabrir cobrança',hint:'Volta a cobrança para “a receber”',act:'fUnpay',data:{id:c.id}}],'icon-btn',true);
  return `<tr><td class="mono">${fmtShort(c.date)}</td><td>${esc(pname(p))}</td><td>${esc(c.desc)}${c.demo?' '+DEMOS:''}</td><td class="num mono">${brl(c.amount)}</td><td>${sit}</td><td class="acts">${acts}${c.demo&&canAdmin()?`<button class="btn sm ghost danger" data-act="demoDel" data-k="charge" data-id="${c.id}">Excluir exemplo</button>`:''}</td></tr>`}
const fCh=id=>S.fin.charges.find(x=>x.id===id);
ACT.ftab=d=>{ftab=d.t;renderFinanceiro()};ACT.ff=d=>{ff=d.v;renderFinanceiro()};
ACT.fMonth=d=>{const n=+d.n;if(!n)fm=todayKey().slice(0,7);else{const[y,m]=fm.split('-').map(Number);fm=dkey(new Date(y,m-1+n,1)).slice(0,7)}renderFinanceiro()};
ACT.fPay=d=>{const c=fCh(d.id);modal('Registrar pagamento',`<form id="f-pay" class="form"><p class="hint" style="margin:0">${esc(pname(getP(c.pid)))} · ${esc(c.desc)} · ${fmtD(P(c.date+'T00:00'))}</p>
  <div class="row3"><div class="field"><label for="py-d">Data do pagamento</label><input id="py-d" type="date" value="${todayKey()}"></div><div class="field"><label for="py-m">Forma de pagamento</label><select id="py-m">${PAY_METHODS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="py-v">Valor (R$)</label><input id="py-v" type="number" min="0" step="0.01" value="${c.amount}"></div></div>
  <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Confirmar recebimento</button></div></form>`);
  $('#f-pay').onsubmit=e=>{e.preventDefault();const v=+$('#py-v').value;if(!(v>0)){toast('Informe um valor maior que zero');return}
    Object.assign(c,{status:'pago',paidAt:$('#py-d').value||todayKey(),method:$('#py-m').value,amount:v,receipt:c.receipt||++S.fin.seq});save();closeModal();renderFinanceiro();toast(`Pagamento registrado · recibo nº ${String(c.receipt).padStart(4,'0')}`)}};
ACT.fUnpay=d=>{const c=fCh(d.id);c.status='pendente';delete c.paidAt;delete c.method;save();renderFinanceiro();toast('Cobrança reaberta')};
ACT.fExempt=d=>{fCh(d.id).status='isento';save();renderFinanceiro();toast('Cobrança isenta')};
ACT.fEdit=d=>{const c=fCh(d.id);modal('Editar valor',`<form id="f-ed" class="form"><div class="field"><label for="ed-v">Valor desta cobrança (R$)</label><input id="ed-v" type="number" min="0" step="0.01" value="${c.amount}"></div><div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`);
  $('#f-ed').onsubmit=e=>{e.preventDefault();const v=+$('#ed-v').value;if(!(v>=0))return;c.amount=v;save();closeModal();renderFinanceiro();toast('Valor atualizado')}};
ACT.fCharge=()=>{const pts=S.patients.filter(p=>p.sit!=='encerrado').sort((a,b)=>pname(a).localeCompare(pname(b)));
  modal('Cobrança avulsa',`<form id="f-ch" class="form"><div class="field"><label for="ch-p">Paciente</label><select id="ch-p">${pts.map(p=>`<option value="${p.id}">${esc(pname(p))}</option>`).join('')}</select></div>
  <div class="field"><label for="ch-d">Descrição</label><input id="ch-d" placeholder="Ex.: relatório psicológico"></div>
  <div class="row3"><div class="field"><label for="ch-dt">Data</label><input id="ch-dt" type="date" value="${todayKey()}"></div><div class="field"><label for="ch-due">Vencimento</label><input id="ch-due" type="date" value="${dkey(addDays(new Date(),+S.prefs.fin.prazo||0))}"></div><div class="field"><label for="ch-v">Valor (R$)</label><input id="ch-v" type="number" min="0" step="0.01" value="${S.prefs.fin.price}"></div></div>
  <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Lançar cobrança</button></div></form>`);
  $('#f-ch').onsubmit=e=>{e.preventDefault();const v=+$('#ch-v').value;const desc=$('#ch-d').value.trim();if(!desc||!(v>0)){toast('Informe descrição e valor');return}
    S.fin.charges.push({id:uid(),apptId:null,pid:$('#ch-p').value,date:$('#ch-dt').value||todayKey(),due:$('#ch-due').value||todayKey(),amount:v,desc,status:'pendente'});save();closeModal();ftab='cobrancas';renderFinanceiro();toast('Cobrança lançada')}};
ACT.fExp=d=>{const x=d.id?S.fin.expenses.find(e=>e.id===d.id):{date:todayKey(),desc:'',cat:EXP_CATS[0],amount:''};
  modal(d.id?'Editar despesa':'Nova despesa',`<form id="f-ex" class="form"><div class="field"><label for="ex-d">Descrição</label><input id="ex-d" value="${esc(x.desc)}"></div>
  <div class="row3"><div class="field"><label for="ex-dt">Data</label><input id="ex-dt" type="date" value="${x.date}"></div><div class="field"><label for="ex-c">Categoria</label><select id="ex-c">${EXP_CATS.map(c=>`<option ${x.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="ex-v">Valor (R$)</label><input id="ex-v" type="number" min="0" step="0.01" value="${x.amount}"></div></div>
  <div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar despesa</button></div></form>`);
  $('#f-ex').onsubmit=e=>{e.preventDefault();const v=+$('#ex-v').value,desc=$('#ex-d').value.trim();if(!desc||!(v>0)){toast('Informe descrição e valor');return}
    const rec={date:$('#ex-dt').value||todayKey(),desc,cat:$('#ex-c').value,amount:v};if(d.id)Object.assign(x,rec);else S.fin.expenses.push({id:uid(),...rec});
    fm=rec.date.slice(0,7);ftab='despesas';save();closeModal();renderFinanceiro();toast('Despesa salva')}};
ACT.fExpDel=d=>{const x=S.fin.expenses.find(e=>e.id===d.id);modal('Excluir despesa',`<p style="margin-top:0">Excluir “${esc(x.desc)}” (${brl(x.amount)})?</p><div class="form-actions"><span class="sp"></span><button class="btn ghost" data-close>Cancelar</button><button class="btn danger solid" data-act="fExpDelOk" data-id="${x.id}">Excluir</button></div>`)};
ACT.fExpDelOk=d=>{S.fin.expenses=S.fin.expenses.filter(e=>e.id!==d.id);save();closeModal();renderFinanceiro();toast('Despesa excluída')};
ACT.fPrice=d=>{const p=getP(d.pid);const cur=S.fin.prices[p.id];
  modal('Valor da sessão',`<form id="f-pr" class="form"><p class="hint" style="margin:0">${esc(pname(p))}. Deixe em branco para usar o valor padrão (${brl(S.prefs.fin.price)}).</p><div class="field"><label for="pr-v">Valor por sessão (R$)</label><input id="pr-v" type="number" min="0" step="0.01" value="${cur??''}"></div><div class="form-actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>Fechar</button><button class="btn primary">Salvar</button></div></form>`);
  $('#f-pr').onsubmit=e=>{e.preventDefault();const v=$('#pr-v').value;if(v==='')delete S.fin.prices[p.id];else S.fin.prices[p.id]=+v;save();closeModal();renderFinanceiro();toast('Valor atualizado')}};
ACT.finSettings=()=>{const f=S.prefs.fin;
  modal('Valores e prazos',`<form id="f-fs" class="form"><div class="row2"><div class="field">${info('fs-p','Valor padrão da sessão (R$)','Usado para pacientes sem valor próprio. Muda só as próximas cobranças.')}<input id="fs-p" type="number" min="0" step="0.01" value="${f.price}"></div>
  <div class="field">${info('fs-z','Prazo de pagamento (dias)','Dias entre a sessão e o vencimento. Zero significa pagamento no dia da sessão.')}<input id="fs-z" type="number" min="0" max="60" value="${f.prazo}"></div></div>

function tourGo(pos){if(!tour)return;if(pos<0)pos=0;if(pos>=tour.list.length){tourEnd(true);return}tour.pos=pos;const s=TOUR[tour.list[pos]];
  if(s.pre)s.pre();if(current!==s.r||s.pre)go(s.r);
  setTimeout(()=>{if(!tour)return;const el=document.querySelector(s.sel);
    if(!el||!el.getClientRects().length){tour.list.splice(pos,1);tourGo(pos);return}
    tour.el=el;el.scrollIntoView({block:'center'});const n=tour.list.length,last=pos===n-1;
    $('.tour-card').innerHTML=`<div class="tour-step">Passo ${pos+1} de ${n}</div><h3 id="tour-t">${s.t}</h3><p>${s.x}</p><div class="tour-bar"><span style="width:${(pos+1)/n*100}%"></span></div><div class="tour-actions"><button class="btn sm ghost" data-act="tourEnd">Sair</button><span class="sp"></span>${pos?'<button class="btn sm" data-act="tourPrev">Voltar</button>':''}<button class="btn sm primary" data-act="tourNext">${last?'Concluir':'Próximo'}</button></div>`;
    requestAnimationFrame(()=>{tourPlace();const b=$('.tour-card [data-act=tourNext]');b&&b.focus({preventScroll:true})})},150)}
function tourPlace(){if(!tour||!tour.el||!tour.el.isConnected)return;const r=tour.el.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,pd=6;
  const top=Math.max(6,r.top-pd),left=Math.max(6,r.left-pd),w=Math.min(r.width+pd*2,vw-12),h=Math.min(r.height+pd*2,vh-12);
  Object.assign($('.tour-hole').style,{top:top+'px',left:left+'px',width:w+'px',height:h+'px'});
  const card=$('.tour-card'),cw=card.offsetWidth,ch=card.offsetHeight;let ct,cl;
  if(vw<640){cl=(vw-cw)/2;ct=(top+h/2>vh/2)?16:vh-ch-16}
  else if(top+h+14+ch<vh-8){ct=top+h+14;cl=Math.min(Math.max(16,left),vw-cw-16)}
  else if(top-14-ch>8){ct=top-14-ch;cl=Math.min(Math.max(16,left),vw-cw-16)}
  else if(left+w+16+cw<vw-8){cl=left+w+16;ct=Math.min(Math.max(16,top),vh-ch-16)}
  else if(left-16-cw>8){cl=left-16-cw;ct=Math.min(Math.max(16,top),vh-ch-16)}
  else{cl=(vw-cw)/2;ct=vh-ch-16}
  Object.assign(card.style,{top:ct+'px',left:cl+'px'})}
ACT.tourNext=()=>tourGo(tour.pos+1);ACT.tourPrev=()=>tourGo(tour.pos-1);ACT.tourEnd=()=>tourEnd(false);

ACT.demoPurgeOk=()=>{const dp=new Set(S.patients.filter(p=>p.demo).map(p=>p.id));const keep=x=>!x.demo&&!dp.has(x.pid);
  S.patients=S.patients.filter(p=>!p.demo);S.appts=S.appts.filter(keep);Object.keys(S.clinical).forEach(k=>{if(dp.has(k)||S.clinical[k].demo)delete S.clinical[k]});
  S.evol=S.evol.filter(keep);S.emdr=S.emdr.filter(keep);S.reports=S.reports.filter(keep);S.tele=S.tele.filter(keep);S.notes=S.notes.filter(n=>!n.demo&&!dp.has(n.pid));

ACT.demoDelOk=d=>{const id=d.id;const only=arr=>arr.filter(x=>!(x.id===id&&x.demo));
  switch(d.k){
    case'patient':{const p=getP(id);if(!p||!p.demo)break;const keep=x=>x.pid!==id;S.patients=S.patients.filter(x=>x.id!==id);S.appts=S.appts.filter(keep);delete S.clinical[id];S.evol=S.evol.filter(keep);S.emdr=S.emdr.filter(keep);S.notes=S.notes.filter(keep);S.fin.charges=S.fin.charges.filter(keep);S.reports=S.reports.filter(keep);S.tele=S.tele.filter(keep);S.audit=S.audit.filter(keep);delete S.fin.prices[id];if(ui.pid===id)ui.pid=null;break}
    case'appt':S.appts=only(S.appts);break;case'evol':S.evol=only(S.evol);break;case'emdr':S.emdr=only(S.emdr);break;
    case'charge':S.fin.charges=only(S.fin.charges);break;case'report':S.reports=only(S.reports);break;case'tele':S.tele=only(S.tele);break}

async function xlsx(name,sheets){try{await loadLib('xlsx')}catch(e){toast('Não foi possível carregar o gerador de Excel. Verifique a conexão com a internet.');return}
  const X=window.XLSX;const wb=X.utils.book_new();
  for(const [sn,rows] of sheets){const data=rows.length?rows:[{'Sem dados':'Nenhum registro no período'}];const ws=X.utils.json_to_sheet(data);const keys=Object.keys(data[0]);ws['!cols']=keys.map(k=>({wch:Math.min(60,Math.max(k.length,...data.map(r=>String(r[k]??'').length))+2)}));X.utils.book_append_sheet(wb,ws,sn.slice(0,31))}
  if(isNative()){await saveFile(name,new Blob([X.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));return}
  try{X.writeFile(wb,name);toast(`Planilha gerada: ${name}`)}catch(e){toast('O navegador bloqueou o download. Use o arquivo HTML salvo no computador.')}}
const dm=x=>x&&x.demo?'Sim':'';
const per=()=>`${rp.from}_a_${rp.to}`;
const pnm=id=>pname(getP(id));
function finTables(){const f=finRange();const months={};const addM=(k,field,v)=>{const m=k.slice(0,7);months[m]=months[m]||{'Mês':`${m.slice(5,7)}/${m.slice(0,4)}`,'Faturado (R$)':0,'Recebido (R$)':0,'Despesas (R$)':0};months[m][field]+=+v};
  S.fin.charges.filter(c=>c.status!=='isento'&&inR(c.date)).forEach(c=>addM(c.date,'Faturado (R$)',c.amount));f.paid.forEach(c=>addM(c.paidAt,'Recebido (R$)',c.amount));f.exp.forEach(e=>addM(e.date,'Despesas (R$)',e.amount));
  const mon=Object.keys(months).sort().map(k=>({...months[k],'Resultado (R$)':months[k]['Recebido (R$)']-months[k]['Despesas (R$)']}));
  const years={};mon.forEach(m=>{const y=m['Mês'].slice(3);const Y=years[y]=years[y]||{'Ano':y,'Faturado (R$)':0,'Recebido (R$)':0,'Despesas (R$)':0,'Resultado (R$)':0};['Faturado (R$)','Recebido (R$)','Despesas (R$)','Resultado (R$)'].forEach(k=>Y[k]+=m[k])});
  const byP={};S.fin.charges.filter(c=>inR(c.date)||inR(c.paidAt)).forEach(c=>{const r=byP[c.pid]=byP[c.pid]||{'Paciente':pnm(c.pid),'Sessões cobradas':0,'Recebido (R$)':0,'Em aberto (R$)':0,'Demonstração':dm(getP(c.pid))};if(inR(c.date)&&c.status!=='isento')r['Sessões cobradas']++;if(c.status==='pago'&&inR(c.paidAt))r['Recebido (R$)']+=+c.amount;if(c.status==='pendente')r['Em aberto (R$)']+=+c.amount});
  return{f,mon,years:Object.values(years),byP:Object.values(byP)}}

  ['Pendentes',f.pend.map(c=>({'Data':fmtK(c.date),'Vencimento':fmtK(c.due),'Paciente':pnm(c.pid),'Descrição':c.desc,'Valor (R$)':+c.amount,'Situação':isLate(c)?'Em atraso':'No prazo','Demonstração':dm(c)}))],

    case'recebido':return{t:`Recebido · ${mesNome}`,items:F.charges.filter(c=>c.status==='pago'&&(c.paidAt||'').slice(0,7)===mk).sort((a,b)=>b.paidAt.localeCompare(a.paidAt)).map(ch),more:{label:'Abrir o financeiro',act:'goFin'}};
    case'atraso':return{t:'Cobranças em atraso',items:F.charges.filter(isLate).sort((a,b)=>a.due.localeCompare(b.due)).map(ch),more:{label:'Abrir o financeiro',act:'goFin'}};

    case'despesas':return{t:`Despesas · ${mesNome}`,items:F.expenses.filter(e=>e.date.slice(0,7)===mk).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>({label:e.desc,sub:`${fmtShort(e.date)} · ${e.cat}`,right:brl(e.amount),act:'goFin'})),more:{label:'Lançar despesa',act:'fExp'}};
    case'resultado':{const f=finMonth(mk);return{t:`Resultado · ${mesNome}`,items:[{label:'Recebido',right:brl(f.recebido)},{label:'Despesas',right:'− '+brl(f.despesas)},{label:'Resultado',sub:'Recebido menos despesas',right:brl(f.resultado)}],more:null}}

const REC={mr:null,chunks:[],streams:[],ctx:null,start:0,last:null,files:{},mode:'audio',stopP:null,name:''};
const TR={rec:null,on:false,t:0};
const mb=b=>`${(b/1048576).toFixed(1).replace('.',',')} MB`;
function recPanelHtml(){const L=S.teleLive;const ok=!!L.consent;const recOn=!!(REC.mr&&REC.mr.state==='recording');const trOn=TR.on;
  return `<div class="recbox"><div class="panel-head"><h3>Gravação e transcrição</h3><span class="sp"></span>${recOn?`<span class="rec-dot">● Gravando <span class="mono" id="rc-clock">00:00</span></span>`:''}${trOn?'<span class="pill st-confirmado">Transcrevendo</span>':''}</div>
  <div class="transport"><button class="btn sm" data-act="consentReq" ${RTC.conn&&RTC.conn.open?'':'disabled'}>Pedir autorização ao paciente pela sala</button>${L.consentBy?`<span class="pill ${ok?'finalizado':'rascunho'}">${ok?'Autorizado':'Não autorizado'} ${esc(L.consentBy)}</span>`:''}</div>
  <label class="check"><input type="checkbox" id="tl-consent" ${ok?'checked':''} ${recOn||trOn?'disabled':''}> O paciente autorizou a gravação e a transcrição desta sessão</label>
  <div class="row2"><div class="field">${info('tl-rmode','O que gravar','Somente áudio gera arquivos bem menores. Áudio e vídeo grava também a imagem da aba da sala de vídeo.')}<select id="tl-rmode" ${recOn?'disabled':''}><option value="audio">Somente áudio</option><option value="video" ${REC.mode==='video'?'selected':''}>Áudio e vídeo da sala</option></select></div></div>
  <div class="transport">${recOn?'<button class="btn danger solid" data-act="recStop">■ Parar gravação</button>':`<button class="btn" data-act="recStart" ${ok?'':'disabled'}>● Gravar sessão</button>`}${trOn?'<button class="btn" data-act="trStop">Parar transcrição</button>':`<button class="btn" data-act="trStart" ${ok?'':'disabled'}>Iniciar transcrição</button>`}${REC.last?`<a class="btn primary" href="${REC.last.url}" download="${esc(REC.last.name)}">Baixar gravação (${mb(REC.last.size)})</a>`:''}</div>
  <div class="field">${info('tl-trans','Transcrição','Texto reconhecido pelo microfone, com o tempo da sessão. Corrija o que precisar antes de exportar. A transcrição automática capta melhor quem fala perto do microfone; com fones de ouvido, evita-se eco.')}<textarea id="tl-trans" rows="6" placeholder="${ok?'Clique em Iniciar transcrição':'Marque a autorização do paciente para habilitar'}">${esc(L.transcript||'')}</textarea><span class="hint" id="tl-interim"></span></div>
  <div class="form-actions"><button class="btn sm" data-act="trTxt">Exportar transcrição (.txt)</button><button class="btn sm" data-act="trPdf">Transcrição em PDF</button></div>
  <p class="hint" style="margin:0">Com o paciente na sala, a gravação junta a sua voz e a dele (e o vídeo dele, se escolher Áudio e vídeo), sem precisar compartilhar tela. Na transcrição, as falas aparecem como Psicóloga e Paciente; a do paciente é feita no aparelho dele, depois da autorização. A gravação fica só no seu computador. A transcrição automática usa o serviço de voz do navegador (Chrome ou Edge), que processa o áudio fora do sistema. Grave apenas com autorização registrada e guarde os arquivos em local protegido. No link do Claude, gravação e downloads ficam bloqueados; use o arquivo HTML.</p></div>`}
function bindRecPanel(){const c=$('#tl-consent');if(c)c.onchange=()=>{S.teleLive.consent=c.checked;const a=S.appts.find(x=>x.id===S.teleLive.apptId);audit(c.checked?'Autorização do paciente para gravação e transcrição registrada':'Autorização de gravação e transcrição desmarcada',a&&a.pid);save();renderTele()};
  const m=$('#tl-rmode');if(m)m.onchange=()=>{REC.mode=m.value};
  const t=$('#tl-trans');if(t)t.oninput=()=>{S.teleLive.transcript=t.value;clearTimeout(TR.t);TR.t=setTimeout(save,500)}}
ACT.recStart=async()=>{const L=S.teleLive;if(!L||!L.consent){toast('Registre a autorização do paciente antes de gravar');return}
  if(RTC.remote&&window.MediaRecorder){return recStartRtc()}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.MediaRecorder){toast('Este navegador não permite gravar aqui. Use Chrome ou Edge no computador.');return}
  let disp=null,mic=null;
  try{disp=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true})}catch(e){toast('Gravação não iniciada. Escolha a aba da sala de vídeo e marque “Compartilhar áudio da aba”.');return}
  try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){}
  const ctx=new(window.AudioContext||window.webkitAudioContext)();const dest=ctx.createMediaStreamDestination();
  const tabA=disp.getAudioTracks();if(tabA.length)ctx.createMediaStreamSource(new MediaStream(tabA)).connect(dest);if(mic)ctx.createMediaStreamSource(mic).connect(dest);
  if(!tabA.length&&!mic){disp.getTracks().forEach(t=>t.stop());ctx.close();toast('Nenhum áudio disponível para gravar.');return}
  const video=REC.mode==='video';const tracks=[...dest.stream.getAudioTracks(),...(video?disp.getVideoTracks():[])];
  const types=video?['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']:['audio/webm;codecs=opus','audio/webm','audio/mp4'];
  const mime=types.find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}})||'';
  let mr;try{mr=new MediaRecorder(new MediaStream(tracks),mime?{mimeType:mime}:undefined)}catch(e){disp.getTracks().forEach(t=>t.stop());mic&&mic.getTracks().forEach(t=>t.stop());ctx.close();toast('Não foi possível iniciar a gravação neste navegador.');return}
  const a=S.appts.find(x=>x.id===L.apptId);const p=getP(a&&a.pid);const ext=mime.includes('mp4')?(video?'mp4':'m4a'):'webm';const n=new Date();
  REC.name=`teleconsulta_${slug(pname(p))}_${dkey(n)}_${pad(n.getHours())}h${pad(n.getMinutes())}.${ext}`;
  REC.chunks=[];REC.streams=[disp,mic].filter(Boolean);REC.ctx=ctx;REC.mr=mr;REC.start=Date.now();REC.last=null;
  REC.stopP=new Promise(res=>{mr.onstop=()=>{const blob=new Blob(REC.chunks,{type:mr.mimeType||mime||(video?'video/webm':'audio/webm')});REC.last={url:URL.createObjectURL(blob),size:blob.size,name:REC.name};res()}});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};mr.start(1000);
  disp.getVideoTracks().forEach(t=>t.onended=()=>{if(REC.mr&&REC.mr.state==='recording')recStop().then(()=>{if(current==='teleconsulta')renderTele();toast('Compartilhamento encerrado. Gravação concluída.')})});
  if(!tabA.length)toast('Sem áudio da aba: somente o microfone será gravado.');
  L.recorded=true;audit('Gravação de teleconsulta iniciada (autorização registrada)',a&&a.pid);save();renderTele()};
async function recStop(){const mr=REC.mr;if(!mr)return;if(mr.state!=='inactive')mr.stop();await REC.stopP;REC.streams.forEach(s=>s.getTracks().forEach(t=>t.stop()));try{REC.ctx&&REC.ctx.close()}catch(e){}REC.mr=null;REC.streams=[]}
ACT.recStop=async()=>{await recStop();renderTele();toast('Gravação concluída. Use Baixar gravação para salvar no computador.')};
ACT.trStart=()=>{const L=S.teleLive;if(!L||!L.consent){toast('Registre a autorização do paciente antes de transcrever');return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('A transcrição automática funciona no Chrome e no Edge.');return}
  const r=new SR();r.lang='pt-BR';r.continuous=true;r.interimResults=true;
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)trAppend(res[0].transcript.trim(),'Psicóloga');else interim+=res[0].transcript}const el=$('#tl-interim');if(el)el.textContent=interim};
  r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){TR.on=false;toast('Não foi possível usar o microfone para a transcrição.');if(current==='teleconsulta')renderTele()}};
  r.onend=()=>{if(TR.on){try{r.start()}catch(e){}}};

function onPjMsg(m){if(!m||!m.id||pjSeen.has(m.id))return;pjSeen.add(m.id);if(pjSeen.size>500)pjSeen.clear();

    else if(m.type==='present'){if(PATIENT){document.body.classList.toggle('pj-present',!!m.on);if(m.cfg)PJ.cfg={...PJ.cfg,...m.cfg};document.body.classList.toggle('hide-psi',PJ.cfg.showPsi===false);if(!m.on&&PJ.running)pjFinish('apresentação encerrada');pjUi()}}else if(m.type==='pause'){if(PJ.running){PJ.paused=true;pjUi();pjStatus()}}else if(m.type==='resume'){if(PJ.running){PJ.paused=false;pjUi();pjStatus()}}
